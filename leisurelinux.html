const listEl = document.getElementById('list');
const statsEl = document.getElementById('stats');
const qEl = document.getElementById('q');
const topicEl = document.getElementById('topic');
const yearEl = document.getElementById('year');

document.getElementById('total').textContent = DATA.length;

// 填充筛选下拉
const topics = [...new Set(DATA.map(d=>d.topic))].sort();
const years = [...new Set(DATA.map(d=>d.year))].sort().reverse();
topicEl.innerHTML = '<option value="">全部主题</option>' + topics.map(t=>`<option>${t}</option>`).join('');
yearEl.innerHTML = '<option value="">全部年份</option>' + years.map(y=>`<option>${y}</option>`).join('');

function badge(s){
  if(s>=6) return `<span class="badge">GEO ${s}/7</span>`;
  if(s>0)  return `<span class="badge low">GEO ${s}/7</span>`;
  return '';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  const q = qEl.value.trim().toLowerCase();
  const tp = topicEl.value, yr = yearEl.value;
  let rows = DATA.filter(d=>
    (!q || d.title.toLowerCase().includes(q)) &&
    (!tp || d.topic===tp) &&
    (!yr || d.year===yr));
  statsEl.textContent = `当前显示 ${rows.length} 篇`;
  if(!rows.length){ listEl.innerHTML='<div class="empty">没有匹配的文章</div>'; return; }
  // 按年份分组
  const groups = {};
  rows.forEach(d=>{(groups[d.year]=groups[d.year]||[]).push(d);});
  let html='';
  Object.keys(groups).sort().reverse().forEach(y=>{
    html += `<div class="year-h">${y} 年（${groups[y].length}）</div>`;
    groups[y].forEach(d=>{
      const link = d.link || '#';
      html += `<div class="item">
        <div class="t"><a href="${esc(link)}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
        <div class="m"><span>${esc(d.date)}</span><span class="tag">${esc(d.topic)}</span>${badge(d.score)}</div>
      </div>`;
    });
  });
  listEl.innerHTML = html;
}
render();
</script>
