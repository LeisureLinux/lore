summary: "Linux 7.3 合并窗口接近关闭，NFS 客户端与服务端 pull request 都已合入。服务端（NFSD）这一波最重磅：支持 NFSv4.1 目录委派（CB_NOTIFY 回调 + FSNOTIFY），同时把传统服务线程池换成 per-node 模型；客户端（NFS）这一波以 bug fix 为主，亮点是 NFS/localio 的 I/O 提交优化与 NFSv4.2 新增'禁止客户端缓存'语义。本文详解服务端 200+ 文件 / 6000+ 新增行、客户端 100+ 修复的所有具体改动、运维升级建议与下一个版本的关注点。"
description: "Linux 7.3 NFS 是 2026 年 8 月合并窗口接近结束时的服务端 + 客户端双向发力版本。服务端（NFSD）由 Chuck Lever 主导，最重要的变化包括：(1) 支持 NFSv4.1 目录委派（CB_NOTIFY 回调 + FSNOTIFY 机制，让服务端用内核 FSNOTIFY 监控目录，在目录变更时立即回调客户端取消之前持有的目录委派，确保客户端视图与服务端真实状态一致）；(2) 把传统 NFSD 服务线程池换成 per-node 模型，更适合多 socket / 多节点主机的 NFS 工作负载；(3) sunrpc 路由到 populated pool（svc_pool_for_cpu）、guarantee a thread per pool；(4) NFSv4 回调操作按 netns 计数并通过 netlink 暴露（NFSv4 callback op stats via netlink），便于 Prometheus 监控；(5) 异步 COPY 改造：nfsd4_copy 拆为 transient / durable async copy objects，copy offload stateid 提升为一等公民；(6) lockd 一批修复（NLMv4 GRANTED_MSG 处理、nlmsvc_match_ip 互换参数、NLM_SHARE 多 grant 保留、NFSv2/3 SETATTR 时间字段越界等）。客户端（NFS）由 Trond Myklebust 主导：亮点是 (1) NFS/localio I/O 提交优化（optimise I/O submission when not doing memory reclaim），对容器镜像分发、CI artifact 缓存场景有直接收益；(2) NFSv4.2 新增'服务端指示文件数据不可缓存'语义，给管理员更精细的一致性控制；(3) NFSv4/flexfiles 支持 loosely coupled NFSv4.x 数据服务器、pNFS 数据服务器缓存按 NFS 版本键控；(4) 一批 stable fixes（SunRPC client code use-after-free、NFSv4 委派哈希表泄漏、lockd lockowner NULL deref、SunRPC TLS 握手完成竞态、pNFS layout segment 泄漏、nfs4_delete_lease 错误参数、LAYOUTSTATS send buffer exhaustion 等）。Trond 给 Linus 的 commit message 因过于简洁被吐槽，是这次客户端 pull 的小插曲。本文详解服务端与客户端的具体改动、按场景的实战影响、运维升级建议与对下一个版本的关注点。"
