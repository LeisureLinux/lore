summary: "译介 CSO Online 报道（Maxwell Cooter，2026-09-18）：CISA 自 2026-09-28 起停止每周漏洞通报，官方归因于约束性操作指令 BOD 26-04（按真实风险/在野利用证据而非严重度评分排序补丁）。文章质疑两者并不互斥；真正驱动或为资源收缩与 AI 生成威胁激增。CISA 仍经 KEV、告警建议、CVE 目录发布信息，并建议 CISO 关注厂商公告。解读聚焦：排序逻辑从 CVSS 转向在野利用、BOD 理由站不住、一线应把 KEV 接入监控。"
description: "译介 CSO Online《CISA is ending its monthly vulnerability bulletin》(Maxwell Cooter, 2026-09-18) 并加工程解读。事实：CISA 将于 2026-09-28 停止每周已知漏洞通报(govdelivery 公告)；官方归因于 BOD 26-04（要求联邦机构按真实风险因素排序补丁优先级，如漏洞是否在野利用证据，而非仅看 severity scores）；作者质疑遵守 BOD 与继续发周报并不互斥；更紧迫背景是 AI 生成威胁激增、CISA 本月初警示恶意方盯上 AI 资产并用其发起攻击；CISA 建议 CISO 关注厂商/供应商自身安全公告，早前敦促厂商与安全研究者合作；停更后 CISA 仍经 KEV、Cybersecurity Alerts and Advisories、CVE catalogs 发布信息。解读：①真正变化是排序逻辑从 CVSS 转向在野利用证据，与 KEV 一致；②「BOD 逼停更」站不住，合规只需改口径不必删通道，真正驱动或为资源收缩/注意力转向 AI 威胁；③一线缺口需自补——订阅 KEV 进监控、盯厂商公告，补丁节奏勿依赖每周邮件。"
