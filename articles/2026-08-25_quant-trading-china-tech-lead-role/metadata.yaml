description: "本文以一份「全球量化/自营交易公司 · 中国区技术负责人」岗位的 Key Responsibilities 为底本，从工程视角逐条解码其八项职责：定义中国区技术战略并对齐全球架构与本地监管、主导低延迟交易系统（OMS/执行引擎/交易所接入）、端到端掌管行情/算法/风控/盘后技术栈、组建开发/SRE/基础设施/数据团队、保障网络安全与业务连续性并满足 CSRC/PBOC/数据安全法合规、推动云(AWS/Azure)/Kubernetes/CI-CD/IaC/可观测性等现代工程实践、作为中国区与纽约/伦敦/香港/新加坡全球团队的「首席技术接口」、评估 AI/ML 与硬件加速等新兴技术。文章重点剖析中国区特有的「监管×技术」约束（数据本地化、交易所接入 CTP/SSE、跨境协同），并给出职责到技术栈的对照表，附 CSRC、PBOC、网信办、全国人大、CTP、Kubernetes、CNCF、OpenOnload 等可点击参考链接。"
