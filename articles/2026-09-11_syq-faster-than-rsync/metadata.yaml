summary: "syq 是什么？跨洋传大文件比 rsync 快 8.82 倍、NFS 小文件快 8 倍的新工具。拆解它的四层速度来源：单文件并行分块、数据绕开 SSH 走独立加密 TCP、多 worker、放弃 rolling-checksum delta——以及它为速度付出的代价清单。"
description: "对 Rust 文件同步工具 syq 的深度研究：四场景基准数据、四层加速架构拆解（并行分块/TCP 数据通道/多 worker/无 delta）、代价清单与运维采用建议。"
