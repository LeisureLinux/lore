title: "Ubuntu 补丁慢到被点名：远程内核漏洞该按小时修"
date: 2026-11-25
slug: ubuntu-slow-security-response-oss-security
category: 技术/解读
author: FreeLAMP.com
original_source: "oss-security 邮件列表（Hanno Böck，2026-11-25）＋ 一手核对其引用的 Ubuntu CVE 跟踪页（CVE-2026-99288 / 99312 / 98432）、chalmovsky.com 分析与 GreyNoise 报告。"
description: "解读 Hanno Böck 在 oss-security 对 Ubuntu 安全响应速度的批评：NoisyTCP（CVE-2026-99288，Linux TCP 栈远程内存破坏）11-16 公开，9 天后 Ubuntu 仍无修复而其他发行版发布时就有；KVM 宿主机逃逸 CVE-2026-99312（11-18 公开）同样无补丁；CVE-2026-98432 曾拖数周且据报已在野利用。实测 Ubuntu CVE 跟踪页多个 LTS 全是 Vulnerable/work in progress。Böck 还指出 Ubuntu LTS 内核 7.0.0-44 走老版本回移路线，Debian stable 用 6.12.118+deb13 近期 LTS 内核，主张基于 kernel.org 长期支持版本。"
published: true
