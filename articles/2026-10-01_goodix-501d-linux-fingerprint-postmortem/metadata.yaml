summary: "一台 H3C 笔记本上的 Goodix 27c6:501d 指纹传感器，三天里我们把协议层完全打通：从驱动家族误判、PSK 哈希与密钥本体的区分，到用 Win11 虚机 SPICE 直通重新 provision、DPAPI 解封拿到 32 字节明文 PSK；从 usbmon 抓 Windows 真实流量修好 FDT 阈值常量，到录入成功。最后卡在匹配算法——SIGFM 分数无法区分真假手指（真 554~1845 / 陌生 1067~1091 重叠），NBIS 只有 0.38 细节点/帧。绕过它的两条路：Wine 里逆向 GoodixEngineAdapter.dll（29 导出 + 23 vtable 全解，但缺 WBDI 宿主，7 个设备接口虚函数无处实现），虚机里调 WinBio API（Windows Hello 完美工作，但 WinBioCaptureSample 被 Win11 安全策略 ACCESS_DENIED）。80×64 @ 500dpi 只有 13mm²，任何 host 侧匹配器都不可靠。这是一个有原因的、明确的放弃。"
description: "Goodix 27c6:501d 指纹在 Debian 13 / niri 下的完整适配复盘。技术路线全记录：①驱动家族误判——52xd 是硬编码白盒 PSK，501d 属 GM168SEC 家族（per-device sealed PSK），哈希可比对但 TLS 握手必失败；②PSK 提取——MCU cmd 0xE4 读 324B DPAPI sealed blob，原 Windows 已重装导致主密钥丢失，改用 Win11 虚机 SPICE usbredir 重新 provision + gm168_unseal.ps1 解出 32B 明文 PSK；③FDT 阈值修正——Linux 驱动的阈值常量来自 589a 固件，与 501d 不符，用 usbmon 抓 Windows 真实 40B 检测帧替换后触摸成功；④录入成功（14 次按压 cluster 13）；⑤匹配失败——SIGFM 真手指与陌生手指分数分布重叠，NBIS 0.38 minutiae/帧；⑥Wine 逆向 GoodixEngineAdapter.dll——29 导出/23 项 WBDI vtable/EngineParam 结构全解，但引擎初始化需 7 个设备接口虚函数回调（_GetSensorAttribute 发 cmd 0x442004），Wine 无 WBDI 宿主；⑦Win11 虚机 WinBio API——WinBioEnumBiometricUnits(Factor=8) 与 WinBioOpenSession 均成功，但 WinBioCaptureSample 被安全策略拒绝。结论：协议层全通，算法层不可用。"
