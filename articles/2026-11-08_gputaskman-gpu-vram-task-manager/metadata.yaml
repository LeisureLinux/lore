title: "gputaskman：一个 GPU 任务管理器，看清那 15GB 显存被谁吃了"
date: 2026-11-08
slug: gputaskman-gpu-vram-task-manager
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Scott Hanselman 的开源项目 shanselman/gputaskman 官方 README（含各平台可测指标矩阵、容器 PID 配对算法、WSL 跨命名空间方案与 AMD 驱动路径的实测记录）＋ Tom's Hardware 报道（Mark Tyson，2026-11-08，含作者实测 RTX 4060 的截图观察）＋ Windows Central 报道（2026-11-06）"
original_date: 2026-11-03
original_url: "https://github.com/shanselman/gputaskman"
description: "本文解读微软开发者 Scott Hanselman 于 2026 年 11 月 3 日开源的 gputaskman —— 一个跨 Windows / Linux / WSL / macOS 的终端式 GPU 任务管理器。它的起点是一个很朴素的问题：任务管理器说「用了 15 GB」，那是被谁用掉的？模型权重？KV cache？浏览器？桌面合成器？以及为什么这么多 GPU 内存跑在系统 RAM 里？但这个工具真正值得写的不是它的功能，而是它对「不确定」的处理方式。它的 README 里反复出现 estimate（估算）这个词——「设备与进程计数器是测量值，而分类与 GGUF 推导出的分解是估算」，并且明确列出它做不到的事：「一个 PyTorch/CUDA 的 DLL 本身无法标识模型，也无法证明在训练；一个被映射的文件不能证明该模型驻留在 GPU 上或正在被使用。」这是工具作者对可信度边界的罕见坦诚。更值得学的还有三处工程细节：其一，容器里的 PID 配对——NVML 报的是宿主机 PID，在容器里毫无意义，而容器也看不到自己进程的宿主机 PID；gputaskman 的办法是把 NVML 未解析的 PID 与「已映射 libcuda.so」的容器进程配对（因为 nvidia-smi 这类纯 NVML 工具会打开同样的设备文件但从不加载 libcuda），两个 PID 命名空间都按创建顺序编号所以按顺序配对，计数吻合时标 *、NVML 列出更多计算进程时标 ?。其二，「未知」用 null 而不是 0——「JSON 用 null 表示不可用的计数器，而不是测得的零」；ROCm/HIP 进程的引擎负载显示 n/a 也不显示 0，作者明说「而不是一个看起来像实测值的 0」，因为用户会以为它没在用 GPU 而它可能正在跑 103 tok/s 的推理。其三，Linux 上 Spill 与 Paged 留空而非显示 0——「Linux 没有 WDDM 共享内存或 commit 计数器的等价物」。本文还记录了作者在 Tom's Hardware 那篇报道里的实测观察：他启动时没有任何任务在用独显，于是跑了个 Unigine Valley 把 RTX 4060 叫醒；而 Hanselman 自己的截图里，RTX 4080S 上最吃显存的应用是桌面窗口管理器，不是 AI 模型——这正好解释了为什么这个工具要把「桌面合成器」和「模型权重」放在同一张表里。"
published: true
