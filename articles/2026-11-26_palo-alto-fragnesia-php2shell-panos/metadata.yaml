title: "Palo Alto 防火墙被 Fragnesia 打穿：web shell 到 root"
date: 2026-11-26
slug: palo-alto-fragnesia-php2shell-panos
category: 技术/解读
author: FreeLAMP.com
original_source: "CSO Online 报道（Gyana Swain，2026-11-26）＋ Palo Alto 官方公告 PAN-SA-2026-0015（2026-11-25）、CVE-2026-109618 PHP2Shell 公告、Zellic 的 Fragnesia 披露与 Dream Security 攻击链报告一手核对。"
description: "解读 Palo Alto 确认的攻击链：PHP2Shell（CVE-2026-109618/109619，CVSS 4.0 9.2）在 PAN-OS 管理界面拿 web shell，再用 Fragnesia（CVE-2026-46300，Linux 内核本地提权）提权 root，隧道进内网窃取凭证、私钥、网络拓扑。内核漏洞 5-13 由 Zellic 的 William Bowling 用 V12 AI 审计 agent 发现并公开 PoC（含 Metasploit 模块），Fedora 次日就修，PAN-OS 拖 195 天才在 11-25 的 PAN-SA-2026-0015 修复（覆盖 10.2–12.2 全分支），但标 Informational、不给 CVSS。讲清为何只打 PHP2Shell 不算根治、Check Point 的类似遭遇、CISO 应把安全设备当面向互联网的特权服务器评估。"
published: true
