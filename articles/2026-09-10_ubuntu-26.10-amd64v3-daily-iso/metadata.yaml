summary: "Ubuntu 26.10 'Stonking Stingray' 的 daily ISO 从 9 月 4 日起正式纳入 amd64v3 镜像，与通用 amd64、arm64、riscv64 并列发布。此前想用 amd64v3 优化包需先装通用镜像再调 APT 换源，现在直接装 ISO 即可。x86_64-v3 默认假设 AVX/AVX2、FMA、BMI2 等特性，大致对应 2013 年 Haswell 以来的 CPU；RHEL 10 已强制该基线，Ubuntu 走独立架构并行路线。本文为 Phoronix 报道译文，附解读：微架构基线抬升的温和派样本、v3 作为独立架构的过渡设计，以及对信创 x86 选型的提醒。"
description: "Phoronix 2026-09-07 报道译文与解读：Ubuntu 26.10 daily ISO 开始发布 amd64v3 镜像，被视为 Canonical 正式提升 amd64v3 地位的信号。覆盖 x86_64-v3 微架构特性级别（AVX/AVX2、FMA、BMI2、MOVBE）、Haswell/Excavator 硬件基线、与 RHEL 10 强制策略的对比、独立架构设计 vs APT 换源的体验差异，以及 x86 信创整机 v3 兼容性选型提醒。Phoronix 将发布 amd64 vs amd64v3 基准测试。"
