title: "一张显卡涨 370%：$9,400 的 RTX 5090，和一份把「谁在说谎」拆开的报道"
date: 2026-11-04
slug: rtx-50-gpu-price-spike-memory-shortage
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：Shattered.io《RTX 5090 Price Increase: 370% Over MSRP Reported》（⭐ 三家报道里唯一逐条标注出处并区分「已证实/未证实」的那一篇）＋ eTeknix 报道 ＋ ZDNET 报道（Taylor Clemons，2026-11-03）＋ aroundprague.cz 的聚合报道（含各家数字的并列表）＋ NVIDIA 官方发布价"
original_date: 2026-11-03
original_url: "https://aroundprague.cz/en/news/us/rtx-5090-street-prices-top-9-000-as-nvidia-gpu-costs-climb"
description: "本文解读 2026 年 11 月 3 日集中出现的一组报道：RTX 5090 在美国的零售价被报到 $9,400，比 $1,999 的官方首发价高 370%；整条 RTX 50 线的涨幅被报到 40%–120%。⭐ 而本文的重点不是复述这个数字，而是拆解这组报道本身的可靠性问题 —— 因为同一件事，四家报道给了四个不同的数（TechSpot：>$9,000；Windows Report：$9,400；ZDNET：Best Buy 约 $6,000；eTeknix：全球平均 +262%），而这些数不是「谁抄错了」，而是「各自在测不同的东西」。⭐ 本文的三条确定事实：官方价没动（NVIDIA 未宣布上调 MSRP，官方价仍是 $1,999）；但 NVIDIA 确实在通知涨价（ZDNET：8 月曾预告全线上调最多 15%，本轮 5090 加约 $500、5050/5060 加 $50–60，归因于 AI 驱动的全球内存短缺）；官方发布价有据可查（5090 $1,999 / 5080 $999 / 5070 Ti $749 / 5070 $549，2025-01-30 上市）。⭐ 而「到底是什么在推高价格」是不确定的 —— Shattered.io 列了五类成因（显存短缺、AI 大宗采购、硅片分配、炒货投机、及其叠加）并明确说「没有硬数据，我们无法排序，任何声称能排序的媒体都已经超出了它的证据」。⭐ 本文还指出「370%」本身是修辞（涨了 3.7 倍意味着变成 4.7 倍），并给出整件事里最反直觉的一点：旗舰涨得最凶（370%）但受影响的人最少，真正影响大多数人的是 5080 的 120%、5070 的 64%、5050 的 68% 那一档。⭐ 而「溢价流向谁」这一层，现有报道完全没有覆盖 —— Shattered.io 只说「多出来的钱流向零售商、炒货商而非 NVIDIA」，⭐ 而「NVIDIA 的拿货价是否也涨了」⭐ 恰恰是决定「内存缓解后价格会不会回落」的关键变量，却无人回答。"
published: true
