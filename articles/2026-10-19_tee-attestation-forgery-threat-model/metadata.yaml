description: "Alin Tomescu 用 763 个词列了一份 TEE 的攻击清单，并给出一句最关键的论证：你的 attestation 验签器接受任何一台合格 Intel CPU 的 quote，所以「物理攻击不在我的威胁模型里」这个说法站不住，因为打断一台等于打断全部。本文核对了他引用的每个攻击（Foreshadow 到 DDRop），补上他没写的三个事实：这类攻击成本低于 1000 美元、Intel 的官方回答是「不在范围内」、以及真正的架构变化是 enclave 转机密虚拟机时移除了完整性和重放保护。"
published: true
