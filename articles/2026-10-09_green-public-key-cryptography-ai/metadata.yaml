description: "约翰霍普金斯密码学教授 Matthew Green 一句「我觉得我们可能会失去公钥密码学」引发恐慌，随后他发了 15 条推文澄清。本文完整转译这条推文串，并补上被忽略的触发背景：OpenAI 发布 722 篇 AI 生成的数学论文（Scott Aaronson 称之为 Mathocalypse），以及 7 月 Anthropic 用 Claude Mythos 攻破 HAWK 并改进降轮 AES 攻击。Green 真正担心的不是公钥密码学在原理上会失效，而是我们已经标准化、广泛部署的方案高度依赖极少数几个困难问题，而人类对这些问题的分析不再是黄金标准。"
