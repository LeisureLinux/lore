description: "加密 DNS 比 VPN 更简单、开销更小，这一点成立。但它的保护范围有明确边界：它加密的是「你向解析器问了哪个域名」这一段，而不是「你最终连了哪个 IP」。本文核实了 AdGuard DNS 与 Control D 两家的具体实现差异，并纠正一个常被简化的说法——Control D 的「不绑定 IP」是有条件的（必须用 Secure DNS 且关闭 Auto Authorize IPs）；同时指出 AdGuard 自己把 DNSCrypt 标记为「过时协议，支持有限」。最后补上 DoH 之上还缺的那一层：ECH。"
