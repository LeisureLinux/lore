summary: "Debian Release Team (Adam D. Barratt) 2026-09-07 预告 Debian 13 \"trixie\" 第 7 个 point release 13.7，将于 2026-09-12（周六）正式上线。13.7 覆盖上百个包，至少 90+ 个 CVE 安全补丁（含 glibc / openssl / qemu / perl / python3.13 / imagemagick / libssh2 / libvirt / mariadb / ansible-core / libsdl2/3 / libhttp-tiny-perl / libmongocrypt / libnfs / mbedtls / libnet-cidr-set-perl / dnsmasq / dhcpcd / alsa-lib / glib2.0 / libraw / libwebsockets / libio-compress-perl / lwip / opencryptoki / mrtg / patool / php-guzzlehttp-psr7 / proftpd-dfsg / pyasn1 / python-ecdsa / socat / sqlite3 / squid / transmission / u-boot / wolfssl 等），含 5 个 \"New upstream stable release\"（openssl / qemu / mariadb / samba / ansible-core）、3 个全新包（llvm-toolchain-22 / rustc-web / rust-cbindgen-web）与 20+ 个 \"Rebuild with updated glibc\" 包。本文按 5 大看点 + CVE 热点 + 重建链 + 新包 + 运维行动清单整理。"
description: "基于 [SUA 286-1] Upcoming Debian 13 Update (13.7) 的逐条解读。覆盖 trixie 13.7 的发布时间窗口、proposed-updates 池的 5 天测试窗口、glibc 跨包重建原因、openssl/qemu 跨大版本升级风险、tzdata 关于 Alberta (CA) 与 Morocco 的永久时区变更、bettercap 行为变更（不再默认装 systemd service）、rustc 32-bit ARM 修复、新包为何与 chromium 浏览器构建相关。本文同时给出 4 步升级前自检清单 + 4 步升级后回退 / 验证方案。"
