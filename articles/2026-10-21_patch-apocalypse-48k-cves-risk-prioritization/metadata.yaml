description: "Computerworld 上一篇由 Ivanti 赞助的署名文章提出「补丁末日」论：2025 年有 48,185 个 CVE 被发布，漏洞利用中位数已压到 5 天以内，所以「全打补丁」不是答案，应该按风险而非按数量排优先级。这个论点方向正确，但数据口径需要校准，而且它漏掉了供应链这一整维。本文用本站刚写的 LiteLLM 供应链事件和 php2shell 这两个具体案例，把「按 CVSS 排优先级」这个方法在什么地方会失灵讲清楚。"
published: true
