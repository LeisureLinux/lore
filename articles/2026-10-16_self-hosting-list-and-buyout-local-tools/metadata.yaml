description: "一位作者列出了他自托管的 28 个服务、一台 180 欧元的 N100 迷你主机、以及四条明确的规则（不暴露公网、优先原生、不再用 Docker、按需升级）。另一端，一个巴黎独立开发者做了一个 €25 买断的文档转换工具，本地处理、自带 OCR 密钥、不要账号。本文把这两份清单放在一起，因为它们做的是同一个选择：把「本地」和「拥有」当成默认值，而不是把「云端」和「订阅」当成默认值。而它们各自付出的代价不同，这一点比「自托管很好」更值得说清。"
