summary: "LWN 在 2026 年 8 月宣布订阅价格 9 月 15 日起上调：Starving hacker 5→6 美元、Professional hacker 9→11 美元、Project leader 16→19 美元、Maniacal supporter 50→55 美元，整体涨幅与 2022 年以来的累计通胀对齐（约 20%）。这是 LWN 2002 年转向订阅制以来第三次涨价。本文整理新价位、宽限期、订阅下滑背景，并讨论订阅制独立媒体在 AI 爬虫、读者疲劳与广告崩塌之下的生存逻辑。"
description: "基于 LWN 官方公告 2026-08 的解读：覆盖四档新价格、6 个月老用户宽限期、订阅增长停滞、AI 爬虫对抗成本上升、LWN 30 年定位、与同类独立媒体的对照，以及读者能做的具体支持动作。"
