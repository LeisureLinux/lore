summary: "基于 Debian 13 trixie 上 coreutils 9.7-3 的 dpkg -L 真实输出，把 105 个 ELF 可执行文件分成 8 大类，逐个依据本机 man 手册讲解用法，并给出全部实机验证过的示例。覆盖你每天都在用但从没读过手册的命令：ls/dir/vdir 三兄弟的差别、install 为什么比 cp 适合部署、ln -sfn 那个 -n 到底在防什么、numfmt 的数字转换魔法、comm/join 要求的排序前提、csplit 按内容而非大小切文件、shred 在 SSD 上为什么没用、stdbuf 失效的真实原因，以及 test 与 [ 其实是同一个二进制。"
description: "一份可以按分类查阅的 GNU coreutils 完整参考。第一部分锁定环境与方法（dpkg -L 输出、命令计数口径、同一二进制多入口现象、shell 内建与 coreutils 版本的差异）；第二部分给出 8 大分类总览（目录浏览与路径解析 10 个 / 文件与目录操作 16 个 / 查看与切分 9 个 / 文本处理与转换 15 个 / 校验与编码 12 个 / Shell 内建替代与流程控制 22 个 / 系统与身份信息 16 个 / 权限与安全上下文 5 个）；第三部分对 105 个命令逐一给出摘要、SYNOPSIS、关键开关与实机示例输出；第四部分是场景速查表与 12 个高频踩坑点。"
