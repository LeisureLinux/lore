description: "Beeper（BEEline's ParsER）把应用层（L7）协议解析直接放进内核里的 eBPF 程序，用一个在用户态构造的 Aho-Corasick 式 DFA 把解析复杂度降到 eBPF 验证器能接受的水平 —— 运行时只剩「读一个字节、查表跳一个状态」，没有变长循环。它支持 HTTP/1.1 与 HTTP/2（最低内核 6.8），可挂在内核 HTTP 缓存后面把静态资源直接从内核返回。这项工作的核心洞察来自论文《Enforcing Application-Layer Policies in eBPF》：很多 L7 协议很复杂，但执行 L7 策略所需要的逻辑往往很简单 —— 作者分析了 2,417 个 GitHub 开源项目的策略后发现 89% 的策略可把服务网格 sidecar 移出关键路径，使中位请求延迟降到 1/6、吞吐提高 3 倍；而配套的 hyper-fast-path（Rust Hyper 的 eBPF 快路径）实测最高 4.5 倍吞吐（静态资源场景）。来自 ETH 苏黎世、NYU 与 NVIDIA，在 Linux Plumbers Conference 2026 上首次面向内核社区公开演示。本文梳理了它的 DFA 思路、三个接入点（freplace / SK_MSG / strparser+kTLS）、以及为什么 socket 层 + kTLS 能让 HTTPS 也可解析，并讨论了一个绕不开的问题：把 L7 可见性推进到内核，同时也给了攻击者同样的原语。"
