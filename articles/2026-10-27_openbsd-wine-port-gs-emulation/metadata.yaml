description: "OpenBSD 的 ports 在 2011 年删掉 Wine 之后，2026 年 10 月 19 日把它重新 import 回来了，10 月 22 日已更新到 Wine 11.20。真正的门槛不是 Wine 本身，而是 OpenBSD 出于 SWAPGS 侧信道防护拒绝在用户态设置 %gs base —— 而 Windows x64 代码大量使用 %gs:0x30 访问 TEB。Andrii Yukhymchak 的解法是一套手写的 x86 指令解码器 + 三级回退策略（原位改写 / rel32 跳转 stub / SIGSEGV 陷阱），配 44 个 patch。本文逐行解读这套实现，并顺带讲清 %gs、TEB、TLS slot、stub 生成、跨进程线程信号等每个环节，以及 2010 年那次失败尝试与 2026 年这次成功的差别。"
published: true
