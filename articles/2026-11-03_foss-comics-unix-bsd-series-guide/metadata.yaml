title: "一条磁带如何长成一个操作系统：F/OSS Comics 的 Unix 与 BSD 五部曲（系列导读）"
date: 2026-11-03
slug: foss-comics-unix-bsd-series-guide
category: 技术/历史
author: FreeLAMP.com
original_source: "⭐ 一手核对：F/OSS Comics 系列全部五篇（Joone Hur 绘，2026-08-22 ~ 2026-10-30）原文与 69 张漫画配图"
original_date: 2026-11-03
original_url: "https://fosscomics.com/"
description: "F/OSS Comics 是一个用漫画讲自由开源软件史的系列，2026 年 8 月到 10 月连更五篇，从 Unix 哲学讲到 BSD 的诞生。本文是整个系列的导读：先给出五篇的时间线与阅读顺序，再逐篇提炼内容要点（第 9 篇 Unix 哲学与 MINIX→Linux 的血缘、第 10 篇 Dennis Ritchie 生平与 C 语言、第 11 篇 Unix 源码 tapes 到伯克利、第 12 篇 ed→em→ex→vi 的编辑器家谱、第 13 篇 BSD 诞生、VAX 虚存与 2BSD→3BSD），最后给出笔者的整体观察：这个系列最值得学的不是某个史实，而是它把「代码怎么流动」这条主线讲清楚了 —— 而自由软件运动在技术上真正继承的东西，不是许可证文本，而是「一群人聚在一起读代码、然后把改好的版本传出去」这个具体做法（可追溯到 1975-76 年西海岸 Unix 用户组逐行讲内核源码的场景）。"
published: true
