title: "Dux Shell 与 Niri：所谓「不是桌面环境的桌面环境」到底替代了什么"
date: 2026-11-11
slug: dux-niri-not-a-desktop-environment
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：MakeUseOf《The best Linux desktop environment isn't a desktop environment at all》（Dipan Saha，2026-11-07，经 Tux Machines 全文归档与搜索摘要重建）＋ Dux Labs 官方站 duxlabs.dev（DMS 2.1 Stormborn 与组件清单）＋ duxlabs-dev/dux-shell 官方 README（Quickshell + Go、替代 waybar/swaylock/mako 等）＋ Dux 官方文档 Overview & Architecture（2.0）＋ heise / It's FOSS / Linuxiac 关于 DMS 2.0 改名与 2.1 的报道 ＋ 本号 2026-09-09 / 09-22 / 09-28 三篇 Niri+DMS→Noctalia 实测记录 ＋ 本机只读状态核对（不安装、不测试）"
original_date: 2026-11-07
original_url: "https://www.makeuseof.com/the-best-linux-desktop-environment-isnt-a-desktop-environment-at-all/"
description: "解读 MakeUseOf 2026-11-07《最好的 Linux 桌面环境根本不是桌面环境》，纠正分类错误：指的是 Niri（滚动式平铺合成器）+ Dux Shell（原 DankMaterialShell / DMS）组合，不是新 DE。三层核对：①外媒观点层（平铺 WM 极度裸机要自己拼、2026 年 compositor shell 补齐、作者从 KDE Plasma 迁走但留在 DMS 1.6 且嫌 2.0 M3 Expressive 是灾难、「Dux 客观优于 KDE」属个人措辞）；②官方事实层（DMS 2.0 Heisenberg 改名 Dux Shell / Dux Labs 并新增 Dux Files，当前 2.1 Stormborn 有新系统监控/视频壁纸/重做媒体播放器/界面密度/dux files 增强；官方 README 明说用 Quickshell + Go，替代 waybar/swaylock/swayidle/mako/fuzzel/polkit，支持 niri/Hyprland/Sway/labwc/Miracle；官方文档类比 GNOME Shell/KDE Plasma 的统一界面但强调是壳不是合成器；dank16 生成 16 色调色板）；③本机证据层（2026-09 已从 DMS 1.6 迁 Noctalia 5.4.1：旧包仍在但 dms.service masked，niri config 用 spawn-at-startup noctalia --daemon 并 include noctalia.kdl，kitty.conf include themes/noctalia.conf，cycle-palette 依赖 noctalia msg color-scheme-set；迁移实测记录 Quickshell v4→v5 彻底重写、D-Bus 激活绕过 systemd 致 mako 复活须 GetNameOwner 查通知名真正持有者、niri 模板 mustache 占位符须运行后渲染）。明确遵守用户要求：宿主机不安装不测试 duxlabs.dev / DMS 2.1，想试要进干净 Debian 13 VM。结论：壳吃掉的是「拼桌面」的劳动，不是合成器；把 Niri 换成壳或把壳当 DE 都是两层混一层。"
published: true
