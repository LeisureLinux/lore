title: "GNU Automake 1.19 发布：攒了一年多的修复，终于还上一个 14 年的老 bug"
date: "2026-09-11"
category: "开源工具"
tags: ["GNU", "Automake", "构建系统", "翻译"]
source: "https://www.phoronix.com/news/GNU-Automake-1.19"
author: "LeisureLinux"
summary: "Automake 15 个月来首个新版：唯一新功能是 AM_OPTIONAL_AUTOMAKE 宏，修复里包括一个 2012 年的 bug——make dist-bzip2 dist-xz 终于能正常工作。老树年轮里也有信息。"
