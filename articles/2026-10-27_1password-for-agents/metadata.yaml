description: "1Password 发布了「1Password for Agents」平台，核心思路不是让 agent 拿到密码，而是让 agent 请求凭证、人批准、1Password 直接在目标站点自动填充 —— agent 全程看不到密码。已推的集成包括 Meta 的 Muse 与 SpaceXSI 的 Grok Bot；即将支持的包括 Anthropic 的 Claude Duet、OpenAI 的 ChatGPT Work and dots、Town 的 Townie；另有 Instinct、Browserbase、Browser Use、Dana、KERNEL、Perplexity、Ramp、Tomo、Wajo 排队中。对 Individual 与 Family 账户不额外收费，.eu 与 .ca 后缀暂不支持。本文拆解它的具体机制、它与浏览器密码管理器在授权模型上的本质差别，以及三个仍未解决的问题 —— 官方那句「各集成的防护措施与控制不同」意味着 13 家可能有 13 种不同强度；自动填充的技术前提（浏览器可被驱动）决定了它的实际覆盖面；以及最根本的一点：它解决的是「凭证从哪来」，而没有解决「拿到凭证之后能干什么」的操作级授权。"
published: true
