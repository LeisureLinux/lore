summary: "Asahi Linux 在 7.2 进展报告里确认 M3 / M3 Pro / M3 Max 支持即将正式发布（目标几周内）。覆盖 CPU / PCIe / NVMe / 键盘触控板 / SMC RTC / 麦克风 / 完整 webcam；M4 上的早期内核初始化崩溃已通过内核命令行参数 workaround 修复；M5 在路上。本文详解硬件覆盖矩阵、M4 / M5 bring-up 进展（idle 循环 / cpuidle 配置 / 共享 display buffer / 硬件视频解码）、Asahi 团队组织、用户升级路径与开源生态意义。"
description: "Asahi Linux 在 2026 年 8 月 29 日的 7.2 进展报告里公布了三件大事：(1) M3 / M3 Pro / M3 Max 支持即将正式发布，目标几周内，覆盖 PCIe、NVMe 存储、MacBook 键盘 / 触控板、SMC RTC、reboot 控制器、内置麦克风、完整 webcam 支持（含 M3 Max 的初始化修复）；(2) M4 bring-up 持续推进——早期内核初始化崩溃通过引入内核命令行参数配置 idle 循环和 core parking 修复，避免在 cpuidle 驱动接管前崩溃；(3) M4 / M5 上取得存储 / CPU sleep 状态 / 硬件视频解码 / 共享 display buffer 等进展，m1n1 bootloader 与 Apple 更新安全架构保持兼容。本文详解：(a) Asahi Linux 当前双轨节奏（linux-asahi 分支稳定 / 上游回推）；(b) M3 系列硬件覆盖矩阵（CPU 核心 / PCIe / NVMe / 输入 / 音频 / 摄像头已覆盖，GPU 部分可用）；(c) M3 / M4 / M5 bring-up 的关键技术挑战（SMC 依赖、DCP / ASC、安全架构链、GPIO / PIN 复用、cpuidle 调优）；(d) M4 / M5 进展（共享 display buffer、AME 硬件视频解码、CPU sleep 状态）；(e) Asahi 团队组织（Alyssa Rosenzweig / Hector Martin / Dougall Johnson 等核心贡献者）；(f) 用户升级路径——M1 / M2 持续稳定、M3 几周内可用、M4 / M5 观望；(g) 上游回推对其他 ARM 平台的收益；(h) 开源 GPU 范式意义（AGX Gallium 是首个 Apple Silicon 开源 Mesa 驱动）。本文同时分析 Asahi Linux 的开源意义（平台独立性、上游 Linux 贡献、开源 GPU 范式）与未来关注点（M3 GPU 用户态打磨、M4 / M5 时间表、Fedora Asahi Remix 推荐）。"
