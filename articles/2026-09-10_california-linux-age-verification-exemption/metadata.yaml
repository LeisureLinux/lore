title: "加州 39 比 0 通过：Linux 获年龄验证法豁免，GPL/MIT/BSD/Apache 全在列"
date: 2026-09-10
author: LeisureLinux
tags:
  - 译文
  - 开源
  - 合规
  - Linux
  - 政策法规
summary: "Tom's Hardware 报道：加州参议院 39 比 0 通过 AB 1856，将开源操作系统豁免于《数字年龄保证法》。豁免判据是许可证属性（允许复制、再分发、修改）而非点名发行版，Debian/Fedora/Ubuntu/Arch/BSD 全部脱钩；另含依赖库、浏览器扩展商店两类排除，并修掉了「把每个设备拥有者定义为儿童」的原文漏洞。Windows/macOS/iOS/Android 仍需在 2027 年初收集年龄。"
description: "加州 AB 1856 开源豁免译文与解读：用许可证特性做立法判据的技术价值、依赖库与包管理器为何必须一并豁免、年龄 API 被禁非法定义务外调用的意义、SteamOS 混合分发的合规模糊地带，以及开源项目按司法辖区维护合规清单的现实。"
published: true
original_source: "https://www.tomshardware.com/software/linux/california-lawmakers-unanimously-pass-linux-exemption-from-age-verification-law-software-distributed-under-the-gpl-mit-bsd-and-apache-licenses-are-exempt"
