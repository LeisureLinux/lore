summary: "Wine 11.18（2026-09-18 双周开发版）继续推进 NTOSKRNL 实现：PnP 设备启用、容器 ID、必需函数补齐，测试覆盖率同步跟上；另含代码正确性修复、标准 C 头兼容性修复，以及 21 个已知 bug 修复（覆盖 Adobe Creative Cloud 与《刺客信条：叛变》等）。"
description: "译介 Phoronix 对 Wine 11.18 发布的报道（Michael Larabel，2026-09-18）并附工程视角解读：NTOSKRNL 是 Windows 主内核可执行文件、负责硬件抽象/进程/内存等，Wine 在用户态兼容 Win32 之余持续实出内核态接口，使依赖内核驱动的老软件与专业工具可用度提升；测试覆盖率与实现同步推进，说明是按可持续维护方式搭地基而非临时补丁；21 个 bug 修复里 Adobe 与游戏修复最影响日常体验，延续 Wine「让某个离不开的 Windows 程序在 Linux 上活下来」的务实路线。"
