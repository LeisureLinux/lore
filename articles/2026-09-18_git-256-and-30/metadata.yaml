summary: "译介 LWN 报道（Jonathan Corbet，2026-09-18）：Git 2.56 RC 已就绪（约 700 非合并 commit，主要是易用性微调与常规修复，9 月底发布）。新增 git history drop（删指定 commit 并重放后续，仍不支 merge）、git status 建议 pull、git refs create/delete/update/rename、git branch --delete-merged、git add --resolved（只加已解决冲突且扫描残留冲突标记）、配置锁失败重试等。真正重点是身后可能的 Git 3.0：一组兼容性破坏——默认 SHA-256（取代 SHA-1）、默认 reftable（替代 .git/refs 文件，解决 Android 80 万 ref 的低效）、只接受小写对象 ID（消歧义 bug/漏洞）、3.0 起把 Rust 变为构建硬要求（无 Rust 工具链平台无法升级，2.99.x 长期维护线不含 Rust）。卡点：GitHub 是最后一个缺 SHA-256 支持的 forge，但 git-merge 已演示 SHA-256 仓库。Hamano 称「既不是人气竞赛，也不是民主」。"
description: "译介 LWN《Looking forward to Git 2.56 — and 3.0》(Jonathan Corbet, 2026-09-18, 订阅内容) 并加工程解读。事实：Git 2.56 RC 就绪，~700 非合并 commit，9 月底发布；新增 git history drop <commit>（移除指定 commit 并重放其后所有 commit，仍拒绝含 merge commit 的历史）、git status 建议 git pull（但落后于未 fetch 的远程跟踪分支仍报 up to date）、git refs create/delete/update/rename、git branch --delete-merged、bisect 中删除分支带提示失败、配置锁失败重试、git add --resolved（仅加已解决冲突路径并扫描未合并路径残留冲突标记，发现则中止）；常规修复/重构/性能改进。3.0 兼容性破坏候选：默认 SHA-256（取代 SHA-1，非实验支持自 2.42/2023，GitLab 2024 支持、Forgejo 支持，GitHub 为最后一个缺口但 git-merge 已演示 SHA-256 仓库）、默认 reftable（替代 .git/refs 文件存储，解决 Android 80 万 ref 低效，2.45 引入，libgit2 已加 reftable 且 8 月默认开 SHA-256）、只接受小写对象 ID（消除 f00f00 vs F00F00 歧义 bug/漏洞）、3.0 起 Rust 成为构建硬要求（无 Rust 工具链平台无法升级，2.99.x 不含 Rust 长期维护）。Hamano 拍板「既非人气竞赛也非民主」，2 周内无强烈反对。解读：①这批破坏性改动主题是成熟/还向后兼容债（安全、规模、可维护性、消歧义）；②SHA-256 默认卡点在 forge 而非 Git，靠向前 opt-in+老仓库完全支持共存过渡；③强制 Rust 杀伤面被高估，2.99.x 买时间，从源码编 Git 的冷门平台应提前备 Rust 工具链；④2.56 用户可见爽点是 git history drop/git add --resolved/git branch --delete-merged 等小命令，其中 history drop 仍被 merge 卡住说明真实历史多带 merge。"
