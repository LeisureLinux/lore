summary: '本文详细介绍如何在本机部署 DeepSeek Harness 0.2.0，并将其配置到 Codex 中使用。内容包括：环境准备、安装步骤、模型目录配置、Codex 配置整合、API 密钥管理、混合推理模式（本地优先 + 云端回退）、测试验证、故障排除、性能优化与安全最佳实践。通过本文，开发者可以轻松建立灵活、可控的本地 AI 工具链，实现 DeepSeek 模型的无缝集成。'
description: 'DeepSeek Harness 0.2.0 是一个轻量级的 DeepSeek 模型集成框架，为 Codex 等开发工具提供了与 DeepSeek 模型无缝集成的能力。本文基于实际部署经验，详细介绍从安装到测试的完整流程。首先，使用 pip install deepseek-harness 安装框架及其依赖（openai、httpx、tiktoken）。然后，配置 Codex 的 model-catalog.local.json 和 config.toml，添加 deepseek-v4-flash 模型信息。配置环境变量 DEEPSEEK_API_KEY 后，通过 Python 脚本验证安装和配置状态。Codex 配置了本地优先 + 云端回退模式：优先使用本地 Ollama 模型（如 Qwen3.8、GLM-5.2），本地不可用时自动回退到 DeepSeek 云端（8789 端口），最终使用 DeepSeek V4 Flash（8787 端口）。本文还提供故障排除指南、性能优化建议和安全最佳实践，帮助开发者建立稳定、安全、高效的本地 AI 工具链。'
