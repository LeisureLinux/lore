description: "本文解读 Martin Alderson 于 2026-11-08 发布的《The great software IP writedown》。它是一篇软件资产估值论证，不是技术文：作者一年前问「造软件的成本是不是跌了 90%」，现在问更难回答的那个 —— 「已经造好的软件，价值是不是也跌了差不多的幅度」。全文推导链：中小 SaaS 的高毛利在历史上是异常（不靠垄断 Standard Oil、不靠网络效应、不靠监管俘获/暴力），真正稀缺的是「能写软件的人不够多」；AI agent 让稀缺蒸发，市场就会把边际打掉。作者逐一处理了两个反驳：Jevons 悖论确实让软件总量爆炸，但新增的是高度 bespoke 的定制软件，把 SaaS「开发一次卖给百万客户、边际成本近零」的模型切成大量可寻址市场小得多的产品；鲍莫尔成本病封死了「软件工厂」——构建快了 10 倍，卖给真人还是一样慢，瓶颈从做产品移到卖产品，而每个买家收到的营销还更多了。复刻侧：给 agent 截图或让它控制浏览器标签就能克隆软件（ArtCraft 的 Excel/Photoshop 克隆，作者说那个 Photoshop 克隆功能可能已超过投入 30 年人力的 GIMP），数据可由 agent 导出转换，切换成本这道护城河也在漏。落到财务：过去为亏损软件公司辩护的「R&D 不是费用是投资、会长年产生回报」，前提是 R&D 造出了耐久资产；若对手或你自己的客户几周就能用 agent 重建你五年的工作，那笔支出更接近「为了原地不动而必须持续付的运行成本」。M&A 侧同理：10 倍营收买 startup 本质是 build-vs-buy（自建要两年 + 30 工程师）；现在自家团队几周能造出来，技术溢价趋近于零，只剩客户与渠道值钱。本文也把它与本号近期三篇（Asahi 转 GPL / Darling 用 AI 补人力产能 / TIOBE 生态决定位置）串联，并如实标注这是一篇个人论证、没有财报数据或对照实验。"
