description: "IPinfo 的测量显示，RPKI 有效的路由前缀占比在一年内从 54.0% 涨到 70.3%，其中大部分增量来自中国（从 3.7% 到 83.0%）。无效路由几乎传不远——典型有效前缀被 596 个观测点看到，无效的只有 2 个。但同一份材料里藏着一个更值得琢磨的事实：2026 年 8 月那次把 Hetzner 地址空间劫持去投递恶意更新的事件，伪造的路由本身就是 RPKI 有效的，因为 Hetzner 的 ROA 用了 maxLength 24，而攻击者恰好以 /24 的长度伪造了正确的源。本文解释 RPKI 到底保证什么、不保证什么，以及为什么 RFC 9319 早就建议不要设 maxLength。"
