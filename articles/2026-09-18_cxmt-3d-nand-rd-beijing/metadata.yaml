summary: "据 Tom's Hardware / Reuters 2026-09-18 报道，长鑫存储（CXMT）拟在北京第二座制造厂建 3D NAND 研发（R&D + 中试）产线，借力本地 NAND 研究院，从核心 DRAM 扩张进闪存；启动时间与是否量产均未定。与今年 8 月披露的北京亦庄第二座 DRAM 厂是两回事。背景是全球 AI 内存短缺撑到至少 2027 年。"
description: "综合 Tom's Hardware、Reuters、Pandaily 2026-09-18 报道翻译+解读：CXMT 准备在北京新厂区上 NAND 闪存研发/中试线（非官宣量产厂），借力含 NAND 开发职责的本地研究院，在全球存储短缺、AI 服务器抽紧内存/闪存的窗口做品类卡位；强调该 NAND R&D 线与今夏披露的北京亦庄第二座 12 英寸 DRAM 厂扩产是两笔独立账。国内 CXMT（DRAM）与 YMTC（NAND）由互补变重叠，长期看国产 SSD 供给从单点变双供给，但短期无采购影响。解读聚焦研发/中试性质、借研究院捷径、与 DRAM 扩产区分、对信创供应链冗余的意义。"
