description: "同一批内核与桌面提交里，有两个改动都在修正同一个东西：一个被默认接受的隐含假设。Huawei 的补丁要把 ACPI CPPC 的 CPU boost 从默认关闭改为默认开启，理由是服务器场景下通常想要峰值性能；而 Arm 的 Christian Loehle 反问的是更根本的问题，即现代硅片的功耗与散热包络已经足够复杂，boost 这个概念本身还剩下多少意义。另一侧，Red Hat 的 Ray Strode 给 Mutter 加上了双 GPU 复制缓冲区的 damage 跟踪，修的是「复用缓冲区只拷最新那一帧的变化」这个假设在多帧复用与复制失败时会失效。本文把两者放在一起，说明为什么「假设」需要有明确的失效边界。"
