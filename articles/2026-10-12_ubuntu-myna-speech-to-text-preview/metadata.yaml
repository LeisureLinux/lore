description: "Canonical 把 Myna 推向技术预览：本地语音转文字，支持 Ubuntu 24.04 LTS、26.04 LTS 和 26.10。它跑在你自己的机器上，模型下载之后转录无需联网，音频不上传也不存储；支持 Parakeet、Whisper、FunASR 三种引擎，有 NVIDIA GPU 时可启用 GPU 加速。但最值得注意的不是功能，而是那句边界声明：Myna 目前刻意只做「听写」，它不是语音助手，也不通过语音命令控制桌面。本文梳理安装方式、三种模型的取舍、以及「本地」在架构上如何被保证（客户端持有麦克风、推理 snap 拿不到音频硬件）。"
