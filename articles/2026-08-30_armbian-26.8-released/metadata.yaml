summary: "Armbian 26.8 是 2026 年第二个大版本。内核基线全面升到 Linux 7.1 stable，5 平台 edge 分支追到 7.2-rc；armbian-install 完全重写为单元测试覆盖的 armbian-config 模块；Armbian Imager 2.0 新增 QDL 和 UFS 烧录工具；标准化 UEFI ISO 覆盖桌面与 minimal 版；新增 6+ 款 SBC（Anbernic RG DS / RG Vita Pro、Luckfox Nova、LubanCat 5IO、KICKPI K3B、Seeed reComputer RK3576/RK3588）；CI 流水线迁到独立基础设施（Debian Trixie）。"
description: "Armbian 26.8 是 2026 年 8 月 30 日发布的 SBC 操作系统大版本，本文详解四个维度的核心改动：(1) 内核与固件——mainline baseline 全面升级到 Linux 7.1 stable，edge 分支在 rockchip64 / meson64 / mvebu64 / sunxi / bcm2711 五个平台追到 7.2-rc，U-Boot 升级到 v2026.04 / v2026.07；(2) 安装器重写——armbian-install 完全重写为 armbian-config 模块，单元测试覆盖，统一参数接口（旧 flag 兼容但提示迁移），支持独立 bootloader 烧录、SPI/MTD 启动、eMMC/NVMe 拆分安装流、UEFI/dual-boot 改进诊断；(3) Armbian Imager 2.0——新增 QDL（Qualcomm SoC 烧录协议）与 UFS 烧录工具，配合板卡识别改进，解决 SBC 烧录最后一公里问题；(4) 标准化 UEFI ISO——桌面版与 minimal 版都能直接用 ISO 镜像部署，让 PVE/VMware/VirtualBox 跑 Armbian VM 或 U 盘直接启动 Armbian 桌面成为可能；(5) 新板支持——Anbernic RG DS / RG Vita Pro（游戏掌机）、Luckfox Nova（IoT）、LubanCat 5IO（工业）、KICKPI K3B（多媒体）、Seeed reComputer RK3576/RK3588（工业 AI）；(6) CI 基础设施——从主仓库迁出，迁到 Debian Trixie 基础的独立 CI，加快构建速度、便于多平台扩展。本文按普通玩家、工业/IoT 部署、开发者三类用户给出升级路径与影响清单。"
