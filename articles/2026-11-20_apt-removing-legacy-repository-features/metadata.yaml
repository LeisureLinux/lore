title: "APT 要删掉老仓库支持：AI 把兼容性的账算到了 Debian 头上"
date: 2026-11-20
slug: apt-removing-legacy-repository-features
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix《Debian's APT Removing Some Features Due To Advancements In AI Security Discoveries》＋ Debian-devel-announce 一手公告《EOL notice for various APT repository configurations》（Julian Andres Klode，2026-11-19）＋ DSA-6607-1 / CVE-2026-109518（Max Justicz，apt 3.0.4 修复）＋ 本号此前 APT CVE 与 Ubuntu SHA3 两篇文章交叉核对。"
description: "解读 Debian APT 维护者 Julian Andres Klode 宣布在 unstable 移除遗留仓库特性：detached Release.gpg、弱哈希 MD5/SHA1 仓库、无哈希/无 Release 仓库，并评估移除 allow-insecure 与各类 fallback。动机是 CVE-2026-109518 暴露的下载代码复杂度与 AI 辅助安全研究的放大效应。给出迁移清单、时间表（unstable 11-24、stable 支持减弱、2027 起可能无预警），辨析'AI 逼着删功能'说法。"
published: true
