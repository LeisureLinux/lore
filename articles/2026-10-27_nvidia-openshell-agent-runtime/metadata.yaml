description: "NVIDIA 开源了 OpenShell —— 一个「面向自主 AI agent 的安全、私密运行时」。它的核心不是又一个容器沙箱，而是两件事的组合：内核级强制（Landlock + seccomp user notification + 网络围栏 + 凭证不出沙箱），以及在策略变更生效之前用 SMT 求解器做形式化验证，把「新可达的主机 / 新的 HTTP 方法 / 云元数据地址」变成必须人工审批的发现。本文拆解它的架构（gateway / supervisor / sandbox 三段式）、Sandbox Protocol、fail-closed 设计、以及 prover 的四种结论（within_boundary / exceeds_boundary / unsupported / inconclusive）—— 并指出它最大的未解问题：形式化验证覆盖的是模型里的东西，模型之外的一切都是 unsupported。"
published: true
