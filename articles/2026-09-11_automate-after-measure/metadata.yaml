title: "自动化之前，先学会测量：拿不出基线，ROI 就只是故事"
date: "2026-09-11"
category: "AI与自动化"
tags: ["自动化", "ROI", "基线测量", "AI Agent", "翻译"]
source: "https://www.cio.com/article/4213758/before-you-automate-anything-learn-to-measure-it.html"
author: "LeisureLinux"
summary: "作者 Krishna Mukherjee（曾参与 Office 智能辅助、BVAL 估值自动化）：测量先于工程。基线是唯一无法事后补测的测量；智能体记分卡三指标（自主完成率/升级率/回退率）；收益会衰减，标准化+季度重测守住它。"
