description: "Gentoo 在 2026 年 9 月 24 日为 Chromium 包宣布「临终祷告」，也就是放弃维护。表面原因是稳定版落后 602 个 CVE，而 LWN 还原的完整对话显示，真正的触发点是报障者第 N 次说「这太荒唐了」，而维护者回了两个字「那就这样吧」。本文梳理这场对话里双方的立场，以及维护者给出的那组数字：每周六小时、需要至少三个人、还要学一堆只在 Google 内部有用的工具。"
