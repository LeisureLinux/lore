description: "PingCAP 在 10 月 19 日发布官方安全事件报告，确认 9 月 9 日到 10 月 7 日期间有人用窃取的服务账号凭证访问内部系统、拷贝数据并获取源代码。而攻击方 FulcrumSec 公布了另一套数字：10.6 TB、490 万文件、11.5 万组明文 API Key（4.2 万仍有效）、2064 万条客户 SQL 语句、18 万租户组织。本文把官方声明与攻击方说法并排放，指出双方唯一不冲突的地方，以及泄露根因里最刺眼的一条：攻击者说他们是用「提交在 PingCAP 自己仓库里的 GCP 服务账号密钥和 Azure service principal」搭起了控制面数据库的复制流的。"
published: true
