description: "Deno 团队全体加入 Cloudflare，合并 celld 与 workerd。具体后果写得很明确：Deno runtime 再支持一年（月度 bug 与安全修复），之后停止开发；Deno Deploy 六个月后关停；JSR 继续运营并迁到 Cloudflare 基础设施；rusty_v8 继续维护并努力合入 workerd。本文梳理这次合并的技术动机（Durable Objects 作为分布式原语）、Kenton Varda 对「锁定论」的正面回应，以及社区最愤怒的那一点：这条停更消息写在 Deno 博客里，Cloudflare 那篇却完全没提。"
