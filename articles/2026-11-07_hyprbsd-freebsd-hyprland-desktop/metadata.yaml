title: "HyprBSD：给 FreeBSD 装上 Hyprland 桌面，Steam 也跑起来了"
date: 2026-11-07
slug: hyprbsd-freebsd-hyprland-desktop
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：HyprBSD 官方站点（hyprbsd.org，含 rc1/rc2 发布说明、当前限制、硬件说明与 SHA256）＋ Phoronix 报道（Michael Larabel，2026-11-07）＋ 作者 Sam Sheridan 的公开发布说明"
original_date: 2026-11-07
original_url: "https://www.phoronix.com/news/HyprBSD"
description: "本文解读 HyprBSD —— 一个 2026 年 10 月底开始出现的 FreeBSD 桌面发行版，用 Hyprland 合成器做 Wayland 桌面，并通过 FreeBSD 的 Linux 兼容层让 Steam 直接可玩。作者是 IT 顾问、25 年以上 FreeBSD 管理员 Sam Sheridan，他做这件事的直接起因是「受够了 FreeBSD 开箱即用的桌面体验，尤其是 NVIDIA 显卡驱动那一块」。本文的重点不是「又一个 BSD 桌面发行版」，而是三件更值得说的事。第一，它和 FreeBSD 官方桌面计划是什么关系：官方一直在改善桌面与笔记本体验，但那部分工作「尚未以已发布的形式进入安装器」；历史上也有 PC-BSD / TrueOS、helloSystem 和仍在进行中的 GhostBSD 等尝试 —— HyprBSD 是这条路上的又一个节点，而不是官方的替代品，官方站点明确写着「HyprBSD 与 FreeBSD 项目、FreeBSD 基金会、Hyprland 开发方均无隶属或背书关系」。第二，它揭示了 FreeBSD 桌面体验真正的痛点不是「没有桌面环境」，而是「显卡驱动」：受挫点尤其在 NVIDIA 显卡驱动周围；而 HyprBSD 的做法是「预配置好一切」，包含驱动与桌面包因而可离线安装，并同时对 FreeBSD 本身做了若干修复。第三，一个必须说清的边界：官方发布说明写着「源代码尚未发布，将托管在项目的 Forgejo 实例上，公开链接稍后提供」—— 也就是说，这个发行版目前只有 ISO，没有源码可审。这对一个以「更顺滑的开箱体验」为卖点的项目来说是个值得记的点。当前版本是 HyprBSD 15.1-rc2（2026-11-05 发布，基于 FreeBSD 15.1，amd64，UEFI 引导，ISO 3.7GB，SHA256 d1a7e29e2b49...），RC1 是 2026-10-27。官方列出的当前限制有五条，其中两条最关键：只支持 UEFI 安装（即使 ISO 是用 BIOS 引导的，装出来的系统也走 UEFI），以及没有任何 ISO 签名（只提供 SHA256 校验和文件）。"
published: true
