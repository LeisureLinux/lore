title: "GCC 13.5 发布：265+ 个修复，也为三年前的 GCC 13 系列画上句号"
date: "2026-09-12"
category: "编译器"
tags: ["GCC", "编译器", "开源", "译文"]
source: "https://www.phoronix.com/news/GCC-13.5-Released"
author: "LeisureLinux"
summary: "GCC 13.5 发布，带来 265+ 个 bug 修复，也是 GCC 13 系列最后一个计划点发布——gcc-13 分支正式关闭。仍在使用 GCC 13 的生产环境用户迎来最后一次官方集中修复，后续需迁移到今年发布的 GCC 16，或等待明年的 GCC 17。"
