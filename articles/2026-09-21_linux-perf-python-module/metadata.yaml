summary: "译介 Phoronix 报道（Michael Larabel，2026-09-21）：Linux perf 子系统一组大 patch 移除内嵌 Python/Perl 脚本支持，改用独立 Python 脚本 + 新 C 写 Python perf 模块。Google 工程师 Ian Rogers 主导对 perf script 的 overhaul，解决高开销/构建依赖复杂；新模块下原 3.7s 脚本降至 0.1s（37×）。49 个 patch、约 2.1 万行，丢弃旧 libpython 代码与 legacy 脚本，尚在 lore.kernel.org 审查未合主线；Rogers 此次有 Gemini 3.1 Pro 协助。解读聚焦：内嵌解释器设计被证伪（启动/嵌入税）、2.1 万行未合入勿上生产、AI 辅助工程既用于攻（Hacktron/DeepSeek）也用于维护基础设施。"
description: "译介 Phoronix《Linux's Perf Script Command Much Faster With Overhaul As Python Module》(Michael Larabel, 2026-09-21) 并加工程解读。事实：周末发出 Linux perf 子系统大 patch 系列，移除内嵌 Python/Perl 脚本支持，改独立 Python 脚本 + 新 Python perf 模块(用 C 写的 C 扩展)；Google 工程师 Ian Rogers 主导 perf script overhaul，解决高开销与构建依赖复杂；新 C 扩展模块下原 3.7s 的 Python 脚本降至 0.1s(约 37×)；49 个 patch、~21k 行、丢弃旧 libpython 代码与 legacy 脚本；Rogers 有 Gemini 3.1 Pro 协助；patch 在 lore.kernel.org 审查中未合主线。解读：①性能提升主因是去掉每趟都付的解释器启动/嵌入税(perf 内嵌 libpython 拖重二进制与初始化)，而非算法优化，通则——脚本慢先查宿主进程初始化成本；②2.1 万行属内核 perf 改动、尚 review 未合入，一线当前 perf script 仍是老样，需等合主线+发行版工具链跟上；③与 gzip 祖传修复/coreutils -R 竞态同属老基础工具被认真维护的潮流；Rogers 用 Gemini 3.1 Pro 协助，与 Hacktron 用 AI 写利用、DeepSeek AI 黑客模型形成攻/维护对照。"
