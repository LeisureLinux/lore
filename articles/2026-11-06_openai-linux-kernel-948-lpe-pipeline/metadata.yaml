original_source: "一手核对：OpenAI《A thousand fewer paths to root》（2026-11-04，Security/Publication）全文五阶段流程与逐项成本表、OpenAI《GPT-6 Cyber: Advancing the frontier of aligned cybersecurity agents》（2026-11-05）发布公告、Hacker News 讨论区 OpenAI 研究员对「补丁数 vs 利用数」的公开澄清、以及本文自行复核的成本算术"
original_date: 2026-11-04
original_url: "https://openai.com/index/a-thousand-fewer-paths-to-root/"
description: "本文解读 OpenAI 于 2026 年 11 月 4 日发布的《A thousand fewer paths to root》：一次用「即将发布的 cyber 模型」的运行，从 Linux 内核里产出 948 个本地提权（LPE）利用与对应补丁，API 成本 121.3 万美元。这篇文章真正的看点不是「AI 找到了 948 个漏洞」这句结论，而是它把漏洞研究彻底拆成了一条可计量、可复现的五阶段流水线，并且把每一阶段的 API 账单都公布了出来。我逐项复核了这些数字：Scout 阶段 3426 美元定位到 5034 个审计目标（约 280 万行代码，占内核 7%）、Analyst 阶段 316549 美元在 12 小时内产出 2308 个候选、验证阶段 73330 美元复现 1724 个（74.7%）、利用阶段 775929 美元产出 1169 个可用利用并收敛到 948 个独立补丁，单个 LPE 利用均摊 359 美元、整轮每个 LPE 1279 美元。我还核对了公告里那句最容易被读反的话——利用阶段的 1169 个利用与 948 个补丁不是同一个数，OpenAI 研究员在 Hacker News 上明确解释过：补丁数是按变体分析后去重的独立漏洞数，原始利用数更高，公告为了避免「补丁数≠利用数」的困惑才取了较小的那个。另外三件事值得单独说：其一，那个「即将发布的 cyber 模型」在次日（11-05）就被揭晓为 GPT-6 Cyber，OpenAI 在同一天的第二篇公告里直接写明「用 GPT-6 Cyber 开发了 948 条 Linux 提权利用」；其二，公告里最诚实的一段是「用了错误的 0-day」——早期一轮 200 个成功提权里，人工复核发现 20 个其实是通过另一个 0-day 拿到的 root，所以他们的教训是「不仅要验证结果，还要验证路径」；其三，模型在 Linux 内核之外顺手发现了 QEMU TCG 的漏洞，而那个漏洞在上游已修、只是实验用的 release build 没带上。"
