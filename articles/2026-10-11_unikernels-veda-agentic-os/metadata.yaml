description: "Geoffrey Huntley 与 Justin Cormack（MirageOS 早期开发者）对谈：unikernel 曾经很难，关键词是「曾经」。他们已经不难了，因为那些难概念现在都在模型权重里。同一周，一个叫 Veda 的项目给出了更硬的证据：一个人在 8 天内写出完整的微内核操作系统，从 UEFI 引导、能力制微内核、驱动虚拟机到窗口系统、OpenGL ES 3D 游戏和一个语音代理，全部 Rust 从零写，677 个自有源文件、8.86 MB Rust 代码。本文把两件事合起来读，同时指出 Veda 仓库里没有任何 AI 辅助开发的声明这一个耐人寻味的空白。"
