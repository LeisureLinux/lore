title: "Linux 7.4 给 Zstd 动小手术：干掉白做的那次初始化"
date: "2026-09-14"
author: LeisureLinux
tags:
  - 译文
  - Linux 内核
  - Zstd
  - 性能优化
  - 压缩
summary: "Usama Arif 提交补丁，让内核 Zstd 压缩/解压延迟流初始化到首次迭代，消除一次被丢弃的冗余初始化。4KB crypto_acomp 测试显示压缩个位数提升、解压裸金属 +13%、VM 内 +35%。补丁已进入 cryptodev 分支，待 7.4 合并窗口。"
description: "译介 Phoronix 报道：Linux 7.4 将合并 Usama Arif 的内核 Zstd 优化补丁，通过延迟 cstream/dstream 初始化消除冗余工作，解压提速最高达 35%（VM 内）。含性能数字、落点与分析。"
published: true
original_source: "Phoronix - Zstd Improvement For Linux 7.4 To Avoid Redundant Initialization (Michael Larabel, 2026-09-13)"
