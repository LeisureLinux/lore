description: "树莓派的 Linux 内核树里悄悄多了两份设备树：Raspberry Pi Zero 3 W 和 Raspberry Pi 4 Model A。本文在转述 Bret Weber 的解读之外，实际拉取了这两份 DTS 源码（373 行 / 412 行）逐行核对：Zero 3 W 确认是 BCM2711（四核 A72）、eMMC2 以 8-bit 总线驱动且带 broken-cd 属性、GPIO 46 的 KEY_POWER 电源键、SPI flash bootloader、单 HDMI、PCIe 启用但只有 PWR_EN/DET_WAKE、4-lane CSI；Pi 4 Model A 确认完全没有 &eth 节点、HDMI1 永久禁用、audio_pins 为空（模拟音频与复合视频都没有）、并且带了两根天线控制线 ANT_CTRL1/ANT_CTRL2 与完整的 ant1/ant2/noant/noanthogs overlay 参数（Compute Module 4 的天线切换方案）。本文还给出两块板的完整对照表、定价逻辑，以及一节「设备树能告诉你什么、不能告诉你什么」的方法论边界。"
published: true
