title: "Intel TDX 被 AI Agent 重新点着：模型只回答，Agent 会动手"
date: 2026-11-26
slug: ai-agents-reignite-confidential-computing
category: 技术/解读
author: FreeLAMP.com
original_source: "Computerworld《AI agent security concerns kick-start confidential computing》（Agam Shah，2026-11-23）＋ 一手核对：Intel Newsroom（Mike Ferron-Jones，2026-10-09）、Fortanix 新闻稿（2026-10-18，CNCF CoCo）、Apple Security Research《Expanding Private Cloud Compute》（2026-06-08）＋ 本号三篇机密计算文章交叉核对。"
description: "解读 Computerworld 分析：AI Agent 失控事件让保护使用中数据的机密计算重新升温。核心论点「模型只回答，Agent 会动手」「无权限的 Agent 是话多的实习生，权限失控的 Agent 是等着你的事故报告」。梳理 TEE 原理与采用障碍（成本/技能/排障难）、Intel 路线图收敛到 TDX 并以 Diamond Rapids（2027）送走 SGX、Fortanix Confidential AI 支持 CNCF CoCo 与 Intel/AMD/NVIDIA Blackwell、Apple PCC 扩展到 Google Cloud（NVIDIA GPU + Intel TDX + Titan、双信任根、仅追加账本）、ServiceNow 实践与成本现实，并辨析 TEE 保机密性不保行为正确性。"
published: true
