description: "本文是 Dan McKinley《Choose Boring Technology》的完整中文翻译（原文首发于 2015 年 3 月 30 日）。它的核心是一个可以立刻拿来用的模型：每家公司大约有三个「创新代币」，总数固定且很难补充；用它写 NodeJS 网站是一枚，用 MongoDB 是一枚，用存在不到一年的服务发现技术是一枚，而自己写数据库 —— 那你就完了。全文四个小节：拥抱无聊（boring 不等于 bad，区别在于失败模式是否被理解）、全局优化（技术选型不是孤立的，代价包含运维与认知负担，所以要映射到「尽可能多问题的最不坏位置」）、有时也该用新东西（但要先问「不加新东西怎么解」，这个问题本身就是答案）、以及直接上线（多语言编程是蛇油，而克制换来的是思考更大问题的自由）。文中保留了 Kellan Elliott-McCrea 的 Rumsfeld 梗、已知未知与未知未知的区分、作者本人在 Etsy 用 PHP/MySQL/Memcached 支撑 Activity Feeds 并静默扩容 20 倍的第一手案例，以及四处脚注与 2015-07-27 的演讲更新记录。译者按部分补充了三点：AI 时代「未知未知」的审查成本变化、「全局优化」这一节最容易被误读成「永远不用新东西」、以及原文对「运维」的定义为什么至今没过时。"
