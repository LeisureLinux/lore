summary: "Homebrew 7.0.0 大版本：安装链路全面并发提速，Linux 沙箱从 Bubblewrap 换成内核原生 Landlock，官方原生 macOS 应用 BrewUI 上线，内置 brew vulns 漏洞检查并发布 CC0 公告数据库；macOS 10.15 支持终结，Intel Mac 降至 Tier 3 并将于 2027 年 9 月停止运行。"
description: "Homebrew 7.0.0 发布公告译文与解读：性能、安全、macOS 支持政策、Landlock 沙箱、BrewUI、brew vulns、post_install 弃用，以及 Intel Mac 用户迁移建议。"
