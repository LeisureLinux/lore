title: "插上电源，GPU 掉到 780 MHz：RTX Spark 笔记本上的 Linux 慢 5 倍，根因是一块加密的固件表"
date: 2026-11-04
slug: rtx-spark-linux-npcf-power-management-gap
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：mindstudio.ai《Linux on the Nvidia RTX Spark Laptop: What Actually Works》（2026-11-01）+ NVIDIA open-gpu-kernel-modules 仓库 README 支持设备表（我实测检索 GB10 / N1X）+ adnanpri/legion-wmi 项目（NPCF / NVDA0820 逆向记录）+ XDA Developers 实测报道 + ComputingForGeeks 的驱动覆盖核对 + MSI 官方产品规格 + NVIDIA NemoClaw GitHub tracker + NVIDIA DGX Spark 官方文档与 Gentoo wiki"
original_date: 2026-11-01
original_url: "https://www.mindstudio.ai/blog/linux-nvidia-rtx-spark-laptop"
description: "本文解读 MindStudio 对 NVIDIA RTX Spark 笔记本（MSI Prestige N16 Flip AI+）上运行 Linux 的实测报告，并补上了它没说的上游事实。核心发现：这不是 Linux 驱动写得不好，而是一块没有 Linux 对应物的固件组件在管功耗预算。Nvidia Platform Controllers and Framework（NPCF）在 Windows 设备管理器里可见，它通过 ACPI 方法 _SB_.NPCF.NPCF（定义在 SSDT16）拿到一张加密的功耗设置表，而只有 Windows 驱动有解密密钥。后果是插上电源时 Linux 下 GPU 被锁在约 780 MHz（Windows 约 2.2 GHz），实测 GPT-OSS-120B 生成速度 Windows 65.4 tok/s vs 原生 Linux 13.9 tok/s，换 WSL 后恢复到 65.1，而更长的跑分是 8 分钟 vs 37 分钟。⭐ 而最有说服力的对照实验是：在 Windows 里禁用 NPCF 控制器，tok/s 从约 83 掉到约 31、频率从约 2 GHz 掉到与 Linux 相同的 786 MHz —— 这一步直接证明「控制器而非内核/发行版/驱动」才是瓶颈。⭐ 更根本的一层（本文实测补上）：这台笔记本的芯片（PCI ID 10de:2e03，N1X）根本不在 NVIDIA 开源内核驱动的支持设备表里（我实测 README 全文：GB10 的 2E12 在列，N1X 出现 0 次），所以即使功耗问题解决了，官方 Linux 驱动仍认不出这块卡。⭐ 文章还记录了三个次级障碍：96GB 统一内存被固件预留给 GPU 且只有 Windows 能调（Linux 只能看到 28GB，降到 4GB 后可见 120GB）、笔记本专属硬件支持不在 vanilla 内核里（Wi-Fi/键盘/触摸板/GPU 都不认，最终靠换回 Omarchy 解决），以及「Omarchy 能跑」不等于「Linux 能跑」。⭐ 另一处反直觉现象是「插电反而更慢」—— 电池供电时 GPU 约 1800 MHz，插电后掉到约 780 MHz。最后给出的路径取舍是：WSL（今天最实用，性能几乎相同）、原生双系统（Omarchy + Windows 侧改设置 + 接受 5 倍差距）、或等 NVIDIA 把平台控制器的功耗管理逻辑移植进 Linux 驱动。"
published: true
