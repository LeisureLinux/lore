description: "LineageOS 发布 Changelog 32，正式把 24.0 分支推向 Android 17，而且比往年更早。这次一次性把 174 个设备迁到 24.0 分支。同期还有四件值得单独说的事：浏览器内 WebUSB 刷机工具（ADB/Fastboot/Odin/Amlogic 四种模式）、新的 Canvas 图像编辑器、CI/CD 全面自动化（含 REUSE 许可合规检查），以及一个不太被注意但很关键的决定：4.4 和 4.9 内核的设备被冻结在 22.2，并给 23.2/24.0 立了新门槛——只收有 1:1 eBPF 回移、且能完全不用 GCC 编译的内核。"
