description: "这篇 2023 年 6 月的文章在反驳 flatkill.org 对 Flatpak 的批评，它的核心论证是「Flatpak 是沙箱，不安全的不是沙箱而是应用」。本文核对它的关键论据，指出这个论证在 2026 年收到了两个它没等到的新证据：一个是 Flatpak 自身的 CVE-2026-34078 沙箱完全逃逸（CVSS 9.3，2026 年 4 月），另一个是 ArchWiki 至今在警告「很多 Flathub 应用默认并未被有效沙箱化」。"
