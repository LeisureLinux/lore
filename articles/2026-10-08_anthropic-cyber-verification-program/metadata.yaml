description: "Anthropic 扩大 Cyber Verification Program，按三层授权给通过审核的安全团队开放「降低网络相关护栏」的 Claude 模型。官方用 CyScenarioBench 自测显示：无授权时 50 次试验全被拦；Defense 层 46 次被拦、4 次成功；Red Team 层无拦截、34 次完成。本文梳理三层权限边界、自测数据的读法，以及安全从业者对「护栏之外要补什么控制」的共识。"
