description: "PHP2Shell 的披露泄露之后，Zvi Mowshowitz 称之为「可能是网络安全史上最糟的一天」，而经济学家 Tyler Cowen 把它当作一个时间竞赛问题来谈：怎么跑得比 AI 黑客快。本文拆解 Cowen 的三条建议（最好的防御买时间、密码轮换要快、别指望 AI 会守规矩），并用 php2shell 后续的实测数据校验 —— 英国 30+ 个政府服务下线、荷兰与芬兰政府网站下线、尼泊尔数千个政府与银行网站下线、Check Point 测到全球约 10% 组织遭到利用尝试、攻击高峰在午夜（值守最少的时候）。同时补上 Cowen 订阅墙后未展开、但更重要的一段：Claude 破解 25 年 NSA 曲线种子（lrand48 + Unix 时间戳）为什么让「轮换」从可选项变成架构属性，以及分发商「提前发布」暴露出的流程边界缺失。"
published: true
