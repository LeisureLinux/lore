title: "Linux Mint 端出两款新应用：Xepub 电子书阅读器与 Clockenstein 日历"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "Linux Mint", "XApp", "桌面", "开源应用", "译文"]
source: "https://www.phoronix.com/news/Linux-Mint-Xepub-Clockenstein"
author: "LeisureLinux"
summary: "Linux Mint 发布 2026 年 8 月开发月报，XApp 应用集新增 Xepub（体验对标 Kindle 的 EPUB 阅读器）与 Clockenstein（全新日历应用），并上线 XApp-Project.org 专门展示这套跨桌面应用套件。这是 Mint 持续构建「独立于 GNOME 上游意志的应用栈」的又一块拼图。"
