description: "Cloud Hypervisor 54 于 2026 年 10 月 14 日发布。这个版本最重要的一项改动不是某个新功能，而是一个兼容性承诺：从现在起，热迁移保证至少支持从之前两个大版本迁入（n-2），并且迁移协议版本变成了内部细节。这让「小步快跑升级」从建议变成了可依赖的路径。此外还包括 VFIO 设备热迁移、迁移取消、AArch64 上的实验性 ARM SMMUv3 仿真、大型宿主上前预取内存从 51.8 秒降到 7.4 秒，以及一个容易被忽略但很重要的修复：VM Generation ID 设备。"
