summary: "家用路由器默认给 .lan，mDNS 用 .local，老企业内网挂着 .corp / .home —— 这些名字都没有官方保障。本文用 IANA 特殊用途域名登记表与根服务器实测，厘清六个域名的真实状态：① .local 有 RFC 6762 但只能用于 mDNS，用普通 DNS 配它会让 mDNS 和 DNS 抢答同一名字；② home.arpa 是唯一有 RFC 的普通 DNS 家庭域名，RFC 8375 明确说明放弃 .home 的原因——IETF 管不了根区，无法阻止 .home 被委派；③ .corp / .home / .mail 已被 ICANN 冻结委派（使用量太大），但那是政策决定不是技术保证；④ .lan 最没有保障——既无 IANA 登记，也不在冻结名单，只是恰好还没轮到；⑤ .internal 是 ICANN 2024 年 7 月正式保留的私有用途 TLD，草案承诺 MUST NOT appear in the root zone；⑥ 企业内网最安全的做法是用自己拥有域名的子域（如 ad.example.com），因为委派链在自己手里。附三种真实风险场景（查询泄漏 / 名字碰撞 MitM / 证书冲突）与各场景迁移建议。核心判断：最重要的不是换域名，而是把内网域设为本地权威（unbound static），一步切断泄漏与劫持两条路径。"
description: "一次关于内网命名安全性的权威调研。问题：家用路由器默认 .lan、mDNS 用 .local、老企业内网用 .corp/.home，这些域名究竟什么状态、是否安全？方法：拉取 IANA 特殊用途域名登记表（依据 RFC 6761）逐条比对，并用 dig 直接询问根服务器（@198.41.0.4）验证委派状态。关键发现：IANA 登记表里只有 home.arpa（RFC 8375）和 local（RFC 6762）两个内网用途域名；.lan/.corp/.home/.internal/.private 全部未登记。根区对 .lan/.corp/.home/.internal 均返回 NXDOMAIN 且带 aa 标志（权威否认），而 .arpa 是唯一有 NS 记录的特殊 TLD。逐个解析：① .local 只能 mDNS（RFC 6762：link-local, meaningful only on the link），用普通 DNS 配它属误用；② home.arpa 的 RFC 8375 原文说明为何放弃 .home——IETF does not administer that zone；③ .corp/.home/.mail 在首轮 New gTLD 被 halt delegation（使用量太大）；④ .internal 由 SSAC-113 建议（2020-09）、ICANN 董事会保留（2024-07）、draft-davies-internal-tld 起草（作者来自 IANA/ICANN/Google），草案要求 MUST NOT appear in the DNS root zone。企业建议：Active Directory 不要用 .corp/.local/.lan，用自己拥有域名的子域（ad.example.com）。风险场景：查询泄漏（US-CERT TA16-144A，Verisign 实测约 2000 万条/天）、名字碰撞 MitM、证书体系冲突。落地建议：在用 .lan 的优先做隔离而非迁移——unbound 里把 lan. 设为 local-zone static，未定义名字本地 NXDOMAIN 且带 aa 标志，不再向上游查询。"
