summary: "iocost 2019 年合入内核时就在 commit message 里承诺「later patch 会让 BPF 写成本模型」，这一格空了七年。Tao Cui 的 RFC PATCH v3 把它补上：iocost_model_ops 单回调 calc_cost(opf, nbytes, sector, blkcg, model_flags) 返回 vtime，绑定的模型完全接管设备定价权。文中给出三类实测错误定价（同一 cgroup 双顺序读者被误判随机导致 89 倍多收、16MB 阈值内随机 IO 107 倍少收、flush/zone append 完全绕过限流），以及收益验证：双顺序读者 1961us→23us/op，完成 IO 数提升两个数量级。附 Tejun Heo 三次关键评审意见与 CFI stub 静默定价为 0 的坑。"
description: "译介并解读 LWN《Adding BPF to blk-iocost》所指向的一手材料：Tao Cui 的 [RFC PATCH v3 0/5] blk-iocost: BPF struct_ops cost model（2026-09-14）。覆盖接口设计（完整 bi_opf 保留 PREFLUSH/FUA、blkcg kptr、RCU 读锁禁睡眠）、注册绑定模型（仿 TCP 拥塞控制按名注册、io.cost.model 写 model=<name>、model=linear 恢复）、v1→v3 三轮返工（取消 EBUSY 单实例、砍掉逐 IO 回退、CFI stub 坑）、三类实测错价与两档收益数据。附解读：预留位兑现、定价权单一归属的工程价值、可睡眠程序与 CFI stub 两个失败样本。"
