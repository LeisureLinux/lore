description: "Intel 宣布下一代 Xeon 平台 Diamond Rapids 将是最后一个包含 SGX 的平台，机密计算路线正式转向 TDX。Intel 给的理由不是 SGX 技术不行，而是「行业已经围绕虚拟机隔离技术聚拢，因为它们提供了客户需要的可扩展性、部署便利性和运维模型」。这是一个关于「保护边界选在哪一层」的判断：SGX 保护单个应用飞地，TDX 保护整台虚拟机。Intel 同时给出过渡安排（现有 SGX 平台的支持与安全更新延续到 2030 年代初），并列出 TDX 的下一步：TDX Connect 的可信 I/O、后量子密码、以及增强的远程证明。"
