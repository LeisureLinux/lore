summary: "2026-06-10 CISA 发布 BOD 26-04《基于风险优先级的漏洞修复》，废止 BOD 19-02 与 22-01，联邦民口机构不再强制用 CVSS 做优先级排序，改以四个风险变量（资产暴露/KEV状态/利用可自动化/技术影响）组合出 16 格动态修复时间表，最快 3 天且须取证分类。含完整表 1、分阶段落地、取证六步法与解读。"
description: "译介 CISA BOD 26-04：取代并废止 BOD 19-02 与 22-01，以四个 SSVC 风格风险变量给出 16 格修复决策树（3天/14天/60天/下个升级），强制取证分类，分阶段 180 天落地。附默认值、动态性与四点解读（信创/关基启示）。"
published: true
original_source: "CISA - BOD 26-04: Prioritizing Security Updates Based on Risk (2026-06-10)"
