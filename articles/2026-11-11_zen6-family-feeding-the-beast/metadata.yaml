original_source: "一手核对：Chips and Cheese《AMD's Zen 6 Family: Feeding the Beast》（George Cozma，2026-11-10）全文，含正文 24 张原始图表（本文选取其中 9 张，从 Substack 原始 S3 地址下载并转为 PNG）＋ 逐图核对图中数值（Zen 6 / Zen 6c 完整流水线框图、BTB 与取指测试图、整数/VNNI 吞吐图、两张分核框图、SPEC CPU 2026 单线程估算图、两张 top-down 槽位分解图）＋ 对照 Chips and Cheese 自身测量口径与 AMD 官方对第三整数乘法单元的说明（据原文转述）"
original_date: 2026-11-10
original_url: "https://chipsandcheese.com/p/amds-zen-6-family-feeding-the-beast"
description: "本文解读 Chips and Cheese 2026-11-10 的 Zen 6 微架构实测长文，并附 9 张原文图表。核心不是「Zen 5 的自然演进」，而是 Zen 6 与 Zen 6c 首次在乱序执行引擎内部真正分家：过去 classic/dense 只是同一核心的不同密度封装，差异只在 CCD 核心数与每核 L3；现在分叉发生在微操作派发之后、载入队列之前 —— ROB 576→640、整数寄存器堆 288→352、向量调度器 138→180、载入队列 280→330，Zen 6c 一律更大，换来更强的延迟吸收能力，Zen 6 则偏向高频。前端方面，Zen 6 沿用 Zen 5 的双解码簇但允许单线程同时使用两簇、分支误预测恢复代价从约 3.5–4 ns 降到约 3–3.5 ns、L1i 内可做每周期两次分支；执行侧恢复了 Zen 4 的 NOP 配对（每周期退休 16 条）、简单整数加法从 5.25 提到 5.96/周期、整数乘法单元由 3 减到 2（AMD 称第三个不值面积）、VNNI 单元由 2 增到 4 使 512 位 VNNI 从 1.99 提到 3.88/周期；256 位向量载入提到 4/周期，与 512 位的 2/周期同为 128 字节/周期。缓存侧 L3 每核都是 4 MB，但 12 核 CCD 为 48 MB、32 核 CCD 为 128 MB，L3 延迟从 Zen 5 约 47 周期升到 55/66 周期。SPEC CPU 2026 单线程估算里 EPYC 9686F 达 6.20/10.6，领先 EPYC 9996（5.25/8.99）约 18%，但把 9686F 锁到 4.1 GHz 同频后反而是 Zen 6c 每时钟领先约 6.7%（整数）与 4%（浮点）；top-down 分解显示差距主要来自内存停顿与前端延迟停顿。结论：同频下两核几乎一样，产品差异主要由时钟、L3 容量与内存层级塑造，选型从此更依赖负载行为。"
