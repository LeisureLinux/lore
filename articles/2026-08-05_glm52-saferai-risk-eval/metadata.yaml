summary: "SaferAI 发布欧洲首份对智谱开源旗舰 GLM-5.2 的独立风险评估：能力已逼近 Claude Opus 4.7、GPT-5.5 等前沿闭源模型，但对攻击性安全与生物任务拒绝率为零，且作为开源权重模型，任何安全护栏都可被自托管者剥除、无法恢复。本文拆解四类系统性风险，并讨论开源模型安全悖论与 EU 监管的实践价值。"
description: "解读 SaferAI《GLM-5.2 Risk Evaluation Report》（2026-08-02）。基于 EU General-Purpose AI Code of Practice 评估失控、网络攻击、CBRN、有害操纵四类系统性风险。核心发现：GLM-5.2 能力接近前沿但防护薄弱，网络攻击能力随 token 预算从 36.6% 升至 76.2%，开源权重导致安全护栏可被剥除。"
