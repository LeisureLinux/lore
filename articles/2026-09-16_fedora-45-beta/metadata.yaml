summary: "Fedora 45 Beta 于 2026-09-15 发布。这个周期两条主线：系统现代化与供应链/进程边界收口。桌面与安装侧，Anaconda 原生支持装到 Stratis 卷、kmscon 取代内核 fbcon 控制台、oo7 成为默认密钥服务、Atomic 桌面改用 image-builder 构建；安全侧，非特权 ptrace 系统级默认受限、RPM 强制签名校验、DNF5 默认 allow_vendor_change=False、引入 PURL 元数据、构建正式以 99% 可复现为目标；RPM 仓库配置从 /etc/yum.repos.d/ 移到 /usr。工具链升到 GCC 16.2 / glibc 2.44 / LLVM 23 / Python 3.15 / Go 1.27 / Podman 6。"
description: "译介 Red Hat 博客 Fedora 45 Beta 公告（Jef Spaleta，2026-09-15）并附工程师视角解读：默认限制 ptrace 对排障习惯的影响与「装调试工具自动放行」的缓解设计、kmscon 取代 fbcon 后早启动与救援模式的行为变化、RPM 仓库配置迁到 /usr 对现有自动化脚本的影响、DNF5 保守默认值的取舍，以及 99% 可复现构建作为供应链完整性地基的意义。含完整变更表与关键事实速查。"
