summary: "LibreChat 是 41k+ Star 的自托管 AI 聊天聚合平台（MIT 协议）：一个界面聚合 OpenAI、Anthropic、DeepSeek、Ollama 等几乎所有模型厂商，并演进出 Agents、MCP、Skills、Code Interpreter 等 Agent 工作台能力。本文用它和 Open WebUI、LobeChat、NextChat、Chatbox、Dify、FastGPT 六个开源竞品做横评，拆解它的四大价值（MIT 商用自由、全厂商聚合、企业级多用户治理、聊天到 Agent 的演进）与三大风险（社区规模、单维护者 bus factor、复杂度），并给出适合/不适合人群的结论。"
description: "LibreChat（danny-avila/LibreChat，MIT 协议，TypeScript）定位为自托管 AI 聊天平台：统一 OpenAI/Azure/Anthropic/Bedrock/Vertex/Groq/Mistral/DeepSeek/Qwen/Ollama/OpenRouter 等厂商，支持自定义 OpenAI 兼容端点、对话中途切换模型；并演进出 Agents、MCP、Skills、Subagents、沙箱 Code Interpreter、Code Artifacts、Web Search 重排、断点续传等能力。横向对比 Open WebUI（148k★/BSD）、LobeChat（81k★/社区版协议）、NextChat（88k★/MIT 但近停更）、Chatbox（41k★/GPL）、Dify（152k★/修改版 Apache2）、FastGPT（29k★/Apache2+条件）：LibreChat 是功能完整且保持纯 MIT 的唯一选择，企业多用户/权限治理（OAuth2/LDAP/Admin Panel/token 用量控制）是其差异化；风险在于社区规模小一档、核心维护者 danny-avila 单人 3088 次提交的 bus factor、部署复杂度高。数据均来自 GitHub API，截至 2026-08-08。"
published: true
