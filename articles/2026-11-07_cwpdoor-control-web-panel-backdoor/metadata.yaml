title: "Control Web Panel 后门 cwpdoor：cwpsrv 里的静默通道"
date: 2026-11-07
slug: cwpdoor-control-web-panel-backdoor
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：奇安信 XLab《CWPdoor: The Invisible Backdoor Living Inside Control Web Panel》（2026-11-05）的技术分析与 IOC 清单 ＋ The Hacker News 报道（2026-11-06，Swati Khandelwal）＋ BleepingComputer 关于加密与签名机制的细节 ＋ ThreatDefence 的独立 VirusTotal 复查 ＋ webhosting.today 引述的 XLab 暴露面统计 ＋ 本文对照 CWP 官方 changelog 核对的修复版本时间线"
original_date: 2026-11-05
original_url: "https://thehackernews.com/2026/11/hackers-hide-linux-backdoor-in-control.html"
description: "本文解读奇安信 XLab 于 2026 年 11 月 5 日披露的 cwpdoor：一个不是独立恶意程序、而是被重新编译进 cwpsrv 源码里的 Linux 后门。Control Web Panel（CWP，原 CentOS Web Panel）是广泛用于廉价 VPS 和转售账户的免费主机管理面板，它的后端 web 服务器 cwpsrv 就是攻击者的目标。攻击者把恶意代码插入 cwpsrv 源码、重新编译、替换掉合法文件，于是这个文件「表现得像一个正常的 cwpsrv」—— 直到收到带有特定自定义 header 的请求才激活。三个设计让 XLab 形容它「异常隐蔽」（exceptionally stealthy）：其一，触发命令走 X-Ngx-Integrity 系列 header，命令与输出用 AES-256-CBC 加密，时间戳被限制在正负 300 秒窗口内且必须通过 RSA 签名校验，改动时间戳或密文任一字段都会使签名失效，从而同时获得重放保护和授权控制；其二，后门会干扰服务器的日志模块，把触发请求从 access log 里抹掉；其三，安装脚本在替换文件后会把文件时间戳改回原值，所以 ls 和 stat 看起来一切正常。更反直觉的是：安装器只支持 cwpsrv 1.15.10 与 1.24.0 两个版本，需要 root 权限，而攻击者如何拿到 root 至今未知 —— XLab 明确说这是未解之谜。暴露面方面，XLab 基于自有 Hunter 平台统计过去一个月暴露在互联网上的 CWP 实例超过 34 万个，并把它们全部描述为潜在目标。本文给出 XLab 的三条检测命令（socket / 文件 / 进程）、完整 IOC 清单（3 个 MD5、1 个 IP、3 个 URL），以及清理步骤，并指出两个容易被忽略的现实：那台「开放端口看起来正常」的机器 socket 检查却查出了后门，以及安装器会在替换成功后删除自己的备份，导致 XLab 建议的恢复手段可能根本不存在。"
