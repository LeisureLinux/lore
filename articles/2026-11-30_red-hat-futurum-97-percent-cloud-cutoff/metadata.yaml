title: "Red Hat 再谈数字主权：97% 扛不住断供，但超大规模云用量还在涨"
date: 2026-11-30
slug: red-hat-futurum-97-percent-cloud-cutoff
category: 技术/解读
author: FreeLAMP.com
original_source: "Red Hat 官方博客《Futurum Research study: Why 97 percent of enterprise IT teams cannot survive a cloud cutoff》（Jeff Lo，2026-11-30）＋ Futurum《Digital Sovereignty 2026》执行摘要/方法论/分区章节交叉核对；本号 2026-11-24《Red Hat 数字主权报告》同研究另一视角。"
description: "解读 Red Hat 11-30 数字主权博客：同一份 Futurum 研究（1940 人 28 国，Red Hat 赞助），新角度——97% 无法在云/供应商被切断时维持运营，47% 停在规划；未来十年对美国超大规模云依赖反增近 10%，私有云/本地持平；88% 视开源为核心，近三分之二认为替代维护来源关键。核心论点「主权是控制权不是位置」（key custody/可移植性/退出权）。与本号 11-24 那篇（66%/2.9%）对照阅读，指出这是 Red Hat 赞助、结论贴合其开放混合云产品的研究。"
published: true
