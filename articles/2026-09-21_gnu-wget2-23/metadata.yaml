summary: "译介 Phoronix 报道（Michael Larabel，2026-09-21）：GNU Wget2 2.3 是 2026 年首个新版本。用户可见变化：新增 --progress=dot（文本点状进度，替代默认温度计条）；改进构建系统与配置流程、打磨文档；增强 OS/2 支持（移植 ANSI 转义码、动态加载、类 DOS 路径、正确导出符号）；修复不同参数处理、文件名过长截断、iframe srcdoc 支持、几处内存泄漏。解读提醒：Wget2 是 GNU 现代重写（GitLab 托管），与 classic wget 1.x 两条线；多数发行版默认仍是 1.x、Wget2 以 wget2 命令/可选包独立存在；内存泄漏在批量递归抓取场景会缓慢涨内存，长文件名截断是跨文件系统（ext4 255B/eCryptfs/NTFS）老问题。"
description: "译介 Phoronix《GNU Wget 2.3 Released With --progress=dot, OS/2 Improvements》(Michael Larabel, 2026-09-21) 并加工程解读。事实：Wget2 2.3 为 2026 首版；新增 --progress=dot（点状进度替代默认 thermometer bar）；改进 build system/配置与文档；OS/2 支持增强（ANSI escape codes、动态加载、DOS-like path styles、正确导出符号）；修复参数处理、文件名过长截断、iframe srcdoc、几处内存泄漏；从 GitLab 下载(v2.3.0)。解读：①Wget2 是 GNU 现代重写（HTTP/2、多线程、可维护性），与 classic wget 1.x 是两条线，发型同内核不同；多数发行版默认 1.x，Wget2 常以 wget2 命令或可选包独立存在，看到 Wget 2.3 别以为发行版 wget 升了；②内存泄漏在长时间批量递归镜像(-r -l)缓慢涨内存；文件名截断是跨文件系统老问题(ext4 255B/eCryptfs 更短/NTFS 限制)，长 URL 映射文件名被砍会导致静默覆盖或写入失败；Wget2 持续收口这些边界条件正是现代重写更稳的体现。"
