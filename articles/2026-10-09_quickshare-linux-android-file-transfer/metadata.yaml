description: "Quick Share（原 Nearby Share）用蓝牙发现加 Wi-Fi 直连传文件，Android 与 Chromebook 内置，Windows 有官方 App，AirDrop 互通覆盖 Pixel 8a/9/10 与部分三星、小米、OPPO、vivo、荣耀机型。但它没有官方 Linux 桌面客户端：Chromebook 是唯一拿到官方 Linux 形态的平台，桌面 Linux 只能靠 Packet、rquickshare 这类逆向实现。本文回答「Linux PC 和手机能不能互传」，给出四条现实路径的取舍，并澄清几个常见误解（AirDrop 互通的机型前提、二维码路径其实走云端且有大小与每日限额、Quick Share 与互传联盟是两套协议）。"
