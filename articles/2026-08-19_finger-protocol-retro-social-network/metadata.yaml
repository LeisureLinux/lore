title: "Finger：1971 年诞生的社交网络，它从未真正死亡"
summary: "比 Twitter 早 30 年的社交网络！无需账号、无需算法、无需中心服务器。John Carmack 用它记录游戏开发，可口可乐机用它联网状态。本文将介绍这个诞生于 1971 年的极简协议，以及它在现代的去中心化复兴。"
