description: "Emaki 0.12.0 是一个基于 Arch Linux、围绕 niri 滚动平铺 Wayland 合成器构建的完整桌面。作者 Artur Yakymenko 一个人做了它，13 天发了 9 个版本。它的核心主张是「装好即用，之后不再碰配置」：默认配置打包成一个独立文件、你的改动在另一个文件里、他们从不写你的文件；btrfs 下每次包变更前自动快照、可以从 GRUB 菜单回滚；Secure Boot 保持开启并提供 MOK 证书与指纹；还做了一个 Programs & Updates 图形程序管理器覆盖 Arch/Flathub/AUR，并罕见地为 AUR 写明「没人检查它」。本文逐条拆解它的四条设计原则、发布纪律（含 0.7.0 因未做真实硬件测试而撤镜像的自我批评）、已知问题，以及那个专门给 AI agent 用的 sudo key 包。"
published: true
