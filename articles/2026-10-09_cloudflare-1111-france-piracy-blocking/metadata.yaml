description: "Canal+ 请求巴黎法院对 Cloudflare 处以每个站点每天 5 万欧元的罚款，理由是它只通过 CDN 封禁、没动 1.1.1.1 公共 DNS。法院驳回了罚款请求，理由是四月那份封禁令本来就「不指定手段、只要求有效」。本文拆解这个判决真正的边界在哪（它赢在程序而非原则）、判决里那个没被解释的 72.6% 数字、以及为什么同样面对罚款威胁的 Quad9 不可能引用这个先例——因为它没有 CDN 可以退守。"
