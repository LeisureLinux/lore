description: "Windows 11 build 29648.1000 中暗藏的 IntelligentCarveout 功能被媒体曝光，允许用户在统一内存（UMA）平台上为 GPU/AI 加速器预留一块对其他应用不可见的内存。本文先澄清微软并无针对该功能的官方说法（仅 Computex 博客谈过统一内存优化），逐字列出 TechPowerUp 等报道方的英文原文与代码字符串，再从统一内存争用、与现有 Shared GPU Memory/苹果/固件 UMA 的区别做技术解读，最后分析并预测 Linux 内核是否会采用同类架构——结论是 Linux 的内存模型本就统一，carve-out 概念早已以固件级 stolen memory 存在，内核大概率不会克隆这个用户态滑块，真正的演进会在驱动/运行时层而非核心 MM。"
