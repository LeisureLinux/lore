summary: 'Linus Torvalds 正式发布 Linux 7.2 内核，包含 100+ 驱动修复、30+ 网络子系统改进、19 个 DRM 调度框架重开补丁。本文深度解读 Linux 7.2 发布概况、DRM 大规模重开原因、核心子系统修复（Ceph/OVL、IPVS/Netfilter/SCTP、AMDGPU/Intel Xe）、架构特定修复（RISC-V/ARM64/PowerPC）、perf 工具链修复、升级建议等，并分析"新常态"下的内核开发趋势。'
description: 'Linux 7.2 是 2026 年 8 月 16 日发布的稳定内核版本，由 Linus Torvalds 亲自签发。本次发布包含 100+ 驱动修复、30+ 网络子系统改进、15+ 架构文件补丁，但最引人注目的是 19 个 DRM 调度框架大规模重开补丁。Linus 在邮件中表示"虽然这次的发布比预期大，但因为新常态，我们不能因为问题而延迟发布"。本文基于 LWN.net 整理的完整发布内容，深度解析 DRM 重开技术原因、Ceph/OVL文件系统改进、IPVS/Netfilter/SCTP协议优化、AMDGPU/Intel Xe驱动修复、RISC-V/ARM64/PowerPC 架构更新等内容，并提供升级建议和最佳实践。'
