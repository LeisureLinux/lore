description: "SEMI 那篇报道里的 MIPS，就是 1984 年由 John Hennessy 等人在斯坦福 MIPS 项目基础上创办的那家 MIPS 公司，也就是那个老指令集的来源。但这家公司今天已经不卖 MIPS 了：它在 2021 年宣布放弃 MIPS 架构转向 RISC-V。而龙芯的路径是三步：先通过 ST 拿授权，再做 MIPS 超集 LoongISA，最后另起炉灶做完全自主的 LoongArch。本文梳理这段三十年历史，包括那场持续多年的仲裁、双方各自宣布什么、以及为什么「指令集自主」这件事的真正难点在编译器而不在指令编码。"
