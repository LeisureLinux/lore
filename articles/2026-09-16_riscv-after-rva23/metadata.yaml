summary: "Canonical 博客梳理 RVA23 之后 RISC-V 的三个演进方向：安全（CFI，含 Zicfilp landing pad 与 Zicfiss 影子栈，2024 年批准）、性能（矩阵扩展三条路线 IME/VME/AME，关键差异在操作系统是否需支持上下文切换）、规范小版本（RVA23.1 含 3 个 development option 与 2 个 expansion option，重点是 Ssdbltrap 双 trap 处理、Sscfg 计数器委派、Ssctr 控制转移记录与 PGO）。附解读：缺失即 NOP 的兼容策略及其 Zimop 例外、矩阵扩展实为上下文切换问题、hwprobe 运行时分发、性能特性卡在内核上游的依赖链、development/expansion 分类的治理价值。"
description: "译介 Canonical/Ubuntu 博客《Evolution of the RISC-V ISA. What next after RVA23?》（Jon Taylor，2026-09-15）。覆盖 CFI 两扩展工作原理与 pre-RVA23 + 无 Zimop 时 Zicfiss 会 trap 的兼容边界、矩阵三路线对内核的具体要求（VME 零改动 / IME 扩展现有向量寄存器堆 / AME 全新寄存器文件）、sys_riscv_hwprobe() 运行时分发、RVA23.1 五个新选项详解、GCC/LLVM 支持现状与 Xuantie 树外实现，以及 Ssctr 的 PGO 依赖上游内核 perf 补丁这一阻塞点。"
