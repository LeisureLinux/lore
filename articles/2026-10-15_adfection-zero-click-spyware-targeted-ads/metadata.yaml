description: "2026 年 10 月 15 日，多伦多大学 Citizen Lab 发布第 195 号报告，首次公开证实雇佣间谍软件可以经由定向广告以零点击方式投递，他们把这项技术命名为 AdFection（Ad + Infection）。源头不是新闻媒体，而是这份报告与广告安全公司 Confiant 同日的配套调查。本文拆解它的技术内核：广告不是图片而是可执行代码，而实时竞价天然支持精确到个人的定向，两者叠加就得到一条「先验证身份、再发送载荷」的投毒通道。文章还说明为什么广告平台的内容扫描发现不了它（两段式投放与 0 字节响应），以及 40 亿条竞价记录揭示的规模。"
