title: "io_uring 的『疯狂星期五』：把阻塞操作 Inline 执行，用『身份切换』换掉线程唤醒"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "内核", "io_uring", "存储", "性能优化", "系统调用"]
source: "https://www.phoronix.com/news/Linux-IO-uring-Crazy-Friday"
author: "LeisureLinux"
summary: "Jens Axboe 发布一组 io_uring RFC patch：当 fsync、statx、openat 等『被迫异步』的操作实际不会阻塞时，直接 Inline 执行；万一真的阻塞，io-wq worker 会接管提交任务的身份并返回用户态。QD1 延迟最高降 87%，IOPS 在多数元数据场景提升数倍，但 fsync ext4 高队列深度出现回落。"
