description: "LibreOffice 26.8 把「没有生成式 AI」写进发布说明，随后 TDF 博客回应了那条提问并给出六条验收标准：用户控制推理位置、未授权内容不得离开本机、零遥测、不依赖单一供应商、不牺牲 ODF 格式、完全可选。本文梳理这六条条件、TDF 关于「为什么我们的动机不同」的商业模式论证，核实扩展生态的真实本地化程度，并指出「默认无 AI」并不等于「生态无风险」。"
