slug: linux-kernel-ai-agent-skills-7-5
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix 报道（Michael Larabel，2026-11-26）＋ Sasha Levin/Ted Ts'o 的 patch series（v1–v5，含 v3 0/7 cover letter 与各 SKILL.md）、LKML/Patchew 存档、It's FOSS 与 freenode 技术报道一手核对。"
description: "解读 Linux 内核拟在 7.5 合并窗口合入 agents/skills 目录：Sasha Levin（NVIDIA，LTS 维护者）与 Ted Ts'o 推动，把指导 AI 编码代理的技能收进内核树。起因是 Maintainers Summit 上 Hannes Reinecke 估计 15–20% 的 Fixes 标签是错的；五个技能：find-fixes（定位真正引入 bug 的 commit）、stable-tag（判断回移/生成标签）、find-siblings（用 Coccinelle 找同类 bug）、commit-message（写审 commit message 和 PR 文本）、writing-kunit-tests（Ted Ts'o 贡献）。技能是 SKILL.md，指向已有流程文档并补充 AI 常犯的坑；只检查与报告，不改文件、不建 commit、不发邮件，无法确定就不返回标签。Sasha 已请求把 agents 分支从 linux-next 移除，准备提交给 Linus；仍待 7.5 合并窗口。"
published: true
