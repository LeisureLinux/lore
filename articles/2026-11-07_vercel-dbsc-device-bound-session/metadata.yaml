title: "Vercel 接入 DBSC：浏览器开始证明「是我这台机器」"
date: 2026-11-07
slug: vercel-dbsc-device-bound-session
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Chrome 官方文档《Device Bound Session Credentials (DBSC)》的完整实现规范与回退行为说明 ＋ TechRepublic《Vercel Introduces DBSC: How It Protects Against Cookie Theft》（Joseph Ofonagoro，2026-11-06）＋ Google 官方博客《Protecting Cookies with Device Bound Session Credentials》（2026-04-09，Chrome 146 Windows 公开可用）＋ Vercel CTO Malte Ubl 的 X 公告（2026-11-03）＋ W3C WebAppSec DBSC 规范"
original_date: 2026-11-06
original_url: "https://www.techrepublic.com/article/news-vercel-dbsc-session-cookie-theft-protection/"
description: "本文解读 Vercel 于 2026 年 11 月 3 日宣布接入 Device Bound Session Credentials（DBSC），并结合 Chrome 官方实现规范讲清楚这件事到底做了什么、以及它的边界在哪里。会话 cookie 被窃取后重放，是当前最有效也最无解的账号接管路径 —— infostealer 偷走 cookie，攻击者在另一台设备导入，就完全跳过了密码和多因素认证。DBSC 的做法是给浏览器发一对密钥，私钥存在硬件里（TPM 或 Secure Enclave），会话改成短时效 cookie，每次续期都要用私钥签名证明「我还是原来那台设备」。攻击者偷到 cookie 却没有私钥，服务端就能拒绝续期。**但这篇报道里最容易被跳过的三个限定，都在 Chrome 官方文档里写得很清楚**：①**DBSC 只保护 cookie 的续期，不保护注册那一刻** —— 官方明确写着「如果恶意软件在会话注册期间就在设备上，它可能能够提取私钥」，只是说这种攻击「比标准的 cookie 窃取复杂得多且更容易被发现」；②**Chrome 会静默跳过 DBSC 操作并回退到长时效 cookie**，触发条件包括刷新端点不可达、TPM 忙或签名出错（因为 TPM 是全系统进程共享的，过于频繁的刷新可能超出它的速率限制）、以及 DBSC 管理的短时效 cookie 属于第三方 cookie 而用户屏蔽了第三方 cookie —— **这个回退只有在你同时保留长时效和短时效两个 cookie 时才有效**，而官方恰恰推荐这种「韧性模式」，两者叠加就产生了静默降级；③**DBSC 只适用于 HTTPS 页面，不支持 Partitioned cookie，也不保护 HTTP 请求**。Vercel 的实现跟随 Chrome 在 Windows 上的 Chrome 146 与 macOS 上的 Chrome 148，目前只支持 Chrome，且正在逐步放量。这件事真正值得注意的地方在于它代表的方向：现代安全措施越来越依赖硬件能力而不只是软件更新 —— Windows 11 安装已要求 TPM 2.0，BitLocker 与 Windows Hello 也依赖它。对没有兼容硬件的旧设备，这些新保护直接缺席。"
published: true
