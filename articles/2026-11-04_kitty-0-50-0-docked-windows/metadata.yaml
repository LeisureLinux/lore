title: "kitty 0.50.0：把窗口「停靠」成状态栏，以及一个终端模拟器半年内的 13 条安全公告"
date: 2026-11-04
slug: kitty-0-50-0-docked-windows
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：kitty 官方 changelog 全文（docs/changelog.rst，master 分支原文）+ GitHub Release v0.50.0（2026-11-03 13:56:09Z）+ GitHub Security Advisories API（13 条，含逐条 affected/patched 版本区间）+ GitHub Releases API 版本时间线"
original_date: 2026-11-03
original_url: "https://sw.kovidgoyal.net/kitty/changelog/"
description: "本文解读 kitty 0.50.0（2026-11-03 发布）—— 一个以「快」为卖点的 GPU 终端模拟器，⭐ 半年内连发 12 个版本。⭐ 而本文最想讲的不是新功能，是它的安全记录。⭐ 通过 GitHub Security Advisories API 逐条核对，kitty 共有 13 条安全公告，⭐ 覆盖范围横跨「未认证远程 RCE」（GHSA-w98g-hpvr-r332，@kitty-edit DCS + --color=geninclude）、命令注入（GHSA-ccp2-q4v6-rw94 / CVE-2026-72913、GHSA-5gmr-9gwg-hhq6 / CVE-2026-54057、GHSA-p64q-59hq-5q65）、认证绕过（GHSA-wpff-qjx2-fw8r）、任意文件覆盖与任意文件写（GHSA-r892-cv7q-fw8x / CVE-2026-54056、GHSA-q446-x7q6-vcxh / CVE-2026-54055）、未认证任意目录删除（GHSA-2c4w-h24w-q7gg）以及一条 critical 级别的整数溢出堆读写（GHSA-qfgm-2c64-6x3x / CVE-2026-33642）；⭐ 其中「远程控制认证绕过」与「文件传输确认提示绕过」两条恰好在 0.49.2 与 0.50.0 这两个最新版本里修复。⭐ 据此整理出完整的「哪个版本修了什么」对照表：0.46.3 修 2 条（含 1 条 critical）、0.47.0 修 2 条、0.47.2 修 2 条、0.47.3 修 1 条、0.48.2 修 1 条、0.49.0 修 2 条、0.49.2 修 2 条、0.50.0 修 1 条 —— ⭐ 平均每个版本带一条，且几乎都是下一个补丁版本就修掉，⭐ 说明这是一个「发现即修」的节奏。⭐ 而 13 条公告里至少 7 条的触发方是「远端或本地能发字节流的一方」，⭐ 集中在 kitty 自己加的扩展协议（@kitty-edit / @kitty-echo / OSC 21 / OSC 133 / 文件传输 / 图形协议 / 远程控制）上 —— ⭐ 也就是说 kitty 的核心渲染循环本身是安全的，⭐ 攻击面来自它主动赋予远端程序的能力。另一半讲 0.50.0 的功能：窗口停靠（docked windows，⭐ 关键设计是「跟着宿主走、随宿主关闭而关闭」）、注销后恢复会话（⭐ 含 scrollback，⭐ macOS 用钥匙串加密、Linux 需 Inhibit portal）、Wayland 客户端侧装饰对齐 GNOME、触摸屏支持（⭐ 点=点击 / 动=带动量滚动 / 按住不动=选文本）、OSC 7501 程序状态协议、图形协议的索引色图像格式与按特性探测，以及 0.49 那 7 项性能优化中三项 SIMD 的细节（⭐ 含 AVX-512 解码器自动用于 Ice Lake+ 与 Zen 4+）。"
