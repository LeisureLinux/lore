title: "Intel NPU 驱动 1.39.1：15 行补丁铺垫一年，Nova Lake 正式可用"
date: 2026-11-21
slug: intel-npu-driver-1-39-1-nova-lake
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix《Intel Linux NPU Driver 1.39.1 Released With Nova Lake Support》（Michael Larabel，2026-11-21）＋ Intel linux-npu-driver v1.39.1 GitHub Release Notes（2026-11-19）＋ IVPU NPU6 内核补丁（Maciej Falkowski，2025-10-21）＋ 本号骁龙 NPU、Mesa Torx 两篇交叉核对。"
description: "解读 Intel Linux NPU 用户态驱动 1.39.1：唯一新增是正式支持 Nova Lake（第 6 代 NPU / NPU60xx），依赖已合入主线的 IVPU 内核支持。梳理内核态 IVPU 与用户态驱动分工、15 行补丁加 PCI ID 与 NPU6 固件的过程、验证配置矩阵（Meteor→Nova Lake、内核 7.0.0-38、OpenVINO 2026.4.1 与推荐但尚未发布的 2026.5）、Level Zero 1.34.0、固件与安装步骤，并把它放进 Mesa Torx 与厂商全栈两条 NPU 路线的对照里。"
published: true
