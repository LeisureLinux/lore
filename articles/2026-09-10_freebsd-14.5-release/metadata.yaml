summary: "FreeBSD 14.5-RELEASE 发布：面向仍未迁移 FreeBSD 15 的生产环境，回灌大量 bug 修复、修掉数十个安全问题（RCE、DoS、内核栈、UAF），并更新 LLVM 21.1.8、ncurses 6.6、OpenSSL 3.0.21、XZ 5.8.3 等外部组件。硬件侧 ACPI 改进双 GPU Apple Mac 电源管理、AHCI 支持更多 SATA 控制器、ASMC 弃 32 位 Intel Mac。本文为 Phoronix 报道译文，附解读：稳定分支最后一班岗、AI/LLM 审计正在重塑安全公告的发现分布、与 Linux 内核清退上古硬件的同频节奏。"
description: "Phoronix 2026-09-07 报道译文与解读：FreeBSD 14.5-RELEASE 发布，覆盖数十个安全修复（远程代码执行、DoS、内核栈问题、use-after-free）、外部组件滚动（LLVM 21.1.8、ncurses 6.6、OpenSSL 3.0.21、XZ 5.8.3）与硬件支持变化（ACPI 双 GPU Apple Mac 电源管理、AHCI 扩展 SATA 控制器支持、ASMC 放弃 32 位 Intel Mac）。附 FreeBSD stable branch 维护模型、AI 辅助安全审计趋势与升级路径建议。"
