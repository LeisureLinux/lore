title: "1Password 遭 GitHub 账号入侵：客户数据和源码被拷走，但保险库没破"
date: 2026-11-26
slug: 1password-github-breach-vaults-safe
category: 技术/解读
author: FreeLAMP.com
original_source: "The Hacker News 报道（Ravie Lakshmanan，2026-11-26）＋ 一手核对 1Password 官方公告《Update on a security incident involving 1Password's backend systems》（2026-11-25）。"
description: "解读 1Password 11 月安全事件：攻击者拿下员工企业 GitHub 账号，借此访问私有仓库源码、向后端推恶意代码下载客户管理数据（姓名、邮箱、账户 ID、公钥、SRP 参数、邀请/配置/恢复邮件 token、内部元数据）。讲清为什么保险库内容/密钥/恢复密钥没被碰——零知识架构下 1Password 自己也拿不到你的密码和 Secret Key；邮件 token 单靠它无法登录（还需 SSO 或六位验证码，且已从 6 位数字扩到 10 位字母数字）；CI/CD 基础设施密钥已轮换。给出时间线、处置和用户动作（防钓鱼，不用改密）。"
published: true
