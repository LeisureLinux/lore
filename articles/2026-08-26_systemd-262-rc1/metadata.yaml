summary: "systemd 262-rc1 进入测试周期。三类硬改动：(1) 启动 / 容器路径——manager 内嵌 basic.target / multi-user.target 等兜底 unit，PID 1 可构建为单文件静态多调用二进制、专为微型容器而生；(2) 调度 / NUMA——NUMAPolicy= 新增 preferred-many 与 weighted-interleave，service 新增 RestartRandomizedDelaySec= 把同步故障重启风暴抹平，slice 加 ActivatingConcurrencyMax=；(3) 安全 / 机密计算栈——TPM 凭证强制绑 SRK 防 MITM 偷取、cryptenroll 新增 first-boot wizard、cryptsetup 启用 Argon2id 强化 PIN、vmspawn 把 Intel TDX 纳入 --coco=、SEV-SNP 走 initrd /.extra/system_credentials/ 让凭证纳入启动度量。文档侧 ukify --sign-initrd-pcrs、NvPCR 重写为基于 PCR policy、pcrextend 不再依赖 anchor secret、cryptenroll / cryptsetup 走 Varlink API。"
description: "基于 Phoronix 报道与 systemd 官方 GitHub release notes (v262-rc1) 的逐项解读：覆盖 PID 1 静态构建、嵌入 unit fallback、unified cgroup workers、Live Update Orchestrator 支持、NUMAPolicy 新值、RestartRandomizedDelaySec、Slice ActivatingConcurrencyMax、D-Bus EnqueueUnitJobMany、Varlink 接口矩阵、TPM SRK pinning + Argon2id PIN、cryptenroll first-boot、dm-verity over LUKS、NvPCR 重写、vmspawn TDX、SEV-SNP /.extra/system_credentials、fs-verity-backed homed、journald OpenSSL 迁移、udev Varlink 等。"
