description: "2026 年 10 月 29 日，一个自称 anthropic.claude-code 版本 2.1.313 的扩展被投毒后上架到 Cursor 的扩展市场，11 小时（02:27–13:35 PT）内触达最多 5000 名用户。它与正版扩展的唯一差别是 extension.js 开头被插入了一个 66 行的 IIFE —— 解包后与正版完全一致、内置二进制也是官方的、正版代码在其后照常运行。payload 往 ~/.ssh/authorized_keys 追加一把名为 svc-telemetry 的 Ed25519 公钥（指纹 SHA256:0Z6R+DF64Do2nwQic8a7kkfDLNNk4IiK+2U2Rci4htk）、尝试开启本机 SSH 服务、把内嵌私钥解码成 .stk_<10hex> 建立到 134.209.82.225 的 -R '*:0:localhost:22' 反向隧道、并按平台装持久化（macOS 用 com.apple.sysmond 伪装成 Apple 组件的 LaunchAgent、Linux 走 crontab @reboot、Windows 建名为 SysMon 的 SYSTEM 计划任务），最后用 HTTP beacon 外传主机侦察信息。本文核对了 OpenSourceMalware 与 ox.security 两份独立技术分析、Cursor 官方公告与官方修复脚本要点，并特别澄清了一次归因修正 —— 毒源是 Cursor 自己的市场而非 Open VSX，因此 Windsurf 等 Open VSX 用户不受影响。全文的核心是防守方清单与「卸载扩展不等于清除后门」这一判断。"
published: true
