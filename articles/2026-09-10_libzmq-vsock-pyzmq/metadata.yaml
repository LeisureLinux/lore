summary: "AF_VSOCK 是专为 guest 与 hypervisor/host 通信设计的套接字地址族（Linux 4.8+，前身 VMware VMCI），AWS Nitro Enclaves 靠它通信。Rémi Jouannet 给 libzmq 提交 PR #4822 补上 vsock 传输（照 VMCI 代码复制粘贴级别），并 fork pyzmq 提供 pyzmq-vsock 轮子。所有 ZMQ 绑定语言由此解锁 AF_VSOCK，req/rep、pub/sub 与 Curve 认证全部继承。本文为原文译文，附 loopback Hello World 与 Curve+asyncio 实操，以及通信面隔离、传输与语义解耦、国产虚拟化 guest agent 参照的解读。"
description: "译文与解读：libzmq 的 VSOCK 支持（PR #4822）与 pyzmq-vsock。覆盖 AF_VSOCK 地址族（CID、端口、stream/datagram、VMADDR_CID_LOCAL loopback）、libzmq 传输抽象成色、vsock://@:5555 Hello World 实操、Curve 认证 + asyncio 生产形态（curve_server 必须先于 bind、vsock_loopback 需 modprobe）、以及 guest agent 通信从串口到 VSOCK+ZMQ 的现代化模板与信创虚拟化参照。"
published: true
original_source: "Rémi Jouannet — Use VSOCK with libzmq (blog.remijouan.net)"
