summary: "Computerworld 报道路透社调查：Meta 的 Project OT 曾计划裁掉部分团队最多 60% 成员并用 AI 替代，因内部数据显示方案跑不通而最后一刻收手。内部代码变更同比 +220%，但触达用户的功能变更仅 +36%；重大技术与安全事件 +40%，员工救火时间 +70%。含分析师观点与解读。"
description: "Meta Project OT 用 AI 替代员工受挫的译文与解读：220% vs 36% 的产出-交付剪刀差、不受约束的智能体带来的 40% 事件增幅与 70% 救火时间、跟踪员工训练 AI 引发的反弹、以及把预测当产能的组织教训与权限分层建议。"
published: true
