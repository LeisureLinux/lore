description: "安卓的「私人 DNS」（Private DNS）一直只能走 DNS-over-TLS（853 端口），这在封 853 的校园网/酒店/机场会直接失败。Reddit 上一个用户翻安卓源码后发现：系统其实完整实现了 RFC 9462（DDR，Discovery of Designated Resolvers），可以把 Private DNS 自动升级成 HTTP/3 上的 DoH —— 只是被一个 feature flag 挡着。实测拉取他配套的开源工具 loophole（Cloudflare Worker + 文档）后发现关键现实：Android 硬编码支持的只有 Google 与 Cloudflare，需要开 flag 的只有 Quad9 等极少数，而 NextDNS / AdGuard / Control D 等几乎所有主流服务都不发布 DDR 记录 —— 评论区最尖锐的一条评论指出根因是「DDR 的记录是按域名的，而 profile 是按用户的」，所以原生这条路对绝大多数用户实际上走不通，而 workaround（自建 Cloudflare Worker 当 DoH 端点）恰恰是它最大的价值。本文梳理完整原理、四条 flag、Cloudflare Worker + SVCB 记录的搭建方法、必须知道的安全代价（DoH 端点按设计无法鉴权）、以及「不需要 root / 不耗电 / 不干扰其他流量」相对后台 VPN app 的真实优势。"
