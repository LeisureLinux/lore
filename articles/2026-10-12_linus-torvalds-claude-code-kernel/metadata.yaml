description: "Linus Torvalds 的 linux.git 里出现了名为 noref-filemap-read-with-llm 的分支，目标是在页缓存读取时不再需要 folio 引用。他的 commit message 确认「代码、测试程序、评审以及本文初稿都由 LLM 编码助手（Claude Code）在我的指导下完成，而测量是在我的机器上跑的」。实测数据很漂亮（8 线程场景下每读耗时从约 2950 周期降到 725，load HITM 从 30538 降到 101），但真正值得读的是同一份 message 里的另一半：他列出了单线程未映射页场景变慢、allocator 看不见等待中的页、以及一个「本系列最没解决的部分」。同日还有一个 assoc-array-fixes tag，他在里面用 LLM 拆解自己看不懂的代码，确认了原报的 bug 并额外揪出三个存在十余年的旧 bug。"
