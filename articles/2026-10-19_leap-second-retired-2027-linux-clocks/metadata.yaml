description: "2026 年 10 月 15 日，国际计量大会（CGPM）通过决议，把连续 UTC 的生效日期定为 2027 年 5 月 20 日，并把 UT1-UTC 的最大允许差值从 1 秒放宽到 3600 秒（1 小时）。这意味着「闰秒」这个从 1972 年开始的制度将在明年退役。而 Linux 对这个变化其实早有准备：CLOCK_TAI 从 3.10 起就存在，专门用来避开闰秒跳变。本文解释这次决议到底改了什么、为什么推动它的是一个「从未发生过」的风险，以及 Linux 的时间接口在闰秒消失后会变成什么样。"
