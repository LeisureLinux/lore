description: "高通工程师 Khem Raj 在 Linux Plumbers Conference 2026 提问：在 GenAI 编码代理让补丁量激增的时代，LTS 发行版还有意义吗？他主张滚动发布的优势（无需大量回移、与上游分歧更小、安全修复更快）。本文核对了他没说出口的实证：网络子系统维护者说自己「完全被淹没」，一个周期合并了 632 个 net 补丁和 648 个 net-next 补丁，其中 1/3 到 1/2 像是 AI 驱动的低优先级修复；无线维护者推出「三秒评审」规则；内核 staging 区开始拒收 AI 补丁；NetworkManager 用「biblioklept」金丝雀识别 AI 代理。我的判断是：补丁洪流是真的，但把结论推向「滚动发布优于 LTS」是假二选一，因为瓶颈在评审带宽，而滚动发布并不解决这个问题。"
