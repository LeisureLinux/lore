summary: '本文记录一次真实的 arm64 交叉构建：从 github.com/gregkh/linux 为 7.1.0-rc3 构建 linux-tools（perf、bpftool、kheaders 等运维工具）并交叉编译成 aarch64。文章按踩坑顺序复盘五个真实错误（缺 .config 就 make、在用内核树里构建、交叉工具链装半套、host/target 工具混淆、ARCH 与 CROSS_COMPILE 写混），并详解交叉工具链每个组件的作用与完整可复现步骤，附一份可复用 Makefile。'
description: '从 gregkh/linux 构建并交叉编译 linux-tools 的完整实战教程。覆盖：交叉编译的动机与 out-of-tree 隔离构建、五个真实踩坑点及其教训、aarch64 目标交叉工具链（交叉 GCC、binutils 2.44、libc6-dev-arm64-cross、sysroot）的完整组成与每块组件职责、ARCH 与 CROSS_COMPILE 的区别、以及可复现的 config→build→verify→package 全流程。面向需要把内核 out-of-tree 工具（perf、bpftool、kheaders）交叉编译进 arm64 rootfs 的内核 / 系统工程师。'
