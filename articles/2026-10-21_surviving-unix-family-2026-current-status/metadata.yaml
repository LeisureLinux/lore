description: "第二篇：把今天还活着的 Unix 系操作系统列成一张全表，每个都给最新版本、发布日期和支持截止日。其中几条会颠覆认知：HP-UX 已在 2025 年 12 月 31 日彻底终止支持；AIX 还在积极开发而 7.3 TL4 支持到 2028 年底；Solaris 11.4 支持到 2037 年；macOS 从 26 起改用年份版本号且 27 已不支持 Intel；Xenix 早在 1996 年就停止；而 illumos 这条你可能没听过的分支还在发版。"
