description: "php2shell 两个 CVE 发布后，PHP 基金会发了一篇不复用技术细节、只讲组织与流程的长文。本文解读其中三件事：一是官方罕见地承认「这个修复拖了两年是结构性失败」——安全团队在几个都有代价的方案之间无法抉择，加上核心开发人员少而分散，导致工作反复停摆重启；二是从 2024 年 Quarkslab 首次外部审计，到 2026 年 8 月 11 日 Calif 报告无条件 RCE，中间的 28 个月里发生了什么（AI 扫描工具既帮忙也制造噪音）；三是协调披露是怎么崩的 —— CVE 号提前两天带着错误的发布时间和错误的 CVSS 10.0 流通、提前公告、缓解建议泄露、Calif 误发 PoC 视频、Chainguard 在发布前 6 小时单方面破坏 embargo。"
published: true
