description: "Canonical 的 Gianpiero Carpinelli 正在为 Debian 的 APT 引入 SHA3-256 / SHA3-384 支持，本周已形成上游 APT 的合并请求，默认不启用。动机是 Ubuntu 24.04 LTS 支持到 2036 年，一旦 SHA2 在那个窗口内被攻破，已部署的客户端必须能理解结构上不同的哈希族。本文梳理这个 PR 的范围、为什么是现在、为什么选 SHA3，以及它对镜像站与长周期离线部署的含义。"
