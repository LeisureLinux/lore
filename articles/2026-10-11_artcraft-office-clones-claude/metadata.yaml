description: "Brandon Thomas 的 ArtCraft 项目在做 Adobe 全家桶的 Rust 替代品之后，又发布了 WordCraft、GridCraft、DeckCraft 三个 Microsoft Office 替代品，由 Claude 参与开发。本文不看新闻稿，而是直接读仓库：官方 ROADMAP 自己写着 GridCraft 的「可用于实际工作」约 50%、WordCraft 约 60%，并列出了具体阻断项（100MB 工作簿打不开、没有 .xls、阿拉伯文与天城文没有字形整形、图表往返丢类型，以及「没人确认过 Excel 能无修复提示打开我们的输出」）。而真正值得学的是 CLAUDE.md：它是一份给 AI 代理的施工规程，包含 clean-room 边界、No-panic 硬规则、以及「一切皆命令」的架构决定。这解释了一个法律层面的关键选择：为什么它明确禁止复制 GPL/AGPL/LGPL 代码，却用 MIT/Apache-2.0 发布。"
