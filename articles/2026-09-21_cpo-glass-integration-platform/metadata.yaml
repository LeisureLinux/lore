summary: "译介 SemiWiki 报道（Moh Kolb，2026-09-21）：共封装光学（CPO）被视为「距离问题」——把光引擎挪近交换 ASIC/XPU 以缩短电通道、压低 SerDes 功耗、抬升带宽密度，但贴近不消灭物理瓶颈（只换坐标游移）。核心命题：封装不再只是支撑系统，而是定义能造出什么系统；CPO 把基板抬到战略地位。玻璃作为集成平台的优势：尺寸稳定性好、低损耗高频电布线、光滑表面承载细 RDL、CTE 可定制、可做大得多的集成尺寸（不受硅中介层晶圆尺寸/经济性约束）；光学对几何极敏感，尺寸稳定成为架构能力。更进一步：玻璃基板可能同时参与电集成与光集成（TGV 垂直互连+基板内光学结构），成为「集成平面」。关键闸门 TGV（玻璃通孔）制造难在孔形/损伤/金属化/铜填充/界面附着/残余应力/开裂/长期可靠性；玻璃不是散热材料（热路径须刻意设计）；生态（材料/设备/TGV/细 RDL/KGD/检测/多源供应）比首次演示更重要。关联长鑫 3D NAND、华为 122TB SSD 板级封装的「以封装破制程/基板逆向」叙事。"
description: "译介 SemiWiki《The Future of CPO May Be a Glass Integration Platform》(Moh Kolb, 2026-09-21) 并加工程解读。事实：CPO 通常描述为距离问题（光引擎挪近交换 ASIC/XPU，缩短电通道、压低 SerDes 功耗、抬升带宽密度），但物理瓶颈不消失只换坐标游移；封装正从支撑系统变为定义系统，基板变战略；玻璃做集成平台优势：尺寸稳定性、低损耗高频电布线、光滑表面细 RDL、CTE 可定制、大集成尺寸（不受硅中介层晶圆约束）；光学对几何极敏感，尺寸稳定成架构能力；未来玻璃基板可同时参与电与光集成（TGV 垂直互连+基板内光学结构）成为 integration plane；TGV(玻璃通孔)关键挑战：孔形/玻璃损伤/金属化/铜填充/界面附着/残余应力/开裂/长期可靠性；玻璃非散热材料、热路径须刻意设计；生态(材料/设备/TGV/细RDL/KGD/检测/多源)比首次演示更重要，可重复制造平台才是真门槛。解读：①与长鑫3D NAND(北京建3D NAND研发线)、华为122TB企业级SSD(板级封装突破高层数闪存封锁)同属「以封装破制程/基板逆向」叙事，先进封装从配角变架构定义者；②作者卖的是「集成平面」角色反转(基板从连接者变参与者)，类比微服务复杂度在 mesh 编排而非单服务；③两清醒剂：玻璃不是散热材料、首次演示≠平台，跟踪 CPO/玻璃看 TGV 良率/RDL 线宽/多源 KGD 而非 demo。"
