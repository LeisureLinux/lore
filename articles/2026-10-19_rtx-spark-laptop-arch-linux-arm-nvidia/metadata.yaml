description: "一台 128GB 统一内存、6144 CUDA 核心的 RTX Spark 笔记本，官方只支持 Windows 11。作者本人是 Arch Linux 官方打包者，她把它跑上了 Arch Linux ARM，代价是自己写 ACPI 覆盖、打 hid-asus 补丁、写音频 machine driver。本文梳理她测出的三组数据（7-Zip 与 Windows 几乎打平、内存池比 Windows 多 6.3 GiB、vLLM 推理约 30 tokens/s），并补上一个她没明说的前提：Blackwell 只能用开源内核模块。"
