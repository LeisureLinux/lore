description: "2026 年 10 月 16 日，X.Org 公布了 17 个 CVE，全部落在客户端库里：libX11、libXi、libXpm、libXrender、libXtst。而不到两周前，X.Org Server 与 XWayland 刚发过一批。本文梳理这 17 个漏洞的技术形状，并指出这批漏洞最值得注意的地方：威胁模型反过来了——以前是服务器要防恶意客户端，现在是客户端要防恶意服务器。而这解释了为什么它们大多是越界读（只影响可用性）而不是越界写（可注入代码）。"
