summary: "针对技术圈反复出现的「批判 YAML / Norway Problem」风气，PJB 翻出 YAML 1.0/1.1/1.2 规范与 2002–2007 年 yaml-core 邮件列表，论证规范作者早已明确「默认按字符串解析」，坑在库实现而非规范。附工程实践解读。"
