summary: "翻译并解读 Phoronix 关于 GNU coreutils 9.12（2026-09-14 发布）的报道：递归 -R 遍历时并行删除文件导致 chcon/chgrp/chmod/chown/du/ls 失败的多年老 bug 被修；uname 新增 -A/--all-labeled（逐项打标签、每行一项）；stat/tail 支持 FailFS 与 NULLFS。对照上游 NEWS 补充 9.11 的 cat 零拷贝、wc 大块读等性能背景。"
description: "基于 Phoronix（Michael Larabel，2026-09-14）报道、并对照 coreutils 上游 NEWS 的翻译+解读。核心变更：9.12 修复递归 -R 遍历目录时若有文件被并行删除则 chcon/chgrp/chmod/chown/du/ls 直接失败的长期 bug；stat 与 tail 新增对 FailFS、NULLFS 文件系统类型的支持（stat -f -c%T 可报告，tail -f 走 inotify）；uname 新增 -A/--all-labeled，将内核名/节点名/release/version/machine 逐项打标签、每行一条，便于脚本解析；另有 factor 缓冲区越读、Solaris 专有 bug 修复。解读展开四点：该 -R 竞态在日常并发目录（CI、日志轮转）上极易触发；uname -A 为自动化而生、优于 awk 切 uname -a；性能大数字其实落在 9.11（cat 零拷贝约 6×、wc 大块读约 10%、cut 新选项），并提示 --with-linux-crypto 已移除（AF_ALG 将废弃且慢于 OpenSSL）；以及 uutils 0.11.0 也已支持 uname -A，印证两套实现的 drop-in 兼容收敛。与本站 coreutils 105 命令手册、Ubuntu Rust coreutils 形成系列。"
