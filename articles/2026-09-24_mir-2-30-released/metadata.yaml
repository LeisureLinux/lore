summary: "编译 Phoronix（Michael Larabel，2026-09-24）：Canonical 发布 Mir 2.30（自建 Wayland shell 的合成器库）。关键变化：①构建 Mir 现在明确要求 Rust 编译器（此前可选），evdev 输入平台改用 Rust，MIR_ENABLE_RUST 选项移除；②动机是 Mir 严格锁定 Ubuntu 26.04 LTS+，该平台 Rust 本就强制，故可无条件假定存在；③新增 Wayland wl_fixes 协议支持、修 bug、文档改进；④首次随文档发布公开路线图，含硬件 plane 做视频播放、全 Rust 构建 Mir 合成器、稳定 mir-shell 扩展、长期渲染管线设计、Mir shell 的 systemd 集成、安全改进。解读：Mir 早已从『Ubuntu 下一代替换』退位为可复用合成器库；Rust 由可选变必需是 OS 目标收窄的连带结果，呼应 Ubuntu 26.10 coreutils 全面 Rust 化与 Binder C 驱动被 Rust 取代的浪潮；wl_fixes 是跟 Wayland 上游走的成熟信号；首次公开路线图最有信息量，标志进入产品化/长期维护节奏（冻结扩展面=第三方敢依赖）。"
description: "编译 Phoronix（Michael Larabel，2026-09-24）报道：Canonical 发布 Mir 2.30，这是用来自建各类 Wayland shell（从智能镜子到消费设备）的合成器库最新版。原文要点——(1) Mir 2.30 明确要求 Rust 编译器，evdev 输入平台代码改用 Rust，构建选项 MIR_ENABLE_RUST 移除，构建 Mir 必须始终具备 Rust；(2) 动机：Mir 现严格面向 Ubuntu 26.04 LTS 及更新，该平台 Rust 被强制要求，故可安全无条件假定；(3) 新增 Wayland wl_fixes 协议支持，修复若干 bug，带来文档改进；(4) 首次随 2.30 文档发布公开路线图，包含为视频播放使用硬件 plane、支持完全用 Rust 构建基于 Mir 的合成器、稳定 mir-shell Wayland 扩展、设计长期 Mir 渲染管线、Mir shell 的 systemd 集成、安全改进；(5) 版本可从 github.com/canonical/mir/releases/tag/v2.30.0 下载。解读：Mir 早非『Ubuntu 下一代替换』而是一块更底层、更可裁剪的可复用合成器库；Rust 从可选变必需本质是主动收窄支持面到 Ubuntu 26.04+ 的连带结果，与 Ubuntu 26.10 coreutils 100% Rust 化、Google Binder C 驱动被 Rust 取代同属 Ubuntu 生态 Rust 化浪潮——Rust 正从加分项变入场券，代价是无 Rust 工具链平台需补 Rust 或留旧版；wl_fixes 引入是主动对齐 Wayland 上游协议演进的成熟信号；首次公开路线图最有信息量，标志进入产品化/长期维护节奏（硬件 plane 视频=嵌入式媒体省电手法；全 Rust 合成器与 Rust 硬依赖是组合拳；稳定 mir-shell 扩展=从能跑到第三方可依赖只有接口冻结才敢押产品；systemd 集成=与平台长在一起）；对自建 Wayland shell 的开发者，用 Mir 意味着接受 Rust 前提，换来更明确长期路线与更稳定扩展面。"
