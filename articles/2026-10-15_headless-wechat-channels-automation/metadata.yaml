summary: "在无头 Chromium 里做微信视频号的扫码登录与自动发布，踩了一串坑后的完整复盘。核心发现：① 二维码永远显示「加载失败」，真因不是跨域也不是无头，而是 --ozone-override-screen-size(800,600) 比 --window-size(1400,1100) 窄，二维码 iframe 落在虚拟屏幕外从不被绘制——对比 screen.width 与 window.innerWidth 一行定位；② 视频号后台是 wujie 微前端，关键数据（objectId 即图文卡片要的 data-id、分享短链）不在 DOM 里，在 Vue 实例的 __vue__.$props.post 上，短链还要手动触发组件异步方法才能取到；③ 二维码绑着轮询会话，三个操作会让用户的码白扫——另开标签页取码（造孤儿，登录永远完不成）、为查状态而导航（每次重载都换新码，实测把用户正在扫的码刷掉三次）、上来就点「点击重试」（把已渲染好的元素重置回加载中）；④ 发布环节：SPA 入口要点击而不能直接导航、首次声明原创会再弹说明框把页面 occluded 导致「发表」按钮消失、observe 的 ref 会因重渲染失效、保存草稿全程静默无提示；⑤ 表单校验读的是框架内部状态而非 DOM value，填值必须逐字符发真实按键。另附三个非浏览器坑：cron 的 PATH 残缺导致静默降级、共享凭据多机各自换 token 会互踢（改用 stable_token）、通知成功与否要看返回值而非日志（因此误判重复补发）。最终沉淀 11 条原则，以及一条最重要的：在别人正依赖某个状态时，不要去动那个状态——排查用户操作失败时，先怀疑自己的排查动作。"
description: "一次无头浏览器自动化扫码登录的深度复盘。问题：在常驻 headless Chromium 里自动登录微信视频号并发布视频，二维码永远显示「加载失败，点击重试」，用户反复扫码无法完成登录。方法：bsk(CDP) 驱动 + shadow DOM 遍历 + Vue 实例读取 + 截图像素统计验证。关键发现：① 真因是 --ozone-override-screen-size=800,600 小于 --window-size=1400,1100，二维码 iframe 位于 x=1054~1262 落在虚拟屏幕外，Chromium 在 ozone headless 下不绘制屏幕外内容；判据 screen.width(800) < window.innerWidth(1400)；改用 1600,1200 后立刻正常。验证手段：截图像素统计，加载失败态深色占比 91~98% 方差<1000，真二维码深色 39~52% 方差 15000+，并用 ASCII 缩略图肉眼确认三个定位角。② 微前端：数据在 __vue__.$props.post，objectId 是不透明 token 无法自造，分享短链需触发 handleShowFeedShareActionPopoverChange 后读 shortLink；headless 无系统剪贴板，平台「复制链接」写入的字符串为空。③ 三张码白扫的原因依次是：另开标签页取码使会话成孤儿、为查登录态而 navigate 导致页面重载换码（时间线验证：20:44 推码 / 20:51 查询，页面 ts 同步变为 20:51:17）、先点重试把已渲染的 iframe 重置。④ 发布坑：/platform/post/list 直接导航会被重定向，须点侧边栏；首次原创声明确认后再弹「原创权益」modal 造成 occluded by L1 使发表按钮从 observe 消失；ref 重渲染即失效须拿到即点并重试；保存草稿无 toast 不跳转。⑤ 表单值须逐字符真实按键，因校验读 Vue 内部状态而非 DOM value。⑥ 运维三坑：cron PATH 残缺致静默降级、cgi-bin/token 多机互踢改 stable_token、通知成功看 errcode 不看日志。"
