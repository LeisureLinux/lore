description: "Philip Zimmermann 在 1991 年写下的《Why I Wrote PGP》收录于 PGP 用户手册，1999 年更新。它至今仍是最有说服力的隐私论证之一，因为它把问题定位在「技术变更由谁发起」而不是「你有没有东西要藏」。本文按它自己的论证顺序重读这篇三十多年前的文本，并指出其中两个我认为最经得起时间检验的判断：一是「信封与明信片」的中间投票论证，二是「法律会变，而技术基础设施会留下来」。"
