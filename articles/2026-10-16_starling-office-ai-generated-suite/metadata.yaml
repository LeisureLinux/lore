description: "Starling 是一个用 Swift 写的 Linux 桌面环境，自带 Wayland 合成器、X11 服务器，以及一个把 Flutter 框架完整移植到 Swift 的 SDK，而它的绝大部分代码是由 Claude Code 生成的。2026 年 10 月 16 日，它发布了 Starling Office v0.1：一个能处理 DOCX/XLSX/PPTX 的文字处理器、电子表格与演示编辑器，同样用 Swift 写、同样由 Claude Code 生成，而且不依赖 Starling 桌面本身，还提供 macOS 与 Windows 二进制。本文把这条新闻和同一周那五个开源项目的 AI 贡献政策放在一起，因为它们指向完全相反的方向，而分歧点不在「AI 能不能用」，而在「谁承担长期维护」。"
