description: "QA Wolf 发表了一篇讲他们如何为 Windows 桌面应用做大规模自动化测试的文章。它的核心洞察是：Windows 桌面测试之所以难，不是因为缺工具，而是因为整个测试基础设施的默认模型是 Linux 容器——而无头容器里没有登录的桌面会话，而微软的 UI Automation 只在活动的登录会话里工作。他们的解法是把 Windows 机器当成手机而不是服务器：一个测试声明一台设备、用一次、就丢掉。本文梳理这个约束链，以及它引出的三个具体设计（一次性 VM、热池、构建时镜像）。"
