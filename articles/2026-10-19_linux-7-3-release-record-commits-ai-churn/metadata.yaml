description: "Linux 7.3 于 2026 年 10 月 18 日发布。LWN 用「这个发布在各方面都破了纪录」来形容它：18,765 个非合并提交、3,021 名开发者，其中 807 人是首次参与内核开发。而 Phoronix 的报道里有一句值得单独拎出来的话：过去一周修 bug 的过程中，「包括持续涌入的 AI/LLM 代码变动」。本文把两篇合成一篇，不只列 7.3 的新特性，而是把「提交量创纪录」这件事和「AI 让补丁变多」这条线索接上，并说明 7.3 那个 8% 的 Assisted-by 比例为什么是一个下限而不是上限。"
