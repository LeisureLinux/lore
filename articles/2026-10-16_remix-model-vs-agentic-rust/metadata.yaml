description: "2026 年 10 月，两位作者从不同方向回答了同一个问题：当 AI 让写代码变便宜之后，开源协作该怎么组织。Geoffrey Huntley 提出 Remix 模型，主张关掉 pull request、只保留讨论，让别人用 Nix overlay 去 remix 而不是提交补丁。Niko Matsakis 则从编程语言设计者的角度论证，Rust 恰好适合 agentic 开发，并提议把「不再有 unsafe」当作北极星。本文把两者放在一起，因为它们对「什么变便宜了、什么变贵了」给出了互补的判断。"
