description: "自由软件基金会于 2026 年 9 月 14 日宣布 GNU Boot 成为其财政赞助项目。这件事值得解读的地方不在于「又有一个项目被赞助了」，而在于两条容易被误读的边界：一是财政赞助解决的是收钱与合规的行政负担，不解决项目本身的成熟度（GNU Boot 至今仍是 0.1 RC6，硬件支持表里绝大多数格子写着「未测试」）；二是 GNU Boot 能替代的并不是「现代计算机普遍使用的专有 BIOS/UEFI」，而是 2006 到 2010 年间的一批特定老机器。本文把这两条说清楚，并解释为什么这个项目仍然重要。"
