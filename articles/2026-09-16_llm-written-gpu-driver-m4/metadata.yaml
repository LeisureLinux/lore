summary: "Cody Ho 与 Niklas 用约一个月（常规需数年）为 M4 Mac Mini 和 MacBook Neo 从零写出完整符合 OpenGL ES 3.0 的 GPU 驱动：Chrome/Firefox 跑通 WebGL，Minecraft 跑到 200fps。全流程净室完成——不看任何 Apple 二进制，只用自建 hypervisor 抓的硬件 trace。内核侧从零逆向 AGX 固件 ABI（跑在 RTKit 上，A18 Pro 比 M1 复杂得多：struct 1.5 倍、指针 2 倍）；用户空间自研反汇编/汇编器与 NIR→AGX ISA 编译器。三个卡点全是「拿不到干净捕获」，最大功臣是「重放 → 逐步减少拷贝页数 → 完全从源码构建」这套流程。附作者对 Codex「pedantic」的评价、Claude 在指令级理解上的失败、以及「Mesa first」胜过「硬件优先」的路线对比。"
description: "译介 Cody Ho 博客（2026-09-15）《I Came, I Prompted, I Left Part 2》：两人 + Codex/Claude 约一个月写出符合 OpenGL ES 3.0 的 M4/A18 Pro GPU 驱动（Minecraft 200fps）。细节包括：Apple 把内核驱动切两半塞进 AGX 固件的 ABI 设计、A18 Pro 比 M1 的 struct 多 1.5 倍/指针多 2 倍、hypervisor 重放法逐步减少拷贝页数、单用户模式 + 最早 LaunchDaemon 捕获极小 compute trace 解决 336MB 无法重放的死局、partial render 等价于给驱动加 save/resume、Rust drm-shim → 异步前端 → fence 事件驱动三天的内核落地、硬件支持但 Metal 未暴露的 4 项特性（64 位加法/128x 各向异性/矩阵新模式/uniform_mov 7 位立即数）、以及上游化面对的人类瓶颈。"
