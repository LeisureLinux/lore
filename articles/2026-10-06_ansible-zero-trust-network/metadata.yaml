description: "红帽用 5 个步骤描述如何用 Ansible 落地零信任网络：从资产清点、单一事实源，到策略即代码、漂移检测与机器速度遏止。本文梳理这 5 步的技术细节（Ansible 作为执行点而非策略引擎、OPA 门控自动化自身、Event-Driven Ansible 的 observe/evaluate/respond），对照 NIST SP 800-207 的七条原则，并指出这篇厂商文稿没有回答的三个问题。"
