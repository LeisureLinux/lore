original_source: "OpenAI 官方公告（2026-11-23）＋ 一手核对 Isovalent/Cisco 技术博客、shirudo-dev/shirudo GitHub README、docs.shirudo.dev Quickstart＋ 本号 Java4Shell 文章交叉核对。"
description: "解读 OpenAI 与 Cisco 开源的 Shirudo（日语「盾」）：eBPF 运行时安全平台，用 AI 生成临时 shield/upatch 在补丁窗口期保护运行中的 Linux 系统而不重启。梳理四项核心能力、架构（Tetragon 血统、一次性 CLI、签名 .bee/OCI 分发、TPM 测量、signed-loader ABI）、Codex 生成 Java 字节码盾牌拦截 Java4Shell 对 Elasticsearch 的实测日志、许可证与预发布状态，并辨析它与 live patch/WAF 的区别和边界。"
published: true
