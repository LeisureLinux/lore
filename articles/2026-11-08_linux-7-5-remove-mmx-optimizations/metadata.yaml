title: "Linux 内核 7.5 删掉最后一批 MMX 优化：800 行换成 12 行"
date: 2026-11-08
slug: linux-7-5-remove-mmx-optimizations
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Eric Biggers 提交到 linux-raid 邮件列表的补丁系列《[PATCH 0/3] raid: remove obsolete MMX optimized code》（2026-10-25，含三个补丁的完整 commit message 与 diffstat）＋ Tom's Hardware 报道（Mark Tyson，2026-11-08）＋ Phoronix 报道（Michael Larabel，2026-11-03）"
original_date: 2026-10-25
original_url: "https://lists.openwall.net/linux-kernel/2026/10/25/771"
description: "本文解读 Eric Biggers 提交的三补丁系列：Linux 内核 7.5 将删除最后一批 MMX 优化代码，把软件 RAID 的 XOR 与 RAID6 实现里的 837 行删除、替换为 12 行。这不是一次「顺便清理」，而是一次有明确边界的收尾——作者在 cover letter 里给出了三条判定依据：MMX 优化路径只在「25 年前的、不支持 SSE 的 32 位 CPU」上、且「只在真的有 RAID 阵列的机器上」才被用到；而这些 CPU 已经有经过充分测试的标量 C 回退实现。整个系列的核心信息只有一句：这是内核里最后的 MMX 优化代码。为什么「最后」这件事本身值得写：MMX 的指令集优化早就从 memcpy()、copy_page()、clear_page() 这些高频路径上撤掉了（commit c6dbd3e5e69c），加密和 CRC 方向则从来就没有 MMX 优化——所以 RAID 代码成了唯一的孤例。这个系列还顺手清理了一个更隐蔽的问题：RAID6 代码里的 CPU 特性检查存在冗余，作者在第三个补丁里把「检查其他特性的前置条件」这类冗余检查去掉，并把分散在多处的特性注册调用合并到恰当位置（补丁 3 单独就删了 40 行、加了 11 行）。作者还在注释里写明了一个容易被误读的技术细节：内核的 cpuid-deps.c 对缺失前置条件是警告而不是强制，这是有意为之，并不意味着这些前置条件应该挪到别处去检查。三个补丁的分工是：1/3 删 XOR 的 MMX 优化（3 文件 521 行删除，最大文件 xor-mmx.c 有 515 行，版权头写着 Copyright (C) 1998 Ingo Molnar）；2/3 删 RAID6 的 MMX 优化（4 文件 276 行删除，含那个名字本身有误导性的 sse1.c——作者指出它实际是一个加了 SSE1 预取和非时域存储的 MMX 实现）；3/3 简化 CPU 特性检查（1 文件净减 29 行）。x86_64 的 AVX/SSE/AVX512 路径、RISC-V、SPARC、S390 全部不动。"
published: true
