title: "Linux 7.4 将默认开启 AMDGPU HDMI 2.1：FreeSync、VRR、ALLM 全数就位"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "AMDGPU", "HDMI 2.1", "内核", "显卡驱动", "译文"]
source: "https://www.phoronix.com/news/Linux-7.4-AMDGPU-HDMI-2.1-Go"
author: "LeisureLinux"
summary: "Linux 7.4 的 AMDGPU 特性拉取已提交 DRM-Next，HDMI 2.1 的 FreeSync、VRR、ALLM 全部落地，且 FRL 从默认关闭改为默认开启。这是一场与 HDMI Forum 多年规范拉锯的阶段性胜利，Valve 的 Steam Machine 与广大 AMD 平台 Linux 桌面是直接受益者。"
