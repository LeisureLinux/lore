description: "2026 年 7 到 10 月，四个主流开源项目对「AI 能不能参与贡献」给出了方向完全不同的答案：GCC 直接拒绝法律上重要的 LLM 派生贡献（门槛约 15 行）、Linux 内核把已经实行了十个月的 Assisted-by 标签要求取消、Debian 用一场决议表决出「既不背书也不禁止」、Flathub 在五月全面禁止后十月反转为「必须声明但由审查者裁量」。本文把四份政策放在一起对照，指出真正的分歧点不在「允不允许」，而在「声明这件事有没有用、成本由谁承担」。"
