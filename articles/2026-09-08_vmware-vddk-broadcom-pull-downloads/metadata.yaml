summary: "2026 年 9 月 7 日，Broadcom 悄然停掉了 VMware VDDK（Virtual Disk Development Kit）的公开下载，原链接全部 404，且无任何官方公告、弃用声明或替代方案。VDDK 看似小众，却是 Azure Migrate、Red Hat MTV、Nutanix Move、virt-v2v、nbdkit 等几乎所有第三方迁移工具的核心依赖。本文梳理 ShapeBlue、Red Hat、Microsoft、Nutanix、Platform9 的连锁反应，点评这一举动背后的供应商锁定（vendor lock-in）信号，并给出分场景的 Plan B 与企业选型建议。"
description: "基于 Virtualization Howto 2026-09-07 文章《Leaving VMware Just Got Harder After Broadcom Pulled VDDK Downloads》的翻译与解读。覆盖 VDDK 的核心地位、Broadcom 下架的时间线（ShapeBlue 8/25 → Red Hat 8/27 → Microsoft 文档更新 → Platform9 9/1）、vSphere Standard 版回归与 VDDK 下架的锁定策略对照，以及 Azure Migrate agent-based、Red Hat storage copy offload、Nutanix TAP、Platform9 proxy VM、Proxmox import utility 等六条 Plan B 路径。"
published: true
original_source: "Virtualization Howto — Leaving VMware Just Got Harder After Broadcom Pulled VDDK Downloads (Brandon Lee, 2026-09-07)"
