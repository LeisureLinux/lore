description: "Linux 7.4 合并窗口以 19,671 个提交成为内核史上最大的合并窗口，比 7.3 的 16,267 个高出 21%，源码树逼近 4,200 万行（31,417,938 行代码，cloc 统计），而「一个合并窗口的提交量已等于上一个完整周期」这个对比最说明问题。但真正暴涨的不是功能，而是 AI 批量产出的低价值修复 —— 网络子系统维护者 Jakub Kicinski 的一手数据是 9 天内 405 + 687 个补丁、37% 是修复类，且「这大概还是低估，因为 LLM 研究者更常在不知道该打标签的情况下就发修复」，他本人则用「completely overwhelmed」形容状态，并透露已经用多个前沿模型并行做评审、但仍被淹没。而同一周，Chris Mason 用 AI 评审在 OverlayFS 里挖出真实安全漏洞（信息泄漏、UAF、NULL 解引用，多个可被非特权用户触发，另有 RCU walk stall 与 nfs_export 数据丢失），十几个补丁已合入 7.4 并标记回移 stable。本文还完整还原了 Sashiko 的实测（1000 个未过滤上游 issue 中找到 53%，而这些人类评审 100% 漏检）、Andrew Morton 与 Lorenzo Stoakes 关于「是否强制回应 AI 评审」的争论，以及 2025 维护者峰会达成的四条共识（人类担责、不欢迎纯机器补丁、维护者保留裁量权、工具使用需披露）与 Linus 对「AI 审代码」的正面评价。核心判断是：内核里的 AI 同时在做相反的两件事 —— 一端大批量生产垃圾淹没维护者，另一端在人类评审漏掉的地方找出真 bug；而真正的难题不是技术，是「一个每秒能产出一堆意见的第三方机器人，凭什么进流程的必经之路」。"
