description: "NIST 椭圆曲线的种子从 1999 年起被怀疑是 NSA 埋的后门，因为没人知道它们怎么来的。2026 年 10 月，Claude 在半小时内找出答案：那些种子不是任何哈希算法的输出，而是 1990 年代 C 库随机数生成器 lrand48 的输出，用 Unix 时间戳做种子。本文解释这个发现为什么反而让人更放心，以及它顺手解开的第二个谜（基准点来自 FreeLIP），和三个仍未解开的缺口。"
