original_source: "一手核对：Darling 官方博客《Development Update - Q4 2026》（Luboš Doležel，2026-11-08）＋ 仓库根目录 AGENTS.md 全文（11 节 clean-room 规则）＋ Phoronix 报道（Michael Larabel，2026-11-09）＋ TIOBE 官方 2026-11 榜单与 TechRepublic 报道（备用对照）"
original_date: 2026-11-08
