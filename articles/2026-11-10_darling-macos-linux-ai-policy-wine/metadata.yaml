description: "本文解读 Darling（在 Linux 上跑 macOS 二进制的兼容层，2012 年创立）2026 年 Q4 的重大转向：正式接受 AI 辅助贡献。但真正值得写的不是「又一个项目用 AI 写代码」，而是官方博客里一段罕见坦诚的自我剖析——为什么 Darling 从来没有 WINE 享有的那些优势：macOS 应用面比 Windows 小得多，愿意在 Linux 上跑它们的人少，懂 macOS 内部的人更少，因此既招不到贡献者也拿不到 Valve 给 WINE 那种商业赞助；Apple 还在不停加只随 macOS 发布的框架（按一份统计，macOS 27 有 464 个公开框架和 2754 个私有框架，而 macOS 10.14 是 273 和 878），WINE 可以靠微软可再发行运行时（winetricks 帮用户下载），Apple 的框架大多没有任何可下载物、只能自己实现。作者由此得出「以少数志愿者匹配 Apple 的工程产能，看起来是个无解问题」，而今年出现的 AI 重度 fork 改变了等式：一个 fork 跑起了 macOS 版《英雄联盟》，VibeDarling 让若干原版 macOS 应用可运行；项目还上线了初始 ARM64 支持。本文也逐节核对了 AGENTS.md 的 clean-room 规则（实现公开文档的契约而非单应用 hack、遵守 macOS 分层、QUIRK 标签与证据分级、禁用反汇编与 corecrypto、PR 人对每一行负责、维护者提问由人回答而非 bot），并如实说明 fork 合流仍在进行、ARM64 macOS 应用在 x86-64 主机上跑仍是 long shot。落点：AI 在这里改变的是经济学，不是兼容性难题本身。"
published: true
