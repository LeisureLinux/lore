summary: "Debian 机器把本地 mp3 推到 HomePod 的完整排障实录。起点是 atvremote（pyatv）每首歌重建 AirPlay 会话、体验差；换 mpv + PipeWire raop-sink 后撞上「播放 35 秒突然没声但进度还在走」的隐蔽故障。原理剖析：AirPlay（RAOP）分 RTSP/TCP 控制通道与 RTP/UDP 音频通道两条独立通道，控制通道被 HomePod 断掉后音频通道假活，导致 sink 显示 RUNNING 却无声。日志中 error -32（EPIPE）是根因、error -9（EBADF）只是往失效 socket 写数据的后续症状。根因定位为 PipeWire 1.4.2 raop-sink 加密协商不兼容——默认 raop.encryption.type=none，而 HomePod 要求 SAP25（FairPlay）加密；社区抓包确认是 HomePod 主动终止控制通道并发送 mDNS cache-flush。绕行方案 raop_play 稳定 150s 但无图形界面。最终解：走 trixie-backports 把 PipeWire 从 1.4.2 升级到 1.4.9（backports 依赖干净不拉高 glibc、可回滚），1.4.9 的 raop-sink 自动选择 fp_sap25 加密，断流彻底消失。附彩蛋：mpv --force-window 显示内嵌封面 + --sub-auto=fuzzy 加载同名 .lrc 歌词。"
description: "Debian 机器本地 mp3 推流到 HomePod 的完整排障与原理复盘。核心故障：mpv + PipeWire raop-sink 播放约 35 秒后音频静默但 sink 仍 RUNNING。原理：AirPlay（RAOP）的 RTSP/TCP 控制通道与 RTP/UDP 音频通道独立，控制通道被断后音频通道假活。日志 error -32（EPIPE，连接被对端断开）是根因，error -9（EBADF）是往失效 socket 写数据的后续症状。根因是 PipeWire 1.4.2 raop-sink 默认 raop.encryption.type=none 与 HomePod 要求的 SAP25 加密不匹配，社区抓包证实 HomePod 主动终止控制通道并发 mDNS cache-flush。绕行方案 raop_play（AirPlay 1）稳定 150s 但无图形界面。最终解：trixie-backports 升级 PipeWire 1.4.2→1.4.9，新版 raop-sink 自动选 fp_sap25，断流消失。附 mpv 弹窗显示封面 + .lrc 歌词的方法，以及 backports vs sid 的选择依据（依赖干净、可回滚）。"
