description: "OpenSSH 10.6 发布，同时宣布一件更重要的事：由于收到大量 AI 辅助发现的安全报告，他们将放弃「攒到下一个计划版本」的做法，改为更频繁地发布。本文解析这条政策变化的完整论证、10.6 的后量子签名与侧信道缓解等具体改动，以及发布说明里一处值得注意的署名。"
