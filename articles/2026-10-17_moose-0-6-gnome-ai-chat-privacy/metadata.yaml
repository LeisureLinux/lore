description: "Moose 是一个围绕 GTK4 与 libadwaita 构建的 GNOME 风格 AI 聊天应用，最初只做本地模型，后来扩展到云服务。0.6 版本加了云连接的安全凭据存储、一个「仅本地」模式、按对话或按提供商的权限记忆、GNOME Files 浏览器与附件、以及扩展的本地模型目录；0.6.1 又加了 Mistral 与 DeepSeek。本文不只列功能，而是把 README 里那些常被一句带过的设计决定讲清：为什么「仅本地模式」和「远程聊天先问权限」是两个不同的开关，以及为什么它把 API 密钥交给桌面 keyring 而不是自己管。"
