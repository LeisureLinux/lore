description: "高通 MSM DRM 内核驱动正在加入针对 DisplayPort 输出和 eDP 面板的静态 HDR 支持，主要面向跑 Linux 的 Snapdragon X 笔记本。目前聚焦 HDR10 与 BT.2020 RGB 信号，不包含动态 HDR 和色调映射；补丁已在搭载 Snapdragon X1 Elite 的联想 Yoga Slim 7x 上测试通过，并注明是在 LLM 辅助下完成的。本文梳理静态 HDR 与动态 HDR 的差别、这个补丁意味着什么，以及 ARM 笔记本在 Linux 上补齐显示特性的路径。"
