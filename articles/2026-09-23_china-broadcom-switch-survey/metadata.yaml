summary: "编译 Reuters 转引 FT 报道（2026-09-23，原文付费墙）：中国有关部门排查国有背景数据中心对博通硬件的使用，作为扶持国产、降低对外国 AI 基础设施依赖的一部分。调查由国资委(SASAC)牵头；FT 称部分站点博通交换机占比高达 90%；后续或发非正式指导推动「国产芯片自用」减少博通占比；Reuters 称无法立即核实、博通与 SASAC 未即时置评。解读：①核心是软引导而非禁令，但国有采购方常把暗示当审批标准，博通 design-in 卡在新项目与续约节点；②命门是集中度(单外国供应商占90%)，网络层暴露比芯片更被忽视；③AI 基建瓶颈已从算力外溢到网络，排查与国产GPU替代英伟达同打法(整栈可控)；④受益方华为/新华三/锐捷，代价是监控运维互操作重建与高端口密度/低时延生态验证；跨国方案商应把供应链国籍纳入架构选型。"
description: "编译 Reuters 同题报道(2026-09-23)转引 Financial Times，原文为付费墙。事实：中国有关部门排查国有背景数据中心对博通(Broadcom)硬件使用，属扶持国产供应商、降对外国 AI 基础设施依赖行动；调查由国资委(SASAC)牵头；FT 称部分站点博通交换机占比高达 90%；背景是中美博弈下技术自给与供应链韧性优先级提升并扶持专精特新(little giants)；SASAC 后续或发非正式指导敦促国有设施在「国产芯片自用(domestic chips for domestic use)」下减少博通；Reuters 无法立即核实 FT 报道，博通与 SASAC 非工作时间未即时置评(Finimize/MarketScreener 转引亦载)。解读：①非禁令而是 survey+informal guidance，但国有采购方常把暗示当审批标准，博通 design-in 卡在新项目与续约，数据中心网络设备黏性极强(监控/培训/互操作围绕已认证厂商搭建)；②命门是集中度——单外国供应商占90%暴露网络层对外单点依赖，政策焦点在芯片(华为/昇腾/寒武融)时交换机被忽略，博通在交换芯片(Tomahawk/Jericho)与 VMware 生态统治力使其成为去风险靶子；③AI 基建瓶颈从单卡算力外溢到网络(all-reduce 通信、南北向流量)，排查与国产GPU替代英伟达同打法，AI 自给要整栈(算力+网络+机柜)可控；④受益华为/新华三/锐捷，代价是监控运维互操作重建、高端口密度/超低时延/网管生态验证，影响主要在 refresh 与 expansion 周期；跨国/对华业务数据中心方案商应把供应链国籍纳入架构与选型评估。"
