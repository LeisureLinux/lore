description: "Nothing 从 2026 年 10 月 12 日起推送 Nothing OS 5.0（基于 Android 17），首批是 Phone (3)，另有 9 款 Nothing 与 CMF 机型排期到 2027 年 1 月。但这条新闻里最实用的一条信息不是推送表，而是「大版本升级」和「安全补丁」是两条独立的时间线：被排除在 Android 17 之外的 Phone (1)、Phone (2)、CMF Phone 1 并不因此停止接收安全补丁。本文整理推送排期、机型清单、值得注意的新功能，以及企业和个人在升级前该做的检查。"
