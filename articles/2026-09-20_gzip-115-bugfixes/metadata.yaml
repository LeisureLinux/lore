summary: "译介 Phoronix 报道（Michael Larabel，2026-09-20）：Gzip 1.15 接替 1.14（2025-04），含 100+ commit，重心是攒了一年半的 bug 修复，多个 bug 自诞生起存在。修复清单（引 GNU 通告）：另一进程同时重命名 gzip 目标祖先目录时会误删错文件（TOCTOU）、gzip -d 不再拒 PKZIP 签名/本地头/数据描述符、诊断给特殊字符文件名加引号、畸形输入用未初始化内存、解压 .lzh（在 .Z 后）时缓冲区溢出、.lzh 比特缓冲未清/译码表被上一文件污染致输出损坏、--synchronous 在 O_PATH/O_SEARCH 平台无法同步父目录（1.7 引入）、缺 mktemp 平台 gzexe/zdiff/znew 临时文件竞态。另：遵循环境变量 locale（不再默认 C）、终止对 FreeBSD 4.11/HP-UX 11.00/Minix 3.1.8/非 UCRT MinGW 的 Windows 8.1 支持。解读聚焦内存安全与数据损坏类问题、TOCTOU 对自动清理脚本的运维风险、祖传冷路径少人审计、低回归成本的「无脑更」建议。"
description: "译介 Phoronix《Gzip 1.15 Released With Many Bug Fixes For Issues Present Since Its Inception》(Michael Larabel, 2026-09-20) 并加工程解读。事实：Gzip 1.15 接替 1.14(April 2025)，100+ 新 commit，主要攒过去一年半 bug 修复，多个 bug 自诞生起存在。修复（引 GNU info-gnu 通告）：①另一进程同时重命名 gzip 目标祖先目录时误删错文件[TOCTOU, since beginning]；②gzip -d 不再拒 PKZIP 签名/本地文件头/数据描述符(可出现在格式良好的流式 zip)[since beginning]；③诊断给含特殊字符文件名加引号[since beginning]；④畸形输入用未初始化内存[sinc beginning]；⑤解压 .lzh(在解压 .Z 后)缓冲区溢出[since beginning]；⑥解压 .lzh 时内部比特缓冲未清致输出损坏[since beginning]；⑦连解两个 .lzh 时输出被上一文件译码表污染[since beginning]；⑧--synchronous 在 GNU/Linux(O_PATH)/FreeBSD(O_SEARCH 无 O_PATH)无法同步不可读父目录[1.7 引入]；⑨缺 mktemp 的老式平台 gzexe/zdiff/znew 建临时文件竞态[since beginning]。另：不再默认 C locale 而遵循环境变量 locale；终止支持 FreeBSD 4.11/HP-UX 11.00/Minix 3.1.8/非 UCRT MinGW 的 Win8.1。解读：①内存安全(缓冲区溢出/未初始化内存)+数据损坏(静默)类问题，不可信输入解压场景可被构造输入触发；TOCTOU 误删错文件对自动清理/临时文件脚本是运维风险，与 Linux 静默数据丢失同类；②祖传冷路径(.lzh/.Z)少人审计，日调用数十亿次的基础工具反而无审计；③纯修复无破坏性新特性、收紧古董平台支持，升级回归风险极低，属无脑更，尤在多租户/不可信压缩输入边界。"
