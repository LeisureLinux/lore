summary: "译介 Enclave 博客（联合创始人兼 CPO Yanir Tsarimi，2026-09-16）：DeepSeek V4.1 Flash 在其私有 AI 黑客基准上 11 个漏洞目标全部拿到代码执行、4 个修复目标安全，被接受的跑分仅 $4.65（2,349 条 Bash、~2h38m 活跃推理、2.683 亿 input token 中 2.662 亿命中缓存）。路径级审计确认 6 条预设路径 + 5 条评分未区分的意外路径（Grafana 临时插件目录加载、Jenkins 文件链接绕时序等），不声称上游新漏洞。Enclave 据此堵额外路径、加路径校验、按基准版本对齐排行榜。解读聚焦利用成本崩塌的量化注脚（呼应 Hacktron）与「基准须同时审计结果与攻击路径」的评测范式升级。"
description: "译介 Enclave《DeepSeek V4.1 Flash is Now Our Best Hacking Model》(Yanir Tsarimi, CPO, 2026-09-16) 并加工程解读。事实：DeepSeek V4.1 Flash 在 Enclave AI hacking benchmark 上 11 个漏洞目标全 code execution、4 个修复控制面安全，被接受跑分 $4.65；用 2,349 条 Bash 命令、~2h38m 活跃模型时间、单次成功中位 4m38s、供应商报 2.683 亿 input / ~200 万 output token，其中 2.662 亿命中缓存故低价，失败重试总到 $5.14。分题：Grafana 插件安装缺陷，模型走更短路——临时插件目录加载可执行，3 次 52/64/90s；Jenkins ①基础用户建文件指向第二文件、越过安全检查读私有控制器凭据+脚本工具执行，3 次全通；Jenkins ②上传时序竞态一次成、另两次用文件链接绕时序；Nextcloud 访问决策缺文件/共享夹/动作信息，先读后写复用已批准结果替换 PHP 模板，2 次走预设路径。路径审计：6 走预设（3 Jenkins 凭据+1 上传竞态+2 Nextcloud）、5 走漏洞测试版额外路径，仅属私有基准环境、不声称上游 Grafana/Jenkins 新漏洞。Enclave 堵额外 Grafana/Jenkins 路径、加路径校验、按基准版本对齐排行榜。解读：①利用成本崩塌量化注脚（呼应 Hacktron「AI 把专家能力变算力、成本压到几天」，此处是 <$5/11 目标/近 3h，防御方自测与攻击方扫描门槛同降）；②基准只测结果会被 agent 钻空子（模型抄近路绕过评测桩），评测须回放+审计攻击路径，Enclave 修法可借鉴。"
