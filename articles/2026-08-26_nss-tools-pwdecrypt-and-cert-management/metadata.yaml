summary: '一次真实需求：找回存在 Thunderbird 凭据库里的 SMTP 密码（不重置），用 NSS 官方工具 pwdecrypt 一行命令解出。本文由此展开：先讲透 Mozilla 的凭据存储结构（logins.json + key4.db 三层加密链路）与主密码机制；再系统梳理 libnss3-tools 全家桶——certutil 从建库、自建根 CA、生成 CSR、CA 签发到信任位的完整实操（含给内网服务签发受信证书的闭环案例）；pk12util 私钥搬运与 openssl 互转；selfserv/tstclnt/ssltap 三个 TLS 调试神器；crlutil 吊销列表管理；最后给出全部工具速览表与"设主密码"的安全建议。'
description: 'libnss3-tools 全套工具的中文实操手册。第一部分还原真实场景：Thunderbird 忘记 SMTP 密码且不想重置，通过拷贝 profile 四个文件并用 pwdecrypt 解密 logins.json 加密字段找回了凭据——顺带讲清 Mozilla 凭据存储的三层加密链路：主密码→PBKDF2/scrypt 派生 KEK→解开 key4.db 对称密钥→解密条目，以及不设主密码等于密码裸奔的风险。第二部分是 certutil 深度实操：sql: 数据库概念、-L 列表与 SSL/S-MIME/JAR 三位信任位字母含义（p/P/c/C/T/u/w）、-N 建库、-S 自签根 CA、-R 生成含 SAN 的 CSR、-C 签发、导入导出/改信任/删除，并给出给内网服务签发受信 HTTPS 证书并部署 nginx 的六步闭环。第三部分 pk12util：.p12 导入导出参数速查、EAP-TLS 迁移、与 openssl pkcs12 双向互转。第四部分 TLS 调试三件套 selfserv/tstclnt/ssltap 的用法与场景。第五部分 crlutil 四板斧。附其余 20+ 工具速览表（vfychain/modutil/shlibsign/signtool/p7 家族等）。'
