summary: "Debian LTS 团队 2026-08-31 正式宣布 Debian 11 'bullseye' 进入 EOL —— 9 月起 Debian 不再为其提供任何安全更新。本文系统梳理 bullseye 五年生命周期（3 年 full support + 2 年 LTS）、bookworm LTS 接班窗口（到 2028-06-30，覆盖 amd64/i386/arm64/armhf/ppc64el）、官方推荐的两段升级路径、升级前硬性检查清单，以及面对不能立即升级的业务系统的三种退路（Extended LTS / 网络隔离 / 容器化迁移）。"
