summary: "编译 F-Droid 官方博客（2026-09-24）：F-Droid 2.0 上线，是十年来最大一次应用更新，历经 14 个测试版，将在未来数周推送。核心：导航简化为 Discover/Search/My Apps 三块；分类大幅细分（VPN/防火墙/密码管理器/启动器/导航等，Games 细分为 17 种类型），引入 meta 分类；搜索可搜描述/分类/翻译内容，重点改进中日韩（CJK）用户；多维度过滤 + onboarding 引导；安装体验借欧盟 DMA 压力与全球反垄断，Android 对所有商店开放预批准 API，F-Droid 用统一安装器让用户在决定安装后立即确认，逼近系统商店。改动与移除：默认自动拉取安装更新（下拉手势专用于滚动，『最好的刷新按钮是你永远不必按的那个』，手动触发移到 My Apps 三点菜单）；数据用量设置重做；Tor 设置简化（移除自动探测，推荐 Tor VPN，启用过「Use Tor」迁移到通用代理）；panic 特性保留；应用隐藏简化为『只改图标和名称』以让用户理解伪装边界（仍会出现在应用设置、取证可检出）；应用擦除（响应 Ripple 等 panic 触发）暂未回归，因维护成本高、用户基数小，依赖者可暂缓升级；F-Droid Privileged Extension（FPE）不被 2.0 支持，改聚焦 Android session 安装器实现无 FPE 后台更新。幕后：Kotlin + Jetpack Compose 重写，降低贡献门槛，为下一个十年打基础；因依赖 Android 7 修复而放弃 Android 6（老版本仍支持旧 Android）。资金：NLnet/Mobifree 资助 Torsten Grote 开发，OTF UX & Discovery Lab + Ura Design 支持用户研究与设计，OTF FOSS Sustainability Fund/NGI/Mobifree/Calyx Institute 支持；OTF Security Lab 联合 Convocation 做独立安全审计。Nearby 基于改进连接方式重做，尚未就绪。解读：①安装体验改善来源是反垄断/DMA 而非善意（无监管则第三方商店天生二等公民）；②Kotlin+Compose 是降低维护成本的战略下注（为下一个十年，代价是弃 Android 6）；③隐私功能取舍暴露低基数高成本困境（擦除被移出但坦诚交代+给出降级选项）；④背景是 Google 收紧侧载的威胁 vs DMA 强制的机会，F-Droid 踩在窗口上。"
description: "编译 F-Droid 官方博客（2026-09-24）《F-Droid 2.0: A New Chapter for Android Freedom》。F-Droid 2.0 上线，官方 F-Droid 应用彻底重设计，十年来最大应用更新，历经 14 个测试版后将逐步推送。①导航简化：Discover/Search/My Apps 三块，分类整合进 Discover，设置与 Nearby Swap 在顶栏一键可达。②可发现性：生态增至数千应用；重新设计 Discover（高亮新增/近期更新 + 更多探索方式）；分类大幅扩展与细化（VPN/防火墙/密码管理器/启动器/导航工具等专业化分类，引入 meta 分类，Games 彻底重做区分 17 种游戏类型）；搜索可搜应用名/描述/分类/翻译内容，重大改进中文日文韩文（CJK），记住最近查询；多维度组合过滤（分类/设备兼容性/anti-features，例如只看兼容设备的动作游戏并排除依赖非自由网络服务的应用），用 onboarding 情境引导代替藏设置。③安装体验：Android 借欧盟《数字市场法》DMA 压力与全球反垄断，对所有应用商店开放更顺滑自动的安装更新；F-Droid 2.0 用统一安装器（无论内置进系统还是用户自装）并利用新预批准 API，让用户在决定安装后立即确认而非下载完再确认，逼近系统商店。④改动与移除：默认自动拉取安装更新（尊重已有偏好），下拉刷新专用于滚动（应用可后台自动检查更新，『最好的刷新按钮是你永远不必按的那个』），手动触发移到 My Apps 三点溢出菜单；数据用量设置重做；Tor 支持简化、移除不再可靠的自动探测，启用过 Use Tor 者迁移到通用代理设置，推荐 Tor VPN；panic 特性保留；应用隐藏简化到只改图标和名称（因掩蔽功能已成标准设计），以便用户理解伪装边界——F-Droid 仍会出现在应用设置、取证检查可检出；响应 Ripple 等 panic 触发移除并擦除应用的功能暂未回归（官方称需高度专业化维护、用户基数小，不该再阻塞其他改进，依赖者可暂缓升级并提供反馈）；F-Droid Privileged Extension（FPE）不被 2.0 支持，本次聚焦完整支持 Android session 安装器，使其无需 FPE 即可在任何较新 Android 做后台更新；集成 F-Droid 的 OS（CalyxOS/emteriaOS/iodéOS/Lineage-for-microG/ShiftOS）用 additional repos 机制。⑤幕后：全部新代码用现代 Android 标准，Kotlin 重写、UI 用 Jetpack Compose 贴近 Material Design，降低贡献门槛、为下一个十年打基础；因新工具依赖 Android 7 修复而放弃 Android 6 支持（老版本 F-Droid 仍支持旧 Android）。⑥社区/资金：Torsten Grote 开发由 NLnet 经 Mobifree 基金资助；OTF User Experience & Discovery Lab 支持用户研究设计，引入 Ura Design；OTF FOSS Sustainability Fund、NGI、Mobifree、Calyx Institute 额外支持；OTF Security Lab 联合 Convocation 做独立安全审查（发现已处理，报告待公布）；大量志愿者贡献。⑦Nearby：不依赖中心服务器的设备间应用分享，正基于改进连接方式从底层重做，尚未就绪、不在初始版本。⑧未来数月继续改进性能/可访问性/应用发现/可用性。解读：①安装体验改善源于反垄断/DMA 压力而非善意（无监管则第三方商店天生二等公民）；②Kotlin+Compose 是降低维护成本的战略下注，代价是弃 Android 6 但老版本仍可用；③隐私功能取舍暴露开源项目低基数高成本困境，团队坦诚划边界并给降级选项；④背景是 Google 收紧侧载的威胁与 DMA 强制的机会并存，F-Droid 2.0 踩在窗口上。"
