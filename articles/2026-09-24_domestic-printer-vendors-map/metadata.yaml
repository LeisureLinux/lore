summary: "原创产业梳理（公开资料）：国产打印机整机厂至少 25 家——信创激光文印主赛道 16 家（奔图/得力/汉光联创/立思辰/光电通/长城信息/汉图极印/紫光汉图/南天/沧田/中矗/爱胜品/恒科恒安捷/渺宏/高德品创/宁波华高），其他品类 9 家（映美/中盈/新北洋/汉印/小篆/影源/中航/联想/华为）。主控芯片走出三条国产路线：龙芯（LoongArch，2P0500/2P0300，外供 12 家签约厂）、极海微（RISC-V 玄铁，仅供奔图自用）、众诺北辰 BCV200（RISC-V，2026 新入局），另有沧田自研「田芯」。关键结论：①主控三足、RISC-V 成第二条主线；②龙芯 2P0500/2P0300 官方定位 A4，A3 能力集中在非龙芯或主控未公开厂商，A3+彩色实证仅奔图/汉光/立思辰/中矗四家；③整机厂芯片签名为复数，同一厂可能同时挂龙芯与众诺两条线，评估自主可控要看具体机型芯片型号+测评等级。金融信创：中信银行近 4000 台龙芯 2P0500（南天），工行中标得力（无细节）。"
description: "基于公开资料的国产打印机产业梳理（原创，非译文，全文标注已确认/推断/未公开三级可信度）。整机厂：信创激光文印 16 家——珠海奔图(极海自研主控,A4→A3,黑白+彩色)、得力集团(宁波宁海,龙芯2P0300/2P0500,睿印/墨辰)、中船汉光(邯郸,汉光联创HG,A3,黑白+彩色)、北京辰光融信(立思辰LANXUM,A4+A3,黑白+彩色)、天津光电通(光电通TOEC,A4为主,黑白+彩色)、长城信息(长沙,GWI,A4+复印机线)、上海汉图(极印Jiyin/Liene,龙芯2P0500,A4)、紫光汉图(北京,UNI,龙芯,A4黑白)、云南南天(昆明,NANTIAN,龙芯2P0500,A4)、浙江沧田(嘉兴嘉善,Cumtenn/SEALAND,自研田芯+龙芯签约)、中矗集团(北京,zcjt.biz,A4+A3,黑白+彩色)、上海开顿(爱胜品ICSP,A4+A3复合,黑白)、恒科(威海,恒安捷,A4+A3,自研固件)、成都兴渺宏(渺宏,A4)、北京高德品创(A4/A5,代工联想)、宁波华高(未公开)；其他品类 9 家——映美Jolimark(江门,针式/喷墨/票据)、中盈Zonewin(大连,针式)、新北洋SNBC(威海,热敏/标签,打印头自研)、汉印HPRT(厦门,热敏/激光/3D)、小篆(广州,便携喷墨)、影源WinMage(扫描仪)、中航信息(存折/票据/证卡)、联想图像(含鸿蒙机型)、华为CV81Z-LDM。主控三条路线：龙芯中科2P0500(2023-11-28发布,LoongArch,异构大小核LA364+LA132,主核750MHz/小核400MHz,512KB L2,DDR3-800,USB2.0×3+GMAC×2,<1.8W,官方支持A4幅面)/2P0300(2025新发,LA264+LA132,256KB L2,DDR3/4,1.2GHz,小型激光机)外供12家签约厂(长城信息/中船汉光/上海汉图/恒科/宁波华高/云南南天/北京辰光融信/北京高德品创/天津光电通信/浙江沧田/大连中盈)；极海微HSP2210/HSP2220(平头哥玄铁RISC-V,仅奔图自用)；广州众诺微电子北辰BCV200(2026-03-14发布,RISC-V,大小核异构,800MHz,独立安全子系统,SCANIF/PRINTIF/ISP硬件加速,签约汉印/中船汉光/立思辰/沧田/光电通/汉图/恒科/中矗/紫光/中盈/爱胜品/影源/渺宏/小篆)；沧田自研田芯(2021)。A3+彩色四家：奔图/汉光联创/立思辰/中矗。安全可靠测评V3.0(2025-07-01)将打印机主控芯片列为五品类之一，龙芯2P0500/2P0300为II级(最高)，极海KP3701/SN2701为I级。金融信创：中信银行近4000台龙芯2P0500(南天)，工行中标得力(无细节)。"
