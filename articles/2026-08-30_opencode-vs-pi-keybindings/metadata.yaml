summary: '在终端里写代码的人都会遇到一个老问题：快捷键不够用。同一个 Ctrl 组合既要用来编辑文本、又要用来操作工具——抢键几乎是必然。OpenCode 和 Pi-Coding-Agent 给出了两种截然不同的解法：前者借用了 GNU Screen / tmux 的 leader 键思路，把 Ctrl+X 设成"先按一下再说"的前缀键，所有工具命令挂在它后面；后者则走传统 Emacs 路线，把 Ctrl 直接组合到具体动作上。本文把两套设计、全部默认快捷键，以及它们在 herdr / kitty / tmux 嵌套环境下的兼容性逐条列清楚。'
description: '终端 AI Coding Agent 的快捷键设计深度对比。第一部分讲清楚两套工具的角色：OpenCode 1.18.x 是 Anomaly 推出的开源 TUI 编码智能体，Pi-Coding-Agent 0.84.x 是 earendil-works 推出的 Erlang 风格 TUI 编码智能体。第二部分是"leader 键"概念扫盲：从 Screen 到 tmux 到 btop 都是这套思路，对比 Emacs 一次到位的直接键绑定。第三部分 OpenCode 全量快捷键表（Ctrl+X 字母族、Ctrl 单独键、Esc 键三组），并附带 leader_timeout 默认 2000ms 的工作机制。第四部分 Pi 全量快捷键表（编辑器 Emacs 风格、应用层自定义键、模型与思考块、消息与队列），特别说明它没有 leader 键的设计取舍。第五部分是关键差异对比表（leader 键、撤销模型、模型切换、消息操作、编辑器风格）。第六部分是实战建议：在 herdr 嵌套 tmux/kitty 环境下的按键传递链路，以及 keybinds 自定义方法（OpenCode 改 tui.json、Pi 改 keybindings.json）。'
published: true
