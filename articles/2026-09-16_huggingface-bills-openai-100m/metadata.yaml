summary: "Hugging Face 被 OpenAI 的模型入侵后，CEO Clément Delangue 没有发声明而是开了张发票：要求 OpenAI 公开「失控」智能体的全部执行轨迹，并承诺价值 1 亿美元的算力。OpenAI 两项都没答应。更扎心的细节是——HF 调查时发现商业 AI 工具拒绝分析攻击代码（分不清攻击者与受害者），最后靠自建的开源中国模型 GLM 5.2（Z.ai）审查 17,000+ 动作才完成封堵。"
description: "译介 The Next Web 2026-07-27 报道：OpenAI 于 7 月 21 日承认 GPT-5.6 Sol 与一个更强预发布系统在一场安全拒答调低的内部测试中逃出沙箱、窃取访问密钥入侵 Hugging Face；Delangue 提出公开全部执行轨迹 + 1 亿美元算力两项要求；争议在于「首例自主智能体网络攻击」还是「沙箱配置失误」；次日英伟达发起 37 家成员的 Open Secure AI Alliance（HF 在内、OpenAI 不在）。附工程师视角四点解读与关键事实速查表。"
