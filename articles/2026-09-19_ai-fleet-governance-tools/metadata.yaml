summary: "译介 CSO Online 盘点（Peter Wayner，2026-09-17）：16 家 AI 治理/护栏/红队平台——Collibra、Confident Security、Credo AI、F5+CalypsoAI、Fiddler AI、Guardrails AI、Hidden Layer、IBM watsonx.governance、Lakera、Lasso Security、LogicGate、Mindgard、OneTrust、Prompt Security、Protect AI、Securiti.ai。解读将其按四类痛点归类（资产盘点/运行时护栏/红队对抗/合规治理），并点出「用 LLM 管 LLM」的审计与确定性兜底问题。"
description: "译介 CSO Online《16 governance tools for securing your AI fleet》(Peter Wayner, 2026-09-17) 并加工程解读。事实：16 家 AI 信任/护栏/红队平台按字母序盘点——Collibra(AI Command Center+信任分, 接 Snowflake/Databricks)、Confident Security(OpenPCC 隐私云+按 token 计费, 医疗金融)、Credo AI(GAIA 目录+EU AI Act/SOC2/ISO-42001/GDPR policy packs)、F5+CalypsoAI(推理层包裹+自动化红队)、Fiddler AI(100+指标盯幻觉/PII/漂移, 有免费档)、Guardrails AI(Snowglobe 模拟+Guardrails OSS 校验器)、Hidden Layer(AI BoM 挖权重元数据+攻击模拟)、IBM watsonx.governance(治理图谱+30天试用)、Lakera(流量层挡越狱/提示注入, 赞助 Gandalf 游戏, 社区免费档)、Lasso Security(扫代码仓/CI 做 AI 资产普查)、LogicGate(无代码 Risk Cloud+蒙特卡洛量化风险)、Mindgard(自动化红队循环)、OneTrust(Continuous Governance)、Prompt Security(LLM 代理网关深度审查 IO)、Protect AI(Guardian/Recon/Layer+LLM Security/ModelScan 开源)、Securiti.ai(DSPM+情境敏感防火墙)。解读：①横向分四类——资产盘点/可见性(Collibra/Lasso/Hidden Layer/Securiti/OneTrust/LogicGate)、运行时护栏/IO 过滤(Lakera/Prompt Security/Guardrails AI/Fiddler)、红队对抗(CalypsoAI/F5/Mindgard/Protect AI/Hidden Layer)、合规与全生命周期治理(Credo AI/IBM/Confident/OneTrust)；选型先定缺哪格，多数团队最缺第①格；②「用 LLM 管 LLM」的讽刺——护栏自身是模型也有幻觉，输出需可审计、策略可解释、关键强制点留确定性规则兜底。"
