<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="900" viewBox="0 0 1060 900" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#5a6b7b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#059669"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:10; }
      .box-dark { fill:#0f172a; stroke:#334155; stroke-width:1.5; rx:10; }
      .zone { fill:none; stroke:#cbd5e1; stroke-width:1.2; stroke-dasharray:6 4; rx:14; }
      .label { font-size:15px; fill:#1e293b; font-weight:600; }
      .label-sm { font-size:12.5px; fill:#475569; }
      .label-xs { font-size:11px; fill:#64748b; }
      .flow { stroke:#5a6b7b; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .flow-blue { stroke:#2563eb; stroke-width:1.8; fill:none; marker-end:url(#arrow-blue); }
      .flow-green { stroke:#059669; stroke-width:1.8; fill:none; marker-end:url(#arrow-green); }
      .title { font-size:21px; fill:#0f172a; font-weight:700; }
      .cn { fill:#fef3c7; stroke:#f59e0b; stroke-width:1.4; rx:8; }
      .cn-text { font-size:12.5px; fill:#92400e; font-weight:600; }
      .os { fill:#dbeafe; stroke:#3b82f6; stroke-width:1.4; rx:8; }
      .os-text { font-size:12.5px; fill:#1e40af; font-weight:600; }
      .flt { fill:#dcfce7; stroke:#22c55e; stroke-width:1.4; rx:8; }
      .flt-text { font-size:12.5px; fill:#166534; font-weight:600; }
      .warn { fill:#fee2e2; stroke:#ef4444; stroke-width:1.4; rx:8; }
      .warn-text { font-size:12.5px; fill:#991b1b; font-weight:700; }
    </style>
  </defs>

  <text x="40" y="42" class="title">家庭网络 DNS 自主化架构：按 IP 分流 + 双递归 + 全域过滤</text>
  <text x="40" y="64" class="label-sm">客户端可自带 DoH → DNS 与 TCP 两层判定依据不同：DNS 问「能不能解析」，TCP 问「墙内能不能直连」</text>

  <!-- ═══ 客户端 ═══ -->
  <rect x="40" y="95" width="270" height="160" class="box"/>
  <text x="175" y="122" class="label" text-anchor="middle">客户端</text>
  <rect x="58" y="136" width="110" height="40" class="box-dark"/>
  <text x="113" y="153" class="label" text-anchor="middle" fill="#e2e8f0" style="font-size:12.5px">LAN 设备</text>
  <text x="113" y="169" class="label-xs" text-anchor="middle" fill="#94a3b8">手机 / PC / 电视</text>
  <rect x="182" y="136" width="110" height="40" class="box-dark"/>
  <text x="237" y="153" class="label" text-anchor="middle" fill="#e2e8f0" style="font-size:12.5px">远程接入设备</text>
  <text x="237" y="169" class="label-xs" text-anchor="middle" fill="#94a3b8">WireGuard 隧道</text>
  <text x="58" y="200" class="label-sm">自带 DoH 的设备（描述文件）：</text>
  <text x="58" y="217" class="label-xs">DNS 由客户端自己解析 → 网关只拿到「IP + SNI」</text>
  <text x="58" y="233" class="label-xs">→ 这正是 TCP 层必须按 IP 段分流的原因</text>
  <text x="58" y="249" class="label-xs">→ 也意味着 DNS 层给错答案时，网关没有纠错机会</text>

  <!-- ═══ 网关 ═══ -->
  <rect x="40" y="285" width="600" height="345" class="zone"/>
  <text x="58" y="310" class="label">家庭网关（家宽入口）</text>
  <text x="58" y="327" class="label-xs">自建递归 + 透明代理 + 全域过滤</text>

  <rect x="58" y="340" width="180" height="70" class="box"/>
  <text x="148" y="363" class="label-sm" text-anchor="middle" font-weight="600">nftables 劫持</text>
  <text x="148" y="381" class="label-xs" text-anchor="middle">DNS 53 → 透明代理端口</text>
  <text x="148" y="397" class="label-xs" text-anchor="middle">IPv4 / IPv6 / 隧道 一视同仁</text>

  <rect x="262" y="340" width="360" height="180" class="box"/>
  <text x="442" y="362" class="label" text-anchor="middle">sing-box（分流器）</text>

  <rect x="280" y="374" width="150" height="60" class="cn"/>
  <text x="355" y="393" class="cn-text" text-anchor="middle">DNS 判定</text>
  <text x="355" y="409" class="label-xs" text-anchor="middle">国内域名清单 → 国内递归</text>
  <text x="355" y="425" class="label-xs" text-anchor="middle">其余 → 境外递归</text>

  <rect x="454" y="374" width="150" height="60" class="os"/>
  <text x="529" y="393" class="os-text" text-anchor="middle">TCP 判定</text>
  <text x="529" y="409" class="label-xs" text-anchor="middle">只按 IP 段</text>
  <text x="529" y="425" class="label-xs" text-anchor="middle">→ 直连 / 代理</text>

  <text x="442" y="450" class="label-xs" text-anchor="middle">嗅探 TLS SNI 补域名，但不重写客户端已解析的 IP</text>
  <text x="442" y="466" class="label-xs" text-anchor="middle">境外 IP 不在国内段 → 一律走代理</text>
  <text x="442" y="482" class="label-xs" text-anchor="middle">域名规则只用于「解析」，不用于决定出口</text>
  <text x="442" y="502" class="label-xs" text-anchor="middle" fill="#dc2626">（曾用域名表判直连 → 正确的境外 IP 被直连被墙）</text>

  <rect x="58" y="540" width="180" height="80" class="box"/>
  <text x="148" y="558" class="label-sm" text-anchor="middle" font-weight="600">unbound（本地递归）</text>
  <text x="148" y="574" class="label-xs" text-anchor="middle">明文迭代 + 加密上游</text>
  <text x="148" y="588" class="label-xs" text-anchor="middle">国内域名 → 国内 CDN 节点</text>
  <rect x="72" y="596" width="152" height="16" class="flt"/>
  <text x="148" y="608" class="flt-text" text-anchor="middle" style="font-size:10.5px">过滤表（全量）</text>

  <rect x="262" y="540" width="160" height="76" class="box"/>
  <text x="342" y="562" class="label-sm" text-anchor="middle" font-weight="600">nsd（根区镜像）</text>
  <text x="342" y="580" class="label-xs" text-anchor="middle">AXFR 从根同步</text>
  <text x="342" y="596" class="label-xs" text-anchor="middle">本地保留完整根区</text>

  <rect x="446" y="540" width="176" height="76" class="box"/>
  <text x="534" y="562" class="label-sm" text-anchor="middle" font-weight="600">加密隧道出口</text>
  <text x="534" y="580" class="label-xs" text-anchor="middle">境外域名的递归通道</text>
  <text x="534" y="596" class="label-xs" text-anchor="middle">TCP 转发，可验证</text>

  <path d="M 165 255 L 165 340" class="flow"/>
  <path d="M 237 255 L 237 300 L 250 300 L 250 340" class="flow"/>
  <path d="M 238 375 L 280 400" class="flow-blue"/>
  <path d="M 430 400 L 454 400" class="flow-green"/>
  <path d="M 355 430 L 355 540" class="flow-blue"/>
  <path d="M 529 430 L 529 520 L 534 520 L 534 540" class="flow-green"/>

  <!-- ═══ 墙外 VPS ═══ -->
  <rect x="690" y="95" width="330" height="235" class="zone"/>
  <text x="708" y="120" class="label">境外 VPS（信任边界外）</text>
  <text x="708" y="137" class="label-xs">唯一在墙外递归的地方</text>

  <rect x="708" y="150" width="294" height="80" class="box"/>
  <text x="855" y="173" class="label-sm" text-anchor="middle" font-weight="600">unbound（境外递归）</text>
  <text x="855" y="191" class="label-xs" text-anchor="middle">墙外迭代，答案天然干净</text>
  <rect x="730" y="199" width="250" height="20" class="flt"/>
  <text x="855" y="213" class="flt-text" text-anchor="middle" style="font-size:11.5px">过滤表（全量）</text>

  <rect x="708" y="244" width="294" height="68" class="box"/>
  <text x="855" y="267" class="label-sm" text-anchor="middle" font-weight="600">代理服务</text>
  <text x="855" y="285" class="label-xs" text-anchor="middle">境外流量的唯一出口</text>

  <path d="M 622 578 L 664 578 L 664 190 L 708 190" class="flow-green"/>
  <path d="M 534 505 L 534 525 L 676 525 L 676 278 L 708 278" class="flow-green"/>

  <!-- ═══ DoH 服务 ═══ -->
  <rect x="690" y="360" width="330" height="270" class="zone"/>
  <text x="708" y="385" class="label">自建 DoH 服务（境内云主机）</text>
  <text x="708" y="402" class="label-xs">给设备在外时用：加密 DNS + 过滤 + 不污染</text>

  <rect x="708" y="415" width="294" height="54" class="box"/>
  <text x="855" y="436" class="label-sm" text-anchor="middle" font-weight="600">TLS 端点（令牌鉴权）</text>
  <text x="855" y="455" class="label-xs" text-anchor="middle">令牌走路径，日志脱敏</text>

  <rect x="708" y="481" width="294" height="52" class="box"/>
  <text x="855" y="502" class="label-sm" text-anchor="middle" font-weight="600">DNS 分流层</text>
  <text x="855" y="521" class="label-xs" text-anchor="middle">按域名清单分到两个递归实例</text>

  <rect x="708" y="545" width="140" height="46" class="cn"/>
  <text x="778" y="564" class="cn-text" text-anchor="middle">国内递归</text>
  <text x="778" y="581" class="label-xs" text-anchor="middle">加密上游</text>

  <rect x="862" y="545" width="140" height="46" class="os"/>
  <text x="932" y="564" class="os-text" text-anchor="middle">境外递归</text>
  <text x="932" y="581" class="label-xs" text-anchor="middle">墙外上游</text>

  <text x="855" y="600" class="label-xs" text-anchor="middle">两个实例都加载全量过滤表</text>

  <!-- ═══ 关键结论 ═══ -->
  <rect x="40" y="655" width="980" height="215" class="box"/>
  <text x="60" y="682" class="label" font-weight="700">两条不变量</text>

  <rect x="60" y="694" width="460" height="72" class="warn"/>
  <text x="74" y="715" class="warn-text">① TCP 层不按域名分流</text>
  <text x="74" y="734" class="label-xs">客户端自带 DoH 时，网关只拿到 IP + SNI，没有</text>
  <text x="74" y="750" class="label-xs">FakeIP 映射可反查域名。同一个境外 IP，只因 SNI</text>
  <text x="74" y="762" class="label-xs">撞上「国内域名表」，就会从走代理变成直连被墙。</text>

  <rect x="540" y="694" width="460" height="72" class="warn"/>
  <text x="554" y="715" class="warn-text">② DNS 层必须给出正确答案</text>
  <text x="554" y="734" class="label-xs">网关不会用嗅探到的域名重新解析，污染的 IP 会被</text>
  <text x="554" y="750" class="label-xs">原样转给代理 → 连到错误服务器 → 404 / 证书不匹配。</text>
  <text x="554" y="762" class="label-xs">DNS 分流因此要用「国内域名清单」，不能用国内域名表。</text>

  <rect x="60" y="778" width="940" height="78" class="flt"/>
  <text x="74" y="799" class="flt-text">结果：DNS 与 TCP 分开判定</text>
  <text x="74" y="818" class="label-xs">DNS 问「能不能解析」—— 国内域名走境内递归拿国内 CDN 节点，境外域名走墙外递归拿干净 IP。</text>
  <text x="74" y="835" class="label-xs">TCP 问「墙内能不能直连」—— 只认 IP 段，国内段直连，其余一律走代理。</text>
  <text x="74" y="850" class="label-xs">过滤表在每个递归器上都加载全量，因此无论流量落到哪一层递归，都会被过滤。</text>
</svg>
