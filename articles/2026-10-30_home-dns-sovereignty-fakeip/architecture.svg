<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:10; }
    .box-dark { fill:#0f172a; stroke:#334155; stroke-width:1.5; }
    .zone { fill:none; stroke:#cbd5e1; stroke-width:1.2; stroke-dasharray:6 4; rx:14; }
    .label { font-size:15px; fill:#1e293b; font-weight:600; }
    .label-sm { font-size:12.5px; fill:#475569; }
    .label-xs { font-size:11px; fill:#64748b; }
    .flow { stroke:#5a6b7b; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    .flow-blue { stroke:#2563eb; stroke-width:1.8; fill:none; marker-end:url(#arrow-blue); }
    .flow-green { stroke:#059669; stroke-width:1.8; fill:none; marker-end:url(#arrow-green); }
    .title { font-size:20px; fill:#0f172a; font-weight:700; }
    .fakeip { fill:#fef3c7; stroke:#f59e0b; stroke-width:1.4; rx:8; }
    .fakeip-text { font-size:12.5px; fill:#92400e; font-weight:600; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="title">家庭网络 DNS 自主化架构：FakeIP + 双递归 + 过滤</text>

  <!-- LAN 区 -->
  <rect x="40" y="60" width="1120" height="150" class="zone"/>
  <text x="60" y="88" class="label" fill="#64748b">家庭 LAN —— 设备零代理软件，所见皆 FakeIP</text>

  <!-- 手机 -->
  <rect x="90" y="105" width="230" height="80" rx="10" class="box"/>
  <text x="205" y="135" text-anchor="middle" class="label">手机 / PC / 电视</text>
  <text x="205" y="158" text-anchor="middle" class="label-sm">DNS 应答 = 198.18.x.x</text>
  <text x="205" y="175" text-anchor="middle" class="label-xs">以及 WireGuard 远程接入设备（同一处理链）</text>

  <!-- nft -->
  <rect x="420" y="105" width="240" height="80" rx="10" class="box-dark"/>
  <text x="540" y="135" text-anchor="middle" class="label" fill="#ffffff" font-weight="700">nftables TPROXY</text>
  <text x="540" y="158" text-anchor="middle" class="label-sm" fill="#e2e8f0">:53 / :7895 / :7896 劫持</text>
  <text x="540" y="175" text-anchor="middle" class="label-xs" fill="#cbd5e1">FakeIP 段天然被接管，无需专规则</text>

  <!-- sing-box -->
  <rect x="770" y="88" width="370" height="250" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="955" y="118" text-anchor="middle" class="label" fill="#f8fafc">sing-box（网关进程）</text>

  <rect x="800" y="135" width="310" height="46" rx="8" class="fakeip"/>
  <text x="955" y="155" text-anchor="middle" class="fakeip-text">FakeIP 表：198.18.0.1 ↔ google.com</text>
  <text x="955" y="172" text-anchor="middle" class="fakeip-text">198.18.0.2 ↔ baidu.com …</text>

  <rect x="800" y="196" width="145" height="42" rx="8" fill="#334155" stroke="#475569"/>
  <text x="872" y="216" text-anchor="middle" class="label-sm" fill="#ffffff" font-weight="700">DNS 分流</text>
  <text x="872" y="231" text-anchor="middle" class="label-xs" fill="#cbd5e1">geosite-cn / .lan / final</text>

  <rect x="965" y="196" width="145" height="42" rx="8" fill="#334155" stroke="#475569"/>
  <text x="1037" y="216" text-anchor="middle" class="label-sm" fill="#ffffff" font-weight="700">TCP 分流</text>
  <text x="1037" y="231" text-anchor="middle" class="label-xs" fill="#cbd5e1">direct / proxy / 域名直传</text>

  <rect x="800" y="266" width="310" height="52" rx="8" fill="#0c4a6e" stroke="#0ea5e9"/>
  <text x="955" y="288" text-anchor="middle" class="label-sm" fill="#e0f2fe" font-weight="600">sniff + 兜底：上游 SERVFAIL 时</text>
  <text x="955" y="306" text-anchor="middle" class="label-xs" fill="#7dd3fc">自动降级到隧道内 DNS，链路不断</text>

  <!-- LAN 内箭头 -->
  <line x1="320" y1="135" x2="414" y2="135" class="flow"/>
  <text x="365" y="126" text-anchor="middle" class="label-xs">明文 53</text>
  <line x1="660" y1="145" x2="764" y2="145" class="flow"/>
  <line x1="764" y1="165" x2="660" y2="165" class="flow"/>
  <text x="712" y="121" text-anchor="middle" class="label-xs">FakeIP 回复</text>

  <!-- 中部：两条 DNS 上游路径 -->
  <!-- 国内路径 -->
  <line x1="800" y1="160" x2="750" y2="366" class="flow-green"/>
  <text x="610" y="330" class="label-sm" fill="#059669">DoT :853 加密</text>
  <rect x="650" y="372" width="200" height="72" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.8"/>
  <text x="750" y="397" text-anchor="middle" class="label">阿里公共 DoT</text>
  <text x="750" y="417" text-anchor="middle" class="label-xs">国内域名解析 · 传输层抗污染</text>
  <text x="750" y="434" text-anchor="middle" class="label-xs">sing-box 兜底降级 → 本地递归</text>

  <!-- 国外路径 -->
  <line x1="1060" y1="250" x2="1060" y2="380" class="flow-blue"/>
  <text x="1035" y="330" class="label-sm" fill="#2563eb">DoT :853 ⊂ 加密隧道</text>

  <!-- VPS 大区 -->
  <rect x="880" y="375" width="280" height="285" rx="12" class="zone" style="stroke:#2563eb; stroke-width:1.6"/>
  <text x="900" y="398" class="label" fill="#2563eb">墙外 VPS（信任边界）</text>

  <rect x="900" y="415" width="240" height="60" rx="10" class="box" style="stroke:#2563eb; stroke-width:1.8"/>
  <text x="1020" y="439" text-anchor="middle" class="label">unbound 递归+严格DNSSEC</text>
  <text x="1020" y="459" text-anchor="middle" class="label-xs">国外域名解析 · 验签抗污染</text>

  <rect x="900" y="495" width="112" height="52" rx="8" class="box"/>
  <text x="956" y="517" text-anchor="middle" class="label-sm">nsd 根区镜像</text>
  <text x="956" y="534" text-anchor="middle" class="label-xs">TCP AXFR · 抗污染</text>

  <rect x="1028" y="495" width="112" height="52" rx="8" class="box"/>
  <text x="1084" y="517" text-anchor="middle" class="label-sm">noncn 过滤表</text>
  <text x="1084" y="534" text-anchor="middle" class="label-xs">≈56 万恶意/广告域</text>

  <!-- 权威 -->
  <line x1="1020" y1="560" x2="1020" y2="605" class="flow"/>
  <rect x="915" y="607" width="210" height="44" rx="10" class="box"/>
  <text x="1020" y="627" text-anchor="middle" class="label-sm">全球权威 DNS 服务器</text>
  <text x="1020" y="643" text-anchor="middle" class="label-xs">看到的是 VPS 的 IP，不是家宽</text>

  <!-- 墙内下半部：unbound-domestic + nsd -->
  <rect x="60" y="380" width="640" height="240" rx="12" class="zone"/>
  <text x="80" y="406" class="label" fill="#64748b">墙内网关常驻（兜底与观测）</text>

  <rect x="90" y="420" width="290" height="90" rx="10" class="box"/>
  <text x="235" y="446" text-anchor="middle" class="label">unbound-domestic :53</text>
  <text x="235" y="466" text-anchor="middle" class="label-xs">国内域名递归（阿里故障时兜底）</text>
  <text x="235" y="483" text-anchor="middle" class="label-xs">cn 过滤表 ≈5 千条 · dnstap → 面板</text>
  <text x="235" y="500" text-anchor="middle" class="label-xs">内网权威数据（.lan zone 自动生成）</text>

  <rect x="410" y="420" width="270" height="90" rx="10" class="box"/>
  <text x="545" y="446" text-anchor="middle" class="label">nsd :1053 根区镜像</text>
  <text x="545" y="466" text-anchor="middle" class="label-xs">TCP AXFR ← 7 个根/ICANN 上游</text>
  <text x="545" y="483" text-anchor="middle" class="label-xs">DNSSEC 签名根区 · v4+v6 双路</text>
  <text x="545" y="500" text-anchor="middle" class="label-xs">为两侧 unbound 提供信任锚</text>

  <line x1="380" y1="465" x2="404" y2="465" class="flow"/>
  <text x="392" y="456" text-anchor="middle" class="label-xs">根区</text>

  <!-- 黑名单流水线 -->
  <rect x="90" y="540" width="590" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="385" y="564" text-anchor="middle" class="label" fill="#9a3412">广告/恶意域名分类流水线（每日）</text>
  <text x="385" y="585" text-anchor="middle" class="label-xs" fill="#c2410c">20 个源聚合 → 增量解析 → geoip 分为 cn/noncn/nx → 产出双过滤表（nx 不加载，省 65% 内存）</text>

  <line x1="385" y1="540" x2="385" y2="514" class="flow"/>
  <line x1="680" y1="570" x2="1020" y2="551" class="flow" stroke-dasharray="5 3"/>

  <!-- 观察者注记 -->
  <rect x="60" y="680" width="1100" height="150" rx="12" fill="#0f172a"/>
  <text x="85" y="712" class="label" fill="#f8fafc">隐私模型：谁能看到什么</text>

  <text x="85" y="740" class="label-sm" fill="#e2e8f0">· LAN 内设备　—— 手机目的地全是 198.18.x.x，看不出访问了什么（FakeIP 关闭内窥）</text>
  <text x="85" y="765" class="label-sm" fill="#e2e8f0">· 宽带运营商　—— 仅见加密流量（国内→阿里 DoT，国外→隧道），零明文 DNS 查询</text>
  <text x="85" y="790" class="label-sm" fill="#e2e8f0">· 阿里 / VPS 服务商 —— 各看到对应侧的查询全集（已知信任边界，弹性依赖可降级）</text>
  <text x="85" y="815" class="label-sm" fill="#e2e8f0">· 目标网站　—— 国内见家宽 IP 直连（SNI 明文，ECH 可解）；国外见 VPS IP</text>
</svg>
