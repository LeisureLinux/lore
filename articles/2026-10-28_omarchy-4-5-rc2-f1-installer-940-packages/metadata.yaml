description: "Omarchy 4.5-RC2 最值得说的不是那些新应用，而是安装器架构的改变：F1 安装器不再用 pacstrap 逐个安装约 940 个包，而是在构建期把这份「对所有人都一样」的包集烤成一张 btrfs 镜像（compress-force=zstd:15），用 zstd 的 seekable format 切成 256 KiB 独立帧、打上 seek table，安装时由自研 C 程序 omarchy-image-write 多线程并行解码并用 O_DIRECT 直接 pwrite 到目标分区，然后给它一个全新 fsid、扩容到整个分区、重塑成 @/@home/@log/@pkg 布局，最后一次小规模 pacstrap 补上每台机器的差异。本文逐行核对了 omarchy-iso 仓库的 build-root-image.sh、omarchy-image-write.c、phases_impl.py 三份源码，还发现了一个发布说明完全没提的关键设计 —— 集成测试里的 corrupt-image 场景专门证明「坏安装介质会在碰磁盘之前被拒绝，目标磁盘仍然没有分区表」。文章还给出 RC2 相对 RC1 的真实净增量（Breaking changes 全新章节、Fixes 从 32 涨到 74、Deprecations 7 条）、Limine 超时从 6 秒降到 1 秒这个破坏性变更与 10 条快捷键重排的完整对照表、以及 Omarchy 官方实测的中国镜像延迟数据（.org 中位 909ms vs .cn 中位 364ms）。"
