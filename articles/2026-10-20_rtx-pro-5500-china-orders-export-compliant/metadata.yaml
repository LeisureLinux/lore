description: "字节跳动、阿里巴巴、腾讯向英伟达下了超过 300 万张 RTX Pro 5500 的订单，按每张约 11,400 美元算总值超过 350 亿美元。而英伟达告诉合作伙伴，只能交付 5% 到 10%，因为 2027 年全球产能上限就是 300 万张。本文解释三件事：为什么是这张卡（84GB GDDR7、出口合规、性能接近已停产的 RTX 6000D）、为什么交付率这么低（台积电产能要留给 Rubin）、以及一个被多数报道漏掉的数字：中国客户的总订单其实超过 600 万张。"
