description: "Avdi Grimm 吐槽 AI 编程工具的社会认同机制是循环的：没人用，只有视频。但这篇随笔没给出数据 —— 而数据其实更狠。三个互不相识的团队（JetBrains、Quesma、Point Five 的 arXiv 论文）在 2026 年 6–9 月独立评测了三类「省 token」工具，结论一致：宣称省 60–90% 的 rtk 实测中位成本 +7.6%（低推理档）/ +17%（按任务算，DeepSeek），宣称省 47–92% 的 Headroom 实测 +47.3%；唯一为真的是 ponytail，但只省 10.3%（宣称 20%）。而 arXiv 论文给出了根因：token 削减与成本削减的相关系数只有 r=0.15，因为 prompt 缓存创建与读取主导了输入侧成本。本文拆解三个案例的数据、方法论，以及「token 减少 ≠ 成本减少」这条对所有做 AI 工具评测的人的警告。"
published: true
