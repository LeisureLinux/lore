title: "闰秒要大改：UTC 从 2027 年起不再调整，允许与地球自转差一小时"
date: 2026-09-10
author: LeisureLinux
tags:
  - 译文
  - 时间同步
  - UTC
  - 闰秒
  - 基础设施
summary: "Computerworld 报道：地球自转略微加速，可能需要从未出现过的负闰秒；国际计量大会 10 月将投票，拟自 2027 年 5 月 20 日起让 UTC 成为连续时间，允许 UT1 与 UTC 相差最多一小时。负闰秒概率到 2035 年达 30%，准备成本堪比千年虫。含 2012 年闰秒事故复盘与五位专家观点。"
description: "负闰秒提案译文与解读：为什么减一秒是从未在生产环境跑过的代码路径、用连续漂移换离散跳变的工程交易、千年虫级别的准备成本、成千上万个小不一致比全球中断更危险，以及对国内金融与信创系统的时间同步建议。"
published: true
original_source: "https://www.computerworld.com/article/4220034/leap-second-proposal-will-keep-software-stacks-in-sync-2.html"
