summary: "三星在 Hot Chips 2026 提出把 HBM base die 从通信层升级为可定制逻辑平台，路线分三步：回收处理器面积的 cHBM、集成传感与计算单元的 aHBM、垂直三维堆叠的 zHBM。本文译文并解读其技术逻辑、商业叙事与产业影响。"
description: "SemiWiki 报道三星 Hot Chips 2026 演讲：HBM4 base die 改用 4nm 逻辑工艺，催生定制 HBM（cHBM）；三阶段路线图走向 aHBM 与 zHBM，后者预估降低 HBM I/O 功耗约 70%。含技术解读与产业分析。"
