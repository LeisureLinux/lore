description: "Kaspersky 披露了一个此前未记录的 .NET 程序集加载框架 NetamLoader：它不靠漏洞利用，而是把一个 CAB 文件放进 Windows 更新缓存目录 C:\\Windows\\SoftwareDistribution\\Download\\，里面装着七个「看起来完全合法」的文件 —— 其中四个是第三方补丁工具 Patch My PC 的真实组件，连用来做注入的 Microsoft.HostIntegration.Connectors.dll 都是微软签名的。真正恶意的只有两个 .config 和一个 .resx：AppDomainManager 注入让 .NET 在主函数运行前就加载攻击者指定的程序集（且关掉了 NGEN 日志），BinaryFormatter 反序列化触发 TypeConfuseDelegate，再逐层 XAML 解密推进 —— 解密密钥则是 SHA-256(当前进程命令行)，实现「环境绑定 + 免密钥文件」。本文逐层拆解了这条链：AMSI 绕过用 9 字节机器码改写 Scan 方法、且只改虚表以绕过完整性检查；最终载荷被移到 dllhost.exe 实现进程脱钩以躲开 EDR；XAML-3 采用模板 + 配置现场组装（同一框架可按目标裁剪载荷）；三个时间参数（20-40 分钟首次延迟、22-28 小时降频轮询、28 小时后退出）构成沙箱规避；C2 通信用 AES-128-CBC + HMAC 并做证书指纹固定。完整 IOC 清单（11 个 MD5、3 条路径、域名与 IP）已收录。最关键的解读是：Kaspersky 明确未做归因且受害者只有一台 —— 这更像是针对政府定制操作系统的可行性验证，而非大规模入侵；结合 2026 年 8 月中国国安部要求部分政府机构停用政府版 Windows 转向国产 Linux 的背景，这才是真正值得长期关注的部分。"
