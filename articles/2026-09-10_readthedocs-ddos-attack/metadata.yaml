summary: "Read the Docs 官方复盘 2026 年 6 月史上最大 DDoS 攻击：峰值 550 万次请求/分钟、约 100 倍正常基线，持续近十天，来自全球数百万 IP、数百 ASN，TLS 参数随机化规避 JA3/JA4，专打缓存未命中面（404/302）。含完整攻防细节、防御策略与五条关键结论。"
description: "Read the Docs DDoS 攻击复盘译文与解读：缓存命中率才是胜负手、惩罚箱规则、不用 Under Attack Mode 的取舍、给 404/重定向加短缓存、Nginx rewrite 迁到边缘、WAF 规则纳入 Terraform 版本控制，以及对国内镜像站与文档站的防御参照。"
