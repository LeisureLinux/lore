description: "Mozilla 发布 Firefox Enterprise，把浏览器与管理控制台打包卖给企业，主打「管理基础设施跑在客户自己的机房里」。这是 Mozilla 在搜索收入占比约 85% 的结构性风险下，向订阅制收入的一次转型尝试，而它选的切口是欧洲的数字主权叙事。本文拆解这条产品线的实际能力、它与 Island / Prisma Browser 等专用企业浏览器的路线差异，以及为什么「独立的浏览器引擎」这个卖点既是它唯一的护城河，也是最难变现的地方。"
