summary: "Google 用 AI 在 Chrome 149/150 两个版本里修掉了 1072 个安全漏洞，比此前 23 个版本加起来还多，其中一个漏洞潜伏了 13 年。为应对 AI 时代更快的攻击节奏，Google 把安全补丁改为每周发布、并试点每周两次。漏洞越修越多、节奏越改越快——对企业 IT 变更管理来说，这既是好消息，也是巨大的不确定性。"
description: "深度解读 Computerworld 关于 Google 用 AI 检测并修复 Chrome 1072 个漏洞的报道及 Google 官方博客。重点分析 AI 驱动的漏洞发现与自动修复如何改变补丁节奏，以及对企业 IT 变更管理（变更窗口、回归测试、发布评审 CAB、冻结期、补丁治理）带来的不确定性，并给出 Extended Stable Channel、RelaunchNotification 策略、企业级发布环等落地建议。"
