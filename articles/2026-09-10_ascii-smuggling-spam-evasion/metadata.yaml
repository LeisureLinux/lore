  - 安全
  - 垃圾邮件
  - Unicode
  - AI 安全
summary: "原本用于向 AI 智能体隐藏恶意提示词的 ASCII 走私技术，如今被垃圾邮件发送者接手，用来绕过邮件过滤。微软观测到检出量在四天内从每天 2.1 万条暴涨到 250 万条。本文译文并解读其机制、量级与防御启示。"
description: "Ars Technica 报道：ASCII 走私（ASCII smuggling）从提示词注入攻击转向垃圾邮件规避。本文给出微软 Defender for Office 的检出数据、Unicode 标签块机制、tokenizer 脆弱点分析，以及对邮件安全网关与信创环境的防御启示。"
published: true
original_source: "https://arstechnica.com/security/2026/09/once-popular-for-attacking-ai-ascii-smuggling-is-embraced-by-spammers/"
