summary: '本文是一次真实交叉编译记录：在 Debian 13（x86_64）上产出两个 toybox 0.8.14 的完全静态 musl 可执行文件——本地 x86_64 版（用 landley.net 现成 linux-musl 工具链，GCC 15.1.0）和 ARM64 版（用 musl-cross-make 从源码现编一条 aarch64 工具链，GCC 9.4.0 / binutils 2.44 / musl 1.2.6 / linux-headers 4.19.88）。重点复盘了本次实际踩到的坑：host glibc 与 musl 头文件打架、Debian musl-tools 不是完整工具链、国内下载 GNU 源码包（代理 502、清华 403、阿里云可用）、git.savannah 拉 config.sub 超时，以及最坑的一个——musl 自己 configure 里 arm* 通配符把 aarch64-linux-musl 误判成 32 位 ARM，最终靠改用 TARGET=aarch64-linux-musl 一次通过。每个工具链组件（gcc/binutils/musl/linux-headers/gmp/mpfr/mpc/sysroot）各干什么也逐一讲清，附完整可复现命令。'
description: '一次 toybox 交叉编译的完整实战实录。目标：在 Debian 13 x86_64 主机上，分别产出指向 x86_64 与 ARM64 的、完全不依赖目标机 C 库的静态 toybox（0.8.14，defconfig 约 237 个 applet，multicall 单文件）。x86_64 直接用 landley.net 提供的 x86_64 linux-musl 独立工具链（GCC 15.1.0）以 LDFLAGS=--static CROSS_COMPILE=x86_64-linux-musl- 盖出 692 KiB 可执行文件；ARM64 因无现成工具链，改用 musl-cross-make 从源码构建 aarch64 linux-musl 工具链（GCC 9.4.0 / binutils 2.44 / musl 1.2.6 / linux-headers 4.19.88 / gmp 6.3.0 / mpfr 4.2.2 / mpc 1.3.1，SHA1 全部命中）。文章按顺序复盘真实问题与解法：系统 glibc 硬盖 musl 的头文件冲突、Debian musl-tools 只提供单个 gcc 而非成套 binutils、国内网络拉取（landley.net 不稳需断点续传、GNU 包走阿里云、git.savannah 超时后手动替换系统 config.sub），以及最关键的 musl configure 通配符顺序 bug：第 324 行 arm*) 先于第 325 行 aarch64*)，导致写 arm64-linux-musl 被误判为 32 位 arm，改用 aarch64-linux-musl 即修复。最后逐一说明每个工具链组件的作用，并给出用 readelf -d 校验『完全静态』、以及产物必须移出构建树保存等实用要点。'
