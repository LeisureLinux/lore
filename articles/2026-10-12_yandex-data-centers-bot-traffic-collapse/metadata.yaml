description: "对 Yandex 数据中心的连续打击之后，Cloudflare 报告来自 Yandex 网络的机器人流量降到过去两周 HTTP 请求峰值的 0.4%，NetBlocks 报告 Yandex Cloud 流量降到 30%、Yandex LLC 降到 63%，Yandex Cloud 状态页显示至少 84 项服务离线。本文不讨论战事本身，而是聚焦一个更技术性的观察：物理基础设施的打击，如今会在互联网测量数据里留下几乎即时的、可量化的痕迹。这带来了两种能力，也带来一个需要注意的读数陷阱。"
