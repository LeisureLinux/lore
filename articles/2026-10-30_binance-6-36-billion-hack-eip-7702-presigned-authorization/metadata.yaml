description: "2026 年 10 月 29 日晚，63.6 亿美元加密资产在约 20 分钟内从 Binance 的 10 条链上被转走 —— 是史上最大规模加密盗窃，也是 Bybit 案的 4 倍。TRM 与 Chainalysis 高置信度归因给朝鲜 TraderTraitor，Elliptic 用资金同源独立印证。技术核心不是私钥泄露（Binance 明确否认，且称私钥无泄露证据），而是「让密钥替你签字的能力」被拿到：攻击者在 Ethereum 上用 EIP-7702 批量预签 50 个连续 nonce 的授权 —— 因为授权只在该计数上有效，而热钱包提现流水持续推进 nonce，所以准备 50 个连续计数就覆盖了一段窗口，命中一个即够。委托生效后 3 分 24 秒，167,464 ETH 被一笔转走；此后新资金到达就被反复扫了 6 次。另外 9 条链上是普通签名转账、连委托都没用，说明被攻破的是跨链签名基础设施本身。本文逐条核对了 TRM 原文的链上数据、各发行方的冻结时间线、以及攻击者「用超过 10% 折价甩卖 3.25 亿 USDT 抢在冻结前换 ETH」的洗钱时间差（Elliptic 独立核算显示仅 44% 被冻结），并给出防守方清单：监控 7702 delegation、签名策略拒绝非预期授权、签名基础设施按链与钱包层级隔离、撤销必须比签发快。"
published: true
