summary: "全家网络突然无法访问境外站点，表面看是 DNS 挂了，根因却藏在四层之外：一个批量任务被自家网关劫持，把上游递归器的配额打满，连带拖垮了隧道。这篇记录了完整的排查路径、五次走错方向的判断，以及最后落地的故障转移与自愈设计。"
description: "一次真实的全家断网事故复盘：如何从「Google 打不开」逐层定位到 SSH 隧道假死、上游递归器配额耗尽、批量任务被网关劫持的因果链；含五次误判的纠正过程、三个反直觉的软件行为实测（forward-zone 抢 local-zone、多上游竞速、明文 UDP 污染），以及故障转移与主动探活的落地实现。"
