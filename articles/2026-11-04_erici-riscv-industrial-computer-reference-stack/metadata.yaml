title: "「硅片到了，工业计算机还没到」：ERICI 用一个参考栈去解 RISC-V 的鸡生蛋问题"
date: 2026-11-04
slug: erici-riscv-industrial-computer-reference-stack
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：erici.eu 官网全文 + Impressum（法律信息）+ qsoe.net 官网全文与 QSOE 0.4 release notes + QSOE/N 的 GitLab 仓库与官方技术博客（seL4 for SpacemiT K3）+ RISC-V 官方 RVA23 profile 文档与 RISC-V International 的 ratificación 公告 + Xen 官方博客（SpacemiT K3 上启动）"
original_date: 2026-11-04
original_url: "https://erici.eu/"
description: "本文解读 ERICI（European RISC-V Industrial Computing Initiative）—— 一个 2026 年新成立的、非商业的欧洲 RISC-V 工业计算倡议。它的核心命题可以用官网首屏的一句话概括：RVA23 silicon has arrived. The industrial computer built on it has not.⭐ 而它的解法是「造一个参考栈」：定义层与层之间的接口（UEFI、kernel + initrd、devicetree），⭐ 然后在真实 RVA23 硬件上验证整套栈能一起启动。⭐ 而本文最想讲的不是这个栈本身有多完整，⭐ 而是它所处的那个「鸡生蛋」困境：板卡厂等软件，软件等板卡，客户等两者 —— ⭐ 而 ERICI 的选择是「用现有的商用 RVA23 板卡先把栈跑起来」（SpacemiT K3 Pico-ITX），⭐ 而不是等一块「工业计算机」出现。⭐ 栈本身分成五层：HFI BIOS（U-Boot 派生，GPL-2.0）→ mr-bml 引导加载器（GPL-3.0）→ gRouvr 资源分区 hypervisor（Apache-2.0）→ 实时分区 QSOE（QNX 风格，/N 跑自研 Skimmer 微内核、/L 跑 seL4，共用同一套用户态）→ 操作员分区 Linux。⭐ 其中两处技术细节值得单独提：⭐ 一是 gRouvr 「loaded just like a Linux kernel with its initrd」（一个 CPIO 包装着每个分区的内核与 initramfs），⭐ 所以现有引导加载器包括 GRUB 就能拉起它；⭐ 二是 QSOE 的双内核设计让两个完全不同的内核共用 100% 相同的用户态（连 libc.so 都是同一个二进制），⭐ 只在 taskman 与 libqsoe.so 两处按内核分别构建 —— ⭐ 把「实时内核选哪个」从架构决定降级成可替换的实现细节。⭐ 文章也逐条核对了官网那张「两块商用板卡 vs 工业计算机要求」的对照表，⭐ 发现十项要求里有七项标注为「厂商未说明」（包括 24V 供电、-40~85°C、硬件看门狗、工业 EMC 与安全认证、10–15 年长期供货，以及「分区软件栈：实时与 Linux 并存」），⭐ 且官网明确标注参考栈是「demonstrated on the SpacemiT K3 PicoITX board, not yet on these products」。⭐ 另有一处值得注意的法律事实：⭐ 按其 Impressum，ERICI 目前「还不是一个法人实体」，⭐ 只通过 Online-Impressum 提供法律信息，⭐ 由发起人 Yuri Zaporozhets（QSOE Systems）负责。"
