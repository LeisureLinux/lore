description: "Fedora Linux 45 在 2026-10-29 的 Go/No-Go 会议上正式获得 GO，发布日期定在 11 月 3 日（周二）。Reddit 上的说法是「updates repo 已开 = 非正式发布」，而官方口径是「RC 1.4 镜像已被 declare stable，11-03 会正式镜像并公告」—— 这两个说法其实指向同一批构建，所以「现在装的就是最终版」成立。本文按官方 ChangeSet 逐条整理了 45 的技术更新：19 项 System-Wide 变更（含 GCC 16.2 / glibc 2.44 / LLVM 23 / Go 1.27 / RPM 6.1 / Python 3.15 / OpenSSL 4.0 / Perl 5.44 / Lua 5.5）与 40+ 项 Self-Contained 变更（Podman 6 移除 slirp4netns 与 cgroups v1、Atomic 改用 image-builder、Anaconda 支持 Stratis 与浏览器远程安装、Setuptools 82+ 移除 pkg_resources、Pandas 3、MySQL 8.4→9.7、MariaDB 11.8→12.3、Ruby on Rails 8.1 等），并重点拆解了三个安全相关变化：默认限制 ptrace（防恶意软件读取同用户进程内存）、RPM 默认强制签名校验（与上一条组合后堵住「装恶意包 + 读走密钥」）、Sequoia 取代 GnuPG 实现 %openpgpverify（为 OpenPGP 工作组的后量子密码规范铺路）。同时记录了两次 NO-GO 的四个具体 blocker —— eMudhra 证书、AArch64 镜像超限、LUKS+LVM 自动激活失败、Plasma Discover 装到旧版 RPM —— 并指出它们恰好暴露了 glibc 大版本 mass rebuild 带来的连锁影响，以及「blocker 公开可查」这一发布工程的可贵之处。另需说明：媒体提到的「包构建可复现」未出现在官方 69 条 ChangeSet 中，应按质量指标而非变更条目理解。"
