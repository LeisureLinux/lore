description: "PHP 安全团队在 2026 年 10 月 20 日发布了一份罕见的提前公告：10 月 21 日 14:00 UTC 将发布两个 CVSS v4.0 9.2 的严重漏洞补丁。本文解释这次公告为什么少见（PHP 历史上很少提前通报），真正会导致打不上补丁的不是漏洞本身而是版本生命周期（8.2 在两个月后 EOL，8.0/8.1 已无补丁，5/6/7 早已 EOL），以及为什么「确认自己跑什么版本」这件事在容器和托管环境里比想象中难。"
published: true
