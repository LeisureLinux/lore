description: "Timescale 发布了 pg_vectorsearch，一个为 PostgreSQL 写的高性能近似最近邻搜索扩展。它提供 PRISM 索引（IVF 风格加层次化路由）、RaBitQ 量化、SIMD 距离计算，并声称在一亿向量数据集上、用四分之一内存打到 pgvector 的 HNSW 同等召回率时更快。本文梳理它的技术构成、它与 pgvector 的兼容路径（可以在既有 vector 列上直接建索引而不重写表），以及它在 README 里主动写出的那三条限制。"
