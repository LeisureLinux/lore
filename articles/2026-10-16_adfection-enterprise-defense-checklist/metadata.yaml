description: "Computerworld 这篇讲的是与前两天同一份 Citizen Lab 报告，但多了一层企业视角：分析师 Frank Dickson 的分析和一份可执行的防守清单。其中最值得注意的一条是，Citizen Lab 报告本身说，封锁广告标识符就可以直接阻断 Discover-Tech 当前的方法。本文整理这份清单的每一项及它为什么有效，补充报告里更精确的数字（75,373 个应用、120,768 个网站），并指出企业身份管理上的一个真实矛盾：愿意花大钱管用户身份，却让公司手机把这个持久标识符交给每天运行数千亿次的匿名竞价。"
