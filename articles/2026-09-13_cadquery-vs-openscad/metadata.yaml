summary: "ModelRift 让 6 个 AI agent（Claude Opus 5）用 CadQuery 和 OpenSCAD 各建模 3 个可打印零件并独立解析 STL。结果 6 件全部可打印，分野在失败方式：OpenSCAD 简单任务首次编译即正确，CadQuery 参数链与断言占优，但 union() 在精确相切处静默丢实体且 valid=True。核心结论：可验证性比表达力值钱，独立验证器必须与生成器异构。"
description: "译文 + 解读：6 agent 受控对比 CadQuery vs OpenSCAD。T1 托架 / T2 卡扣装配 / T3 真螺旋螺纹。渲染图什么都没抓到，抓 bug 的全是体积/水密性等数字断言。附 B-rep 精确相切暗礁、异构验证、任务形状决定选型等 4 条工程解读。"
