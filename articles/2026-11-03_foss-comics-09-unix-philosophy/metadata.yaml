description: "本文是 F/OSS Comics 第 9 篇《The Unix Philosophy》的完整中文翻译。这一篇回答的是「Unix 哲学到底从哪来」—— 而答案很反直觉：Unix 并没有一套开宗明义的纲领，Doug McIlroy 1978 年的正式表述与 Peter Salus 1994 年的简化版都是事后总结，漫画用一句「We just made it」（我们只是把它造出来了）把这件事说透了。本篇完整收录了 McIlroy 的四条与 Salus 的三条，梳理了 MINIX → Linux 的血缘（1979 年 Unix V7 许可证禁止在课堂使用源码 → Tanenbaum 造 MINIX → 1991 年 Torvalds 边读 Tanenbaum 的书边写 Linux 内核，而 Linux 内核没有使用 MINIX 或 Unix 源码、实现的是 POSIX 风格标准接口，且 0.01 版就自带 Bash 移植版），并保留了漫画中的 Unix 家族树（含 MINIX、BSD、System V、NeXTSTEP、WSL 各分支）。"
published: true
