summary: "X.Org Server 26.1 RC1（tag: xorg-server 26.0.99.901）是 21.1 以来第一个特性发布。本文详解五项结构性变化：Xwayland 拆分到独立仓库、Autoconf/Automake 完全删除改为 meson-only（最低 1.0.0）、约 2.1 万行遗留代码（DMX/EXA/shadow pixmap 等）清理、安全默认收紧（byte-swapped clients 与 font server 默认禁用）、项目重命名为 xorg-server；以及 Xvfb 多 CRTC + 13 按键鼠标、DPMS 1.2 DPMSInfoNotify、XFixes 6.1 AllowForceTerminate、BSD DRM platform、XDG_STATE_HOME/xorg 日志路径等具体新特性，并按打包者 / 系统管理员 / 开发者三类用户给出升级影响清单。"
description: "X.Org Server 26.1 RC1 由 Alan Coopersmith（Oracle）于 2026 年 8 月 19 日在邮件列表发布，是 xorg-server 项目自 21.1 以来五年来的第一个特性发布。本次主要结构变化包括：(1) Xwayland DDX 从主仓库剥离，作为独立项目独立发布；(2) 构建系统从 Autoconf/Automake 切换到 meson-only，最低 meson 版本 1.0.0，推荐 libpciaccess ≥ 0.19；(3) 一次性清理约 2.1 万行遗留代码，包括 DMX、EXA、shadow pixmap 等老扩展；(4) 项目自身重命名为 xorg-server（meson project name / pkgconfig / 安装路径均调整）；(5) 安全默认收紧——byte-swapped clients 与 font server 连接默认禁用，新增 XFixes 6.1 AllowForceTerminate xorg.conf 选项；(6) Xvfb 新增多 CRTC 支持与 13 个鼠标按键，DPMS 1.2 DPMSInfoNotify 事件落地；(7) Xorg 在 BSD 上拿到 DRM platform 支持，非 root 用户日志路径改至 $XDG_STATE_HOME/xorg。本文按打包者、系统管理员、开发者三类用户给出升级影响清单与构建命令（meson setup + ninja）。"
published: true
