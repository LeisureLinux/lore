description: "KDE Plasma 6.8 于 2026 年 10 月 14 日发布，而这一天正是 Matthias Ettrich 那封宣告 KDE 项目诞生的邮件发出整整 30 年的日子。这个版本除了无障碍（内置 dwell clicker）、Spectacle 支持系统音频与麦克风、远程桌面大改、Union 主题系统进入 beta 之外，做了一件更重要的事：Plasma 的 X11 会话支持正式退役。本文解释为什么这个决定要在「30 周年」这一天做，以及为什么它不意味着 X11 应用不能用了。"
