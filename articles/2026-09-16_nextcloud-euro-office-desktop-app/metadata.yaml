summary: "Nextcloud 于 2026-09-16 为 Euro-Office 推出 Windows/macOS/Linux 桌面客户端，补齐此前只能网页/手机访问的缺口，定位为不把数据交给非欧洲厂商的 Office 主权替代。Euro-Office 基于 OnlyOffice 代码库、由 Nextcloud 等多方背书，支持 OOXML 与 ODF 双格式；The Document Foundation 此前质疑其偏向微软格式。同期 Nextcloud Hub Summer 26 更新 Teams 应用、团队自有文件、Text/Tables/AI Assistant 与全局搜索等。Forrester 指出其最大瓶颈是「鸡生蛋」式的大规模采用证明。"
description: "译介 Computerworld 对 Nextcloud Euro-Office 桌面端发布的报道（Matthew Finnegan，2026-09-16）并附工程视角解读：桌面端补的是可用性层面的缺口而非全面对齐；「基于 OnlyOffice 代码库 + 欧洲主权叙事」的定位内在拧巴，且 OOXML 优先于 ODF 遭 LibreOffice 方质疑；Forrester 的鸡生蛋难题——没有规模证明企业不敢跳、没人跳就永远没证明——才是真正大山；对做私有云/合规敏感场景的工程师，Nextcloud + Euro-Office 形态已齐备但短期难平替 Microsoft 365。"
