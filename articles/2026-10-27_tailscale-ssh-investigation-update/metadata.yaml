description: "Tailscale 官方在 2026-10-26 公开了一起正在调查中的 SSH 权限提升问题：某些条件下，一个本来就被授权通过 Tailscale SSH 连接的人，可能做出超出其本地用户权限范围的操作，甚至可能获得提权。官方尚未给出 CVE 编号，修复版目标在 10-27 结束前（以测试通过为前提）。本文梳理官方的现有判断（不建议所有人关闭 Tailscale SSH）、可立刻执行的缓解（尤其是 TS_SSH_DISABLE_FORWARDING=1 这一条，它能缓解若干较严重的问题而不必关闭整个 SSH 功能）、以及两个观察：一是「已授权者的权限提升」比「未认证 RCE」更难防（因为攻击者用的一切都是合法的），二是这次的披露流程与本号此前写的 PHP 基金会那篇形成了一个有意思的对照 —— 瓶颈往往不在「愿不愿意公开」，而在「有没有一条让外部信号能推动内部决策的通道」。"
published: true
