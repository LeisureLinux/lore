description: "CVE-2026-109618 的官方描述只有一句「OOM 让 longjmp 跳过初始化」。但它到底能做什么？我在 Debian 13 的官方 php8.4 包上把它拆成了两条纯 HTTP 请求：第一个请求在内存里留下一个悬垂的会话 id，第二个请求伪造这个 id 的长度字段，把 4096 字节、再到 64KB 的内存编码进一个 Set-Cookie 头。堆地址和 PHP 模块基址就这样被读出来了，全程没有往目标写任何文件。本文讲清楚三个致命的配置前提（其中一个是 output_buffering）、为什么越界读的长度必须跨过 64KB、以及 8.2 和 8.4 之间一个让整条链根本不可能成立的代码差异。"
published: true
