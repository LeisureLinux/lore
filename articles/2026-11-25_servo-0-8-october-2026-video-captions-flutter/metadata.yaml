title: "Servo 0.8 发布：588 次提交创纪录，视频字幕与 Flutter Web 跑通"
date: 2026-11-25
slug: servo-0-8-october-2026-video-captions-flutter
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix 报道（Michael Larabel，2026-11-25）＋ 一手核对 Servo 官方博客《October in Servo: video captions and inert content》（2026-11-25）与 GitHub v0.8.0 Release（2026-11-09）。"
description: "解读 Rust 浏览器引擎 Servo 0.8.0：10 月 588 次提交创纪录。<video> 字幕/隐藏式字幕渲染；typed arrays 性能修复让 Flutter Web 不再卡死；:focus-visible、inert/interactivity、progress() CSS 函数、input type=image、beforeinput、wbr、text-wrap-style 等平台特性，DelayNode/ConvolverNode 等 DOM API；pinch zoom 不再重建 display list、大减内存分配与修泄漏；WebGL2/WebGPU/Geolocation/backdrop-filter/MathML/原生 SVG 多在 pref 后推进；Embedding API 完成 Android Compose 迁移、C API 可设 HiDPI/调整 WebView；layout_grid_enabled 移除、四个 pref 改名。定位是做 Chromium CEF 的替代选项，但仍是 tech demo。"
published: true
