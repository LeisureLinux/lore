title: "我的全屋无污染 IPv6 之旅：把 RA、RDNSS、RIO、FakeIP 逐个拆开"
date: 2026-11-03
slug: home-ipv6-journey
category: 技术/网络
author: FreeLAMP.com
description: "一次把家庭 IPv6 的三个顽症拆开：上游光猫在 RA 里硬广告自己当解析器、iPhone 单独拿不到地址、运营商换前缀后整晚断网。全文以术语为骨架 —— GUA/ULA/LLA 的区别、RS/RA/NS/NA 五种报文、PIO 的 L/A 两个比特、RDNSS 与 RIO 的用途与移动端天花板（accept_ra_rt_info_max_plen=64）、SLLAO 与 hop limit 255 为何是 iOS 的硬门槛、DNS64/NAT64 与 CLAT/PLAT 的分工、FakeIP 如何让纯 IPv6 客户端访问只有 A 记录的站点，以及 RFC 6724 源地址选择如何把流量送进旧前缀的黑洞。附完整缩写-全称-中文-RFC 对照表与十条复盘清单。"
summary: "从 RA/RDNSS/RIO 的术语出发，讲清家庭 IPv6 的三个真实坑：光猫抢当解析器、iOS 对 RFC 4861 的严格校验、运营商换前缀后的源地址黑洞；并给出用 FakeIP 让纯 IPv6 客户端访问 v4-only 站点的完整做法。"
tags: [IPv6, RA, Router Advertisement, RS, Router Solicitation, ND, NDP, 邻居发现, SLAAC, DAD, PIO, RDNSS, RIO, SLLAO, DNSSL, ULA, GUA, 链路本地地址, RFC4861, RFC8106, RFC4191, RFC4193, RFC6724, RFC4862, RFC8201, DNS64, NAT64, CLAT, PLAT, 464XLAT, RFC6877, FakeIP, TPROXY, 透明代理, 前缀漂移, prefix rotation, 源地址选择, 地址寿命, valid_lft, preferred_lft, iOS, Android, IpClient, accept_ra, 光猫, ONT, 路由器广告, DNS 污染, DoT, DoH, PMTU, PTB, MSS, ICMPv6, 家庭网络, 网络工程, 术语表]
