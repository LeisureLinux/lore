description: "Bloom Security 披露 npm Trusted Publishing 的一个验证缺陷，代号 SlugFest：npm 用人类可读的 GitHub 仓库 owner/name 来核验受信任发布者，而不是仓库不可变的数字 ID。于是当一个仓库被改名、转移或删除后，原名字可能被别人占用，攻击者只要在那个地址建一个仓库并配上预期文件名的工作流，就可能拿到不属于自己的包的发布凭证。研究者扫描出 1500 多个潜在受影响包，合计下载量超 1000 万次。GitHub 已于 10 月 2 日上线修复（未验证配置 48 小时后过期）。本文拆解这个缺陷的技术本质，并说明为什么 AI 编码代理会放大这类问题的后果。"
