title: "ByteDance 爬虫的假 Referer：aocr.org 引用的三层证据链"
date: 2026-11-06
slug: bytedance-aocr-referrer-crawler
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Tin Analytics《Getting traffic from aocr.org? That's ByteDance crawling your website》（Ege Demir，2026-10-29）全文，含其原始请求头、指纹对照组与网络归属数据；＋ 我用 APNIC RDAP 核对 AS132510 注册信息 ＋ 我在 ByteDance 开源的 lynx-family/lynx 仓库 develop 分支中定位到「forest」注释的原始代码 ＋ Oxylabs 官方文档核对端口 60000 ＋ Cloudflare 关于 AI 爬虫与未申报爬虫的公开报告"
original_date: 2026-10-29
original_url: "https://tin.computer/blog/aocr-org-referrer-bot"
description: "本文解读 Tin Analytics 于 2026 年 10 月 29 日发布的《Getting traffic from aocr.org? That's ByteDance crawling your website》：一个伪装成 Windows Chrome 146、用美国代理池轮换 IP、并伪造 www.aocr.org 作为来源引用的爬虫，如何被三层证据链钉在 ByteDance 的爬虫栈上。第一层是网络指纹：Tin 用 ClientHello 长度、HTTP/2 priority 权重、Accept 头三个特征同时比对，aocr.org 爬虫 199/199 请求全部命中，官方声明的 Bytespider 与 TikTokSpider 命中 57%，而其他所有流量只有 0.08%。第二层是浏览器内部字段：爬虫的会话录像里带 extensionTiming.forestResFrom、forestResLoadStart 与 htmlPredictorHit —— 我在 ByteDance 自己开源的 Lynx 仓库 develop 分支里找到了那行注释，确认「forest」确实是他们的资源加载器名。第三层是真实服务器位置：作者用一段只对该指纹生效的 WebRTC 探测代码，拿到 14 个 IPv6 地址（同一个 /64）与 2 个 IPv4，全部落在 AS132510 —— 我用 APNIC RDAP 核对确认该 AS 名称为 ShanXiMCC-IDC，注册实体是 China Mobile Communications Corporation，山西移动机房网络。作者还纠正了一个常见误读：可见的那 186 个美国地址是租来的代理池（187 次访问用了 186 个不同地址，端口只有 1180/40000/60000 开放，而 60000 正是 Oxylabs 文档里的专用数据中心代理端口），真实机器在中国。本文还记录了作者明确的边界：证明了「用了 ByteDance 的爬虫栈、服务器在中国」，但没证明「谁在运营」——可能是 ByteDance 团队，也可能是使用同一套浏览器技术的客户（原文举例火山引擎）。作者已于 10 月 29 日向 ByteDance 发出证据与三个问题，原文承诺会补充答复。"
published: true
