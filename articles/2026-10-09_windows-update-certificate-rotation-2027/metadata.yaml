description: "微软官方博客确认：Windows Update 用于建立可信连接的证书将在 2027 年 5 月 17 日和 6 月 19 日过期，需要轮换。不受支持的 Windows 版本届时将失去 Windows Update 访问权，收不到任何更新。但「Win7/Win10 是不是再没有任何安全更新了」这个问题的答案并不统一：Win7 的免费安全更新早在 2020 年 1 月就结束了；而 Win10 的消费者 ESU 被微软悄悄延长到 2027 年 10 月 12 日，比证书死线还晚。本文核对官方原文的逐版本动作表，澄清与 Secure Boot 证书过期（2026 年 6 月）的区别，并给出「要不要换 Linux」的判断框架。"
