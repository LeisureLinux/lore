title: "Rex 开源 OSC 7577：一条转义序列，让终端程序跨重启原地复活"
date: 2026-11-25
slug: rex-osc-7577-program-resume-protocol
category: 技术/解读
author: FreeLAMP.com
original_source: "Superlogical 官方《Program Resume Protocol (OSC 7577)》规范与 Rex《Resume Rules》文档（superlogical.com/rex/docs/build/program-resume、/rex/docs/customize/resume-rules）＋ Mitchell Hashimoto 2026-11-25 发布帖（与 Herdr 协作、多家终端作者审阅）。"
description: "解读 Mitchell Hashimoto 今天开源的 OSC 7577 终端程序恢复协议与 Rex 实现：OSC 转义序列上报 argv/pid/time/mac，终端验证后存为 record，重启后按规则重跑命令。讲清 token（OSC7577_TOKEN）如何防住 cat 文件和 ssh 远程输出伪造恢复、SHA-256 mac 为何不是 HMAC、time 60 秒窗口与 pid 生命周期、argv 按数据传递不经 shell 解析、Rex 的 Lua 白名单（command/flags/dir）、内置 Claude Code/Codex/OpenCode 规则与一键关闭。也点明边界：恢复的是命令而非进程现场，环境变量、shell 状态、飞行中的工具调用都不回来。"
published: true
