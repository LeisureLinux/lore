summary: "在 Linux 上给 iPod Nano 6（8GB，USB Mass Storage）加歌的一次记录。iPod Nano 6 走标准 USB 大容量存储协议，内核自带 usb_storage/vfat 即可识别，无需专用驱动。但识别不等于可写：用 rhythmbox/libgpod 删歌加歌时报 Could not write database to iPod: Unsupported checksum type 并段错误退出。根因是不同代 iPod 需要不同签名——Nano 3G/4G 用 HASH58、Nano 5G 用 HASH72、Nano 6G/7G 用 HASHAB（白盒 AES）；libgpod 0.8.3 源码里虽有 itdb_hashAB.c，写入路径并未真正支持 HASHAB，因此对 Nano 6G 报 Unsupported checksum type。Nano 5G+ 还改用压缩的 iTunesCDB（mhbd 魔数、zlib），libgpod 的处理路径也不完整。解法是 ipodsync：不碰 iTunesCDB，改写真机读取的 SQLite 库 iPod_Control/iTunes Library.itlp/*.itdb，并用纯 Python 实现 hashAB 给 Locations.itdb 生成 .cbk 签名，绕开 libgpod 的局限。实测 add/rm 闭环成功（自动附加封面、自动备份库）。FireWireGUID 从 USB 序列号自动取得。文中也记录了一处 AI 助手未查证就断言 Linux 无解的误判。"
description: "在 Linux 上给 iPod Nano 6 加歌的记录与原理分析。iPod Nano 6 是 USB 大容量存储设备，内核 usb_storage/vfat 原生识别，无需专用驱动。写库失败的根因：不同代 iPod 用不同签名（Nano 3G/4G=HASH58、Nano 5G=HASH72、Nano 6G/7G=HASHAB 白盒 AES），libgpod 0.8.3 未真正支持 Nano 6G 的 HASHAB，rhythmbox 报 Unsupported checksum type 并崩溃；Nano 5G+ 还改用压缩的 iTunesCDB（zlib），libgpod 写入路径不完整。解法 ipodsync：绕开 iTunesCDB，写设备真正读取的 SQLite 库（iTunes Library.itlp 下的 Library.itdb/Locations.itdb 等），Locations.itdb 用纯 Python 实现的 hashAB 签名生成 .cbk，FireWireGUID 从 USB 序列号自动取得。对比 gtkpod（老 GUI、初始化崩溃）、rhythmbox（依赖 libgpod 写库失败）、iOpenPod（PyQt6，Nano 6G/7G 用 WebAssembly 版 HASHAB）。实测 ipodsync add/rm 闭环成功，自动附加封面、自动备份。"
