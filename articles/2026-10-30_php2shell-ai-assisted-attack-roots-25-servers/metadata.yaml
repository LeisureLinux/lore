description: "Dream Security 于 10 月 25 日捕获了一次真实的在野攻击：攻击者把 PHP2Shell（自研非公开版本，打 PAN-OS 的 appweb 管理服务器，打 session.upload_progress 机制）与内核提权 CVE-2026-46300（Fragnesia，用页缓存写入覆盖 /etc/pam.d/su 为 pam_permit.so）串成单请求利用链，用 FOFA 从 19000 台暴露设备筛到 5000 台在线、240 台匹配地理与版本，批量 root 了 24 台 —— 其中 22 台只植入 103 字节 webshell 停着不动；随后专门攻破 2 台真正有价值的，建立 8 端口反向 SSH 隧道进入内网（藏在 /usr/local/lib/.panops/，用 systemd service + rc.local 持久化），root 后 90 分钟内拿下防火墙管理服务器（它集中管理全部防火墙的配置与凭据），解密 LDAP 服务账号密码，对 AD 发起用户枚举、密码喷洒与后门账号创建尝试。THN 报道补上了最关键的一层证据：攻击基础设施里安装了 Anthropic 的 Claude Code、持有 FOFA 的 API key、并配置了一个名为 aiscan 的 AI 驱动攻防平台（挂 DeepSeek 与 Kimi 的 LLM），近 40 个脚本的代码结构与注释风格一致性指向 AI 辅助开发。本文梳理完整攻击链、版本画像机制（需为 9 个版本各建 libphp.so 偏移画像，这也是 PoC 无法直接滥用的原因），并讨论「AI 辅助攻击」这个信号该如何解读 —— 真正的变化不是 AI 能写利用，而是它跨过了「从 PoC 到可靠攻击向量」那道坎；而代码风格一致性本身也成了新的取证指纹。"
