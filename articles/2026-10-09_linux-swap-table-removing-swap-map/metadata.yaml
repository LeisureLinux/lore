description: "LWN 的 Jonathan Corbet 拆解了 Kairui Song（腾讯）对 Linux swap 子系统的现代化改造。这个系列要把 swap map（一张每个槽位一个字节、记录引用计数的数组）彻底删掉，把它最后剩下的职能塞进新的 swap table。配套动作还包括移除 4.15 引入的 swap bypass、去掉被当作位锁使用的 SWAP_HAS_CACHE 标志。收益是元数据开销减少约 30%，1TB 交换文件省下 256MB 内存，同时解除「大 folio 只能在引用计数为 1 时换入」这个历史限制。"
