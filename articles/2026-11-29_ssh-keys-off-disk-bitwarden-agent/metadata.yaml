title: "SSH 私钥别再放磁盘：用 Bitwarden 的 agent 把密钥收进密码库"
date: 2026-11-29
slug: ssh-keys-off-disk-bitwarden-agent
category: 技术/解读
author: FreeLAMP.com
original_source: "jola.dev《You can't afford to keep your SSH keys on disk》（Johanna Larsson，2026-11-23）全文＋ raw HTML 补全 SSH_AUTH_SOCK/IdentityAgent 配置＋ 本号 2026-11-11 Secure Enclave SSH 密钥文章交叉核对。"
description: "解读 Johanna Larsson 把 SSH 私钥从磁盘挪进 Bitwarden 内置 agent 的实践：私钥不再被扫盘恶意代码窃取。给出完整步骤（Bitwarden 导入既有密钥的隐藏上传图标、启用 SSH agent 与授权策略、~/.ssh/config 的 IdentityAgent、shell 的 SSH_AUTH_SOCK、ssh-add -L 验证后删磁盘副本）与 git commit/tag 签名配置（gpg.format ssh、专用签名密钥、GitHub/Gitea/Forgejo 信任）。与 Secure Enclave 方案对比，补充风险边界：agent 授权间隔、备份验证后再删盘、agent 转发、硬件方案更强。"
published: true
