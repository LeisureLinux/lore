description: "Canonical 于 2026 年 10 月 15 日发布 Ubuntu 26.10（代号 Stonking Stingray）。这一版的四条主线是：完成 Rust coreutils 迁移、用 Sequoia PGP 替换 GnuPG 来验证 APT 仓库签名并引入量子安全 token 支持、扩展 TPM 全盘加密的硬件覆盖并以 dbus-broker 替换传统 D-Bus 实现、以及上线 RISC-V 桌面镜像（含首款 RVA23 硬件支持）。本文按「谁会受影响」组织这四条线，并指出其中两条容易被忽略的工程细节：dbus-broker 的按应用消息计费解决了什么，以及 TPM FDE 扩展到没有硬件信任根的机型意味着什么。"
