description: "HackiOS 是一个独立研究项目：在不改写 iOS 用户态任何字节的前提下，让苹果开源的 XNU 内核（xnu-8796.121.2，即 iOS 16.5 的内核）运行在安卓手机硬件与 QEMU 上，跑出真正的 launchd → backboardd → SpringBoard → 应用。要做到这一点，需要自制 EFI 加载器、自制 UEFI 移植、替换苹果闭源驱动、以及把 Linux 的 ath11k Wi-Fi 驱动跑在 FreeBSD LinuxKPI 兼容层上。本文梳理它的架构与真实边界：只在 POCO X5 Pro 5G（redwood / 骁龙 778G）一个机型上验证过、不刷机全在 RAM、两次 bootloop 的刷写失败史，以及项目自己写下的「仅限自有或明确授权设备」纪律，并顺带解读同团队的 Mali 页缓存 root 工具链与 CVE-2022-22706 / CVE-2024-1065 的页缓存利用技术。"
published: true
