summary: "翻译并解读 OMG! Ubuntu 关于 Ubuntu 26.10「Stonking Stingray」完成 Rust 版 coreutils 迁移的报道：cp/mv/rm 此前因 uutils 的 TOCTOU 漏洞暂缓，现上游修复后收尾；Canonical 自 2025 年「氧化」发行版，25.10 已让 sudo-rs 成默认。附带 uutils 与 GNU 的 drop-in 兼容说明、以及 NTP 重写计划。"
description: "基于 OMG! Ubuntu（Joey Sneddon，2026-09-13）报道的翻译+解读。要点：Ubuntu 26.10 完成向 Rust 版核心工具（uutils）的迁移，此前 cp/mv/rm 因 uutils 的 TOCTOU（time-of-check to time-of-use）竞态漏洞在 26.04 LTS 暂缓，上游修复后收尾；随附 ls/cat/chmod/du 等全套 Rust 工具。Canonical 自 2025 年起「氧化」发行版，看重 Rust 在编译期捕获内存 bug 的安全收益；25.10 首个默认搭载 Rust 工具并让 sudo-rs 成默认；26.04 前委托 Zellic 审计 uutils 发现那三个命令的问题；每年 €40k 赞助 Trifecta Tech Foundation（该基金会正在 Rust 重写 NTP，计划 27.10 成默认时间同步）。uutils 以「与 GNU 行为偏离即 bug」为设计原则，终端用户无功能差异。解读聚焦：TOCTOU 为何是 C 版 cp/mv/rm 的老难题、drop-in 兼容对脚本的实用含义、基础软件被逐个氧化的更大图景，以及「Rust≠绝对安全」的清醒提醒。beta 本月内、稳定版 2026-10-15。与本站 coreutils 105 命令手册、9.12 发布稿形成系列。"
