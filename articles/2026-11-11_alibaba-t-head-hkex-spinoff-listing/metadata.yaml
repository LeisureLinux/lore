description: "本文核对 2026-11-10 阿里在港交所发布的官方公告全文，指出媒体标题「阿里宣布计划让平头哥上市」把事件阶段写早了：平头哥早在 9 月 11 日就以保密形式递交 A1 表格申请 H 股主板上市，11 月 10 日只是港交所依据上市规则第 15 项应用指引确认阿里「可进行建议分拆」，后续仍需港交所上市委员会批准、中国证监会备案及双方最终决定，公告明写「无法保证会否落实或何时落实」，且未披露发售规模、架构与时间表。公告里真正被忽略的是控制权与治理细节：分拆完成后预期平头哥仍为阿里子公司；因最高适用百分比率低于 5%，不构成须予披露交易，也不影响阿里港交所与纽交所双重主要上市地位；阿里还申请并获豁免 PN15 第 3(f) 段「向现有股东提供保证配额」的要求，理由涉及美国证券法注册义务、中国法律对全球发售前既有股份的禁售、以及分拆对集团不重大。分拆的四项理由全部围绕估值可见性与独立融资渠道（股权、债务、银行授信），不是业务剥离。文章也梳理平头哥真实产品线（玄铁 RISC-V、倚天服务器 CPU、含光 AI 芯片、镇岳 SSD 主控、真武 AI 加速器、无剑 SoC 平台、羽阵 RFID）与 9 月 22 日阿里云官方发布的真武 V900 规格（216 GB 显存、1200 GB/s 片间带宽、FP8/FP4、相对 5 月 M890 三倍性能、2027 Q1 量产、650+ 客户、50 万卡超节点），并区分两个容易混淆的「三倍」以及 560,000 颗出货的口径。最后把三类数字按性质分开：官方确认的事实、机构估值（野村 850 亿美元）、媒体传闻（2027 年募资 20–30 亿美元、20–30 亿美元估值），并接上阿里三年 3800 亿元 AI/云投入与 2026 年 3 月财报会「算力供应保障」的表述，解释分拆的资本逻辑。"
published: true
