original_source: "一手核对：阿里巴巴集团港交所公告《建议分拆平头哥于香港联合交易所有限公司主板独立上市》（2026-11-10，中英两份 PDF，data.alibabagroup.com/ir_filings/HKEX/09988/）全文 5 页 ＋ 阿里投资者关系 HKEX 公告索引 ＋ CNBC《Alibaba announces plans to list T-Head, its Nvidia chip rival》（Evelyn Cheng，2026-11-11）＋ WSJ / Bloomberg / Reuters / SCMP / 澎湃新闻 / 联合早报同期报道 ＋ 阿里云官方《Alibaba Unveils Roadmap on Full-Stack AI Strategy》（2026-09-22，含真武 V900 规格与倚天 CPU 路线图）＋ Reuters 2026-09-22 与 2026-05-20 报道 ＋ 阿里云 2025-02-24 关于三年 3800 亿元 AI/云基础设施投入的官方博客 ＋ 野村 850 亿美元估值（WSJ 转述）、IFR/彭博 2027 年募资 20–30 亿美元等二手口径的出处核对"
