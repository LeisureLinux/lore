description: "AMD 编译器工程师 Venkataramanan Kumar 向 GCC 提交两行补丁，将 Zen 4/Zen 5 成本表中的分支预测错误成本从 COSTS_N_INSNS(2) 上调到 COSTS_N_INSNS(2)+3，在 SPEC CPU 2017 的 544.nab_r 基准上给 Zen 5 带来 12%、Zen 4 带来 9% 的性能提升。本文解读编译器成本表、分支 vs 条件传送的权衡、流水线深度与分支预测代价的关系，并对比 Intel Lili Cui 在 2026 年 6 月对通用 x86 调优所做的同类改动（Granite Rapids +12.7%、Zen 5 +12.1%），指出 GCC 成本表长期低估现代 CPU 分支预测代价、编译器调优滞后于硬件这一行业老问题。"
