summary: "AMD 工程师向 GCC 提交两行补丁，把 Zen 4/Zen 5 分支预测错误成本上调 3 个单位，在 SPEC CPU 2017 的 544.nab_r 上带来 Zen 5 +12%、Zen 4 +9% 的增益。本文从编译器成本表、流水线深度与通用 x86 前例三个角度做技术解读。"
