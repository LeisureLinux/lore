summary: "整理 Hacker News 讨论帖（jakemanger 2026-09-17，311 分 / 266 评论）：用户发现 Neovim 官网捐款比特币地址 2023 年收到一笔 10 BTC（现约 80 万美元），自 2019 年后未再转出；高赞分支转向上讨论大额 BTC 密钥管理（Shamir 分片、门限签名 / FROST、3/5 恢复仪式、社会恢复钱包落地的现实阻力）。解读聚焦两点：开源项目的沉睡链上资金与制度化保管，以及单点私钥 = 单点故障、工程方案成熟但难落地。"
description: "译介 Hacker News 帖《Neovim have a ~$800k Bitcoin donation sitting untouched since 2023》(jakemanger 2026-09-17, 311 points/266 comments) 并加工程解读。事实：Neovim 官网底部比特币捐赠地址 1Evu6wPrzjsjrNPdCYbHy3HT6ry2EzXFyQ 于 2023 年收一笔 10 BTC（按当前价约 $800k），地址上次转出为 2019 年；norcalli/ashkankiani 称其 2019 年写内置 Lua LSP 仅拿约 $3k，justinmk 补千人年打磨投入。密钥管理分支：matesz 问交易所如何防单人失踪；jackb4040 曾任交易所岗，确认用 Shamir 分片+手搓 3/5 恢复仪式、社会恢复钱包未起量；ecesena 指门限签名优于 Shamir（多服务器协作签名、无需单点重建私钥），ed25519 链用 FROST、ECDSA 链近期有解；pests 提 ERC7093 标准化社会恢复；krageon 指大所靠法院裁定转移。解读：①捐赠名义价值与现值落差（币价把 2023 的 10 BTC 涨成巨款）、开源账面资金与真实开发成本不匹配、需制度化接收/保管/动支链上资产；②单点私钥=单点故障，Shamir→门限签名/FROST 演进，3/5 破玻璃仪式，难点在流程与执行而非密码学。"
