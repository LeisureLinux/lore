title: "CachyOS 十一月版：给 EAC 游戏一套独立签名内核"
date: 2026-11-25
slug: cachyos-november-2026-eac-recovery
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix《CachyOS November 2026 Released With EAC Linux v2 Support, New Recovery Tool》（Michael Larabel，2026-11-22）＋ CachyOS 官方博客《CachyOS November 2026 Release》（2026-11-22，完整特性/修复清单与 ISO 下载）＋ Phoronix《CachyOS Package Installer 2.0》＋ 本号 CachyOS/Omarchy 跑分文章交叉核对。"
description: "解读 CachyOS 2026 十一月 ISO（年内第六版）：为 EAC Linux v2 提供独立 linux-cachyos-eac 内核与同密钥签名的 systemd-boot、eac-setup/eac-status；新增 cachyos-recovery 自包含恢复环境（UEFI 直启、Btrfs 快照可写试启再回滚、约 70MB ESP、支持 LUKS）；cachyos-drm-awaiter 取代 early KMS/nvidia-module-loader；安装器迁移到 gucc；Package Installer 2.0 加 AUR/Flatpak/AppImage（opt-in）与 PKGBUILD 静态分析；Linux 7.3.5、NVIDIA 620.73.04、Mesa 26.3.1、Rust Binder/ThinLTO、WSL 镜像；附现有用户 pacman -Syu 后 chwd -a -f 的手动步骤。"
published: true
