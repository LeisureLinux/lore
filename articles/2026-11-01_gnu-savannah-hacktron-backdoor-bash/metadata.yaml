description: "2026 年 3 月 7 日发布的 Savane 3.17-c369 里有一个命令注入漏洞：它把用户账户的邮箱地址拼进一条交给 gpg 的 shell 命令字符串里，于是注册一个邮箱里带反引号与 ${IFS} 的账号，再点一下完全正常的「测试 GPG 密钥」功能，命令就会以 web 服务用户身份在服务器上执行。Hacktron 用它拿到了反向 shell、读出明文数据库凭据、把自己的账号设成 superuser、冒充了 Bash 维护者 —— 确认可以把带 push 权限的 SSH 公钥加进上游 Bash 仓库 —— 然后停手了。提权那一步用的是 2023 年的两个 OverlayFS 漏洞（CVE-2023-2640 / CVE-2023-32629），而 Savannah 跑的 Trisquel 11 的 5.15 内核直到 2026-05-07（USN-8255-1）才拿到修复 —— 比报告早 4 天，而 5.19/6.2 早在 2023 年就修了。文章完整核对了 Hacktron 的技术分析与 FSF 官方事件报告全文，还记录了 FSF 的逐条复核结论：8 个公开 finding 中 2 个 XSS 被判定为误报、HCK-006 的实际影响比原标签更有限、以及 FSF 选择「重构而非逐个打补丁」并主动通知了另一个公开 Savane 实例的运营方；同时明确 FSF 的结论是「未发现敏感项目数据或凭据被访问，也不认为软件供应链被破坏」。"
published: true
