title: "virtme-ng 不重启宿主机：换的是虚机里的内核"
date: 2026-11-10
slug: virtme-ng-no-host-reboot-guest-kernel
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：arighi/virtme-ng 官方 README 与 Examples（v1.42，PyPI）＋ Debian unstable 的 vng(1) man page（2026-11-04）＋ Kernel Recipes 2024 技术介绍 ＋ 本机只读实测（libvirt 11.3.0、现有域 XML 的 direct kernel boot 结构、QEMU / KVM / busybox / /boot/vmlinuz-* 可读性）＋ libvirt / Red Hat 关于 Direct Kernel Boot 的官方文档"
original_date: 2026-11-10
original_url: "https://github.com/arighi/virtme-ng"
description: "本文把 virtme-ng 介绍清楚，并纠正一个容易被宣传语带偏的理解：它不重启的是宿主机，换掉的是 QEMU 虚机里的内核。官方 README 自己也写得明白——内核自动启动在一个虚拟化环境里，那是当前系统的写时复制精确副本；exit 就回到真实系统。所以它每次都是新起一个 QEMU/microVM 进程，从虚机生命周期看，与 libvirt 里 virsh edit 改 kernel/initrd/cmdline 再 start 没有区别。对本来就跑 libvirtd 的人来说，不重启换内核这个痛点本来就不存在。本文据 man page 把 --run/-r 的六条不编译路径逐条列出（不带参数启动宿主同版、已安装版本编号、v6.6 自动下载 Ubuntu mainline 预编译内核、本地 bzImage/目录、dpkg -x 解出的发行版内核、--root-disk 独立磁盘镜像），说明要重新编译内核只属于 --build 这一条路；同时指出它相对改 XML 真正的增量只有一条：用宿主机根文件系统的写时复制快照当 rootfs，连同内核模块一起只读导出，省掉准备测试镜像与模块匹配。文章也如实列出它少的那部分：guest 默认跳过 udev/tmpfiles、最小 config 内核缺大量功能、--rw 会真写回宿主机、virtiofs 的 POSIX ACL 已知坑，以及本机实测的依赖状况（QEMU/KVM/busybox/5 个可读 vmlinuz 齐备，缺 virtiofsd 会退回 9p，vng 未安装）。"
published: true
