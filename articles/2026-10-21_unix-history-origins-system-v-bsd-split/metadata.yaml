description: "Unix 有两大阵营这件事，通常被解释成技术路线的分歧。而我认为更准确的解释是：它是三份法律文件的副产品。1956 年的反垄断同意令让 AT&T 不能卖 Unix，只能送源码，于是它传播到了大学；1983 年 AT&T 被拆分后终于可以卖，于是它回头和自己的衍生物竞争；1995 年卖 Unix 业务时的一份版权排除条款，造就了后来十八年的 SCO 诉讼。本文是第一篇，讲 1969 到 1993 的起源与分裂。"
