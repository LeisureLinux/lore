summary: "本文为 Sreenivas Makam《企业 AI 采用》系列第二篇，将前三篇中提出的七大要求转化为参考架构。核心洞察：企业 AI 无法通过单一产品治理，必须为模型网关流量和托管应用流量分别设置控制路径（一体双轨）。详解身份治理、凭证隔离、数据策略路由、智能体运行时等 11 个构建模块与五大原则，并对比云原生平台、专用网关、自托管推理等实现选择。"
description: "翻译自 Sreenivas Makam https://sreeni.blog/2026/07/11/a-reference-architecture-for-governed-enterprise-ai/。本文定义企业 AI 参考架构的 11 个构建模块（身份与生命周期、托管应用治理、工作负载密钥、模型网关、提供者平台、策略护栏、路由弹性、智能体框架、FinOps、知识检索、监控审计）和五大原则（集中策略不集中决策、分离三类身份、凭证与应用隔离、数据策略成为路由一部分、复杂性按需增长）。核心结论：云原生平台适用于单一云场景，多提供者/跨团队治理需要专用网关；网关不应包含所有业务逻辑，回退方案必须满足相同数据合规；FinOps 演进路径为计量→预算归属→预测优化→分摊。"
