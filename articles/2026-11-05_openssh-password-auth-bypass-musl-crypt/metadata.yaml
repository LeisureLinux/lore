title: "一个 CA 说了「4」，一个 C 库对超长密钥返回「*」：OpenSSH 认证绕过如何在 Alpine 上凑齐"
date: 2026-11-05
slug: openssh-password-auth-bypass-musl-crypt
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：Alpine Linux 官方安全公告（2026-11-05）＋ OpenSSH 上游修复 commit 4353fdc43ef646c43a8dda7025cc1a898caf1482（Damien Miller，2026-11-04，「avoid password authn bypass」）及其父提交对比 ＋ musl libc 的 crypt_sha256.c / crypt_sha512.c / crypt_des.c 源码（KEY_MAX 256 与错误返回 \"*\"）＋ openssh-portable 的 openbsd-compat/xcrypt.c 修复前版本 ＋ Alpine 包站 openssh 10.6_p2-r0（build time 2026-11-05 09:05:19）＋ OpenSSH 10.6 release notes"
original_date: 2026-11-05
original_url: "https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/"
description: "本文解读 2026 年 11 月 5 日 Alpine Linux 官方公告的 OpenSSH sshd 密码认证绕过：攻击者只要能连到你的 SSH 端口，不需要知道任何密码就能登录 —— 一次连接，必成功，无需重试。⭐ 机理是一条由三个独立环节凑齐的链：① 攻击者需要一个密码字段为 * 的账号（无密码账号的正常表示，⭐ 而 Alpine 基础镜像里 root 自 3.16 起就是 root:*）；② 机器上至少还要有另一个用 $5$/$6$ 哈希的账号（⭐ 一个带密码的用户，就让所有无密码账号变得可达）；③ 攻击者发送一个 257–1024 字节的超长密码。⭐ 而真正的机关在 musl 的 crypt()：key 超过 256 字节时它返回字符串 * 作为错误指示符（⭐ musl 源码注释：key limit is not part of the original design, added for DoS protection），⭐ 而 * 恰好正是每个「无密码账号」存储字段的内容，于是「哈希」与存储值相等，登录成功。⭐ 而「借 salt」是必要条件：OpenSSH 对密码字段太短、装不下 salt 的账号会借用另一个账号的 salt，⭐ 这才把两个无关账号耦合起来。⭐ 本文还核对了 OpenSSH 上游修复 commit（⭐ 提交者的注释很关键：We do not consider the root cause to be within OpenSSH but we are well equipped to avoid it），⭐ 逐行比对了修复前后的 openbsd-compat/xcrypt.c（⭐ 加了 MIN_PASSWORD_HASH_LEN 4 长度下限、freezero 清零、xstrdup 避免 double-free，⭐ 并在 pick_salt() 遍历全系统账号的循环里也加上 freezero），⭐ 以及 Alpine 给出的逐分支修复版本表（⭐ 从 edge 的 10.6_p2-r0 一直到 3.16 的 9.0_p1-r6）与「升级包不重启守护进程」这个必须强调的操作点。⭐ 文章还记录了最刺眼的一条推论：官方 tiny-cloud 镜像出厂时是安全的（还没有任何 $6$ 哈希），⭐ 而管理员设一个控制台密码、或 user-data 里加一个带 hashed_passwd 的用户，⭐ 就会把它推进可被利用状态 —— ⭐ 「多设一个密码」这个正常心智模型里提高安全性的动作，在这里降低了安全性。"
published: true
