summary: "GRR（Google Rapid Response）是谷歌开源的应急响应与远程实时取证框架，能把'在某台机器上执行的动作（Flow）'批量撒向成千上万台主机（Hunt），并能与 osquery 深度集成，用 SQL 查询全网主机。本文面向安全入门同学，讲清 Flow/Hunt/Artifact 三大核心概念、客户端部署、osquery 集成与安全注意事项，并用一个勒索软件全网排查案例把整个流程串起来。"
description: "介绍谷歌开源应急响应框架 GRR。核心概念：Flow（单机最小工作单元）、Hunt（把 Flow 批量执行到全网主机）、Artifact（取证数据打包）、VFS 虚拟文件系统；并重点讲解与 osquery 的 SQL 查询集成、客户端部署与自我保护机制、API 自动化、Splunk/BigQuery 输出、应急代码推送，以及'拥有服务端≈全网 root'的安全权衡。配实战案例：勒索软件全网排查。适合安全入门读者理解现代 EDR/取证工具的设计思想。"
published: true
