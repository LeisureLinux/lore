title: "Wildcat Lake 上的系统之争：CachyOS 小胜 Windows 11，Ubuntu 26.04 落后约 10%"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "Windows", "CachyOS", "Ubuntu", "基准测试", "性能对比", "Wildcat Lake", "译文"]
source: "https://www.phoronix.com/review/wildcat-lake-windows-linux"
author: "LeisureLinux"
summary: "Phoronix 在 449 美元的 CHUWI UniBook（Intel Core 3 304 / 8GB 内存）上对比了 CachyOS、Windows 11 Pro 与 Ubuntu 26.04 LTS。综合约百项基准：CachyOS 比 Windows 11 快约 6%，Windows 11 又比 Ubuntu 26.04 快约 10%。图形驱动是 Windows 领先的主因，编码/压缩等 headless 负载上 Linux 已能打平甚至占优。"
