original_source: "⭐ 一手核对：FreeRDP 官方 GitHub Release 3.33.0（2026-11-02）+ freerdp.com 官方发布博客 + 仓库 ChangeLog + GitHub API 提交/比较/安全公告数据 + Phoronix 原文"
original_date: 2026-11-02
original_url: "https://www.phoronix.com/news/FreeRDP-3.33"
description: "本文解读 FreeRDP 3.33（2026-11-02 发布）的两条主线：一条是技术上的 —— RDP 客户端第一次可以编译成 WebAssembly 跑在浏览器里（SDL3 客户端 + Emscripten + WebCodecs 解 AV1/H.264 + Web Audio 麦克风 + 浏览器剪贴板 + WebAssembly SIMD），以及 UDP 直连、Unicode 键盘管道、Windows shadow server 复活、macOS 免 FUSE 文件剪贴板；另一条是治理上的 —— 官方发布公告罕见地写下「PR 和 bug 反馈的涌入非常大，很快会发一个补丁版」，这是 AI 生成 PR 淹没开源维护者的一手现场证据。文中用 GitHub API 实测数据做交叉验证：3.33.0 距上一版 3.32.2 有 748 个 commit（对比 3.31.0→3.32.0 是 476、3.32.1→3.32.2 是 290），新增 20 位首次贡献者，仓库内 Assisted-by 标记仅 2 处。本文明确标注：发行说明列出的 13 条 GHSA 安全公告在官方发布当天尚未公开（GitHub 与 freerdp.com 都注明「Advisories will be published days/weeks after the release, so links are 404 until then」），因此不列 CVE 编号、不评严重度，并用同期已公开的 FreeRDP CVE 做背景对照（CVE-2026-110837 / CVE-2026-111880 / CVE-2026-109242）。"
published: true
