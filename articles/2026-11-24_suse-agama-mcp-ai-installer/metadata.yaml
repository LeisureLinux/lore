title: "SUSE Agama 接入 MCP：AI 代理能装系统，但默认关着"
date: 2026-11-24
slug: suse-agama-mcp-ai-installer
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix 报道（Michael Larabel，2026-11-24）＋ 一手核对 Agama 官方博客《The first AI-ready OS installer》（2026-11-24）与 agama-mcp README（工具清单、内核参数、token 隔离实现）。"
description: "解读 SUSE Agama 安装器从 26 版起内置 MCP server：硬件探测、配置校验、安装方案、执行与监控暴露成标准 MCP 工具，让 AI 代理驱动裸机部署。讲清两种模式（config 只允许看和改配置、full 才允许 commit_install/reboot）、四层确定性护栏（JSON Schema 校验、方案验证、专用 MCP token 隔离、可观测性）、11 个工具与 1 个资源、inst.mcp=config/full 内核参数默认关闭、token 只能走 /mcp 不能碰 /api、日志自动过滤密码，以及自签 TLS 要 NODE_TLS_REJECT_UNAUTHORIZED=0 的坑。"
published: true
