description: "Red Hat 的 Christian Schaller 在博客里记录了他用 Claude Code 为两台硬件写 Linux 驱动的过程：一台是芯片组换了、没有 Linux 支持的 Plustek 8200i 底片扫描仪，另一台是联想 ThinkPad X1 Carbon 上出图发暗的 MIPI 摄像头。真正值得注意的是他公开的方法论 hw-harness：在 KVM 虚拟机里跑厂商的 Windows 驱动并把真机透传进去，同时在 Linux 宿主上用 usbmon 抓包，然后对比两条 trace 找差异。本文还原这套方法为什么有效，以及它对「AI 能不能写驱动」这个问题给出的实际答案。"
