original_source: "SPDX License List 与弃用标识符 ｜ OSI 许可目录（含 Superseded / Non-Reusable 标注）｜ GNU 官方许可文本与 FSF 兼容性说明 ｜ Linux 内核 COPYING / LICENSES 的 GPL-2.0-only 声明 ｜ Apache-2.0 全文 ｜ Mozilla MPL-2.0 FAQ 与《MPL-in-GPL Developer Guidelines》｜ Eclipse EPL-2.0 FAQ 与 FSF 收录说明 ｜ Chromium 官方 Audio/Video 支持页 ｜ choosealicense.com 条件矩阵 ｜ Asahi Linux《Progress Report: Linux 7.3》（2026-11-07）｜ 本号 Asahi 改 GPL 与《SaaS 软件 IP 大减值》两篇"
original_date: 2026-11-11
description: "一份尽量完整的开源许可证对照长文：按「版本 → 条件 → 兼容性」梳理 GPLv2/v3、AGPL、LGPL、Apache-2.0、MIT、BSD 4→3→2→1→0、MPL-2.0、EPL-2.0、CDDL、Unlicense/0BSD/Boost/ISC/Zlib、以及 SSPL/BSL/Elastic License 2.0 这类 source-available 非开源许可。硬性区分 -only / -or-later 与 SPDX 已弃用的裸标识符（GPL-2.0 / GPL-2.0+ / GPL-3.0 / LGPL-2.1 / AGPL-3.0 等），解释 Linux 内核为何是 GPL-2.0-only 而 Asahi 2026 转的是 GPL-2.0-or-later。逐条讲清 GPLv3 相对 v2 新增的专利授权/反 Tivoization 安装信息/DRM/Apache-2.0 单向兼容/§7 附加条款/30 天治愈期、AGPL §13 补的网络服务洞、MPL 的文件级 copyleft 与 §3.3 Larger Work、EPL 的 secondary license 开关、BSD-4-Clause 广告条款为何与 GPL 不兼容、以及 WINE 2002 从 MIT 改的是 LGPL 而非 GPL。给出五问选型决策树、「许可证管不到什么」六条（读进去再改写/商标/专利担保/漏洞担保/贡献者版权归属/网络服务）、常见项目实际许可速查表（Linux、Git、GCC、glibc、WINE、Firefox、Chromium、Kubernetes、Rust、ZFS、Eclipse、MongoDB、Terraform、Redis、OpenSSL、SQLite、Asahi、Omarchy），并以三条规则收尾：先看 -only/-or-later、兼容性单向、别把许可当护城河。文末附完整 Sources 与事实边界说明：兼容性矩阵是实务简表不是法律意见，双许可/版本迁移/部分组件不同许可请以项目仓库 LICENSE 为准。"
published: true
