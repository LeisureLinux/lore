summary: "很多服务只给两个选项：只听 127.0.0.1，或听所有网卡（0.0.0.0 / *）。当你想要中间那一档「只听内网」时，它们帮不上忙。本文记录一个通用解法：让服务退回只听 127.0.0.1，再用 socat 在指定的内网地址上补一个口。实测确认三个关键事实：① 写代码里的 httpProxyListenLAN: true 会绑定 *:8888（同时含 IPv4 0.0.0.0 与 IPv6 [::]），在有公网 IPv6 的机器上等于把内网服务直接暴露给整个互联网；② 从二进制提取 JSON tag 确认该服务只有布尔开关，没有「绑定指定地址」选项，且日志字符串里只有 0.0.0.0 和 127.0.0.1 两个硬编码地址；③ bind=<具体内网 IP> 不会产生任何 [::] 监听（对照实验：IPv6 监听数为 0），而 bind=0.0.0.0 会重新暴露，同一端口在不同地址上可共存（方案可行性前提）。改造后：本机与内网均可用，公网 IPv6 不可达。附通配监听审计命令。"
description: "一次真实的 IPv6 暴露面收敛复盘。问题：代理客户端的 httpProxyListenLAN: true 让它绑定 *:8888，从公网 IPv6 直接可用（实测 curl --socks5-hostname 返回 200）。根因：该服务只有布尔开关，无绑定指定地址选项——从二进制提取的 JSON tag 仅 httpProxyListenLAN/httpProxyPort，日志字符串仅 0.0.0.0:%d 与 127.0.0.1:%d 两个硬编码地址。解法：① 服务改回 httpProxyListenLAN: false 只听 127.0.0.1；② 新建 systemd 单元用 socat TCP4-LISTEN:8888,bind=<LAN_IP>,fork,reuseaddr 转发到 127.0.0.1:8888，与 mieru.service 用 After/Requires 关联；③ 启用后验证。三个实测要点：bind=<内网IP> 时 IPv6 监听数为 0（write 0.0.0.0 则前功尽弃）、同一端口可在 127.0.0.1 与内网 IP 上共存（内核按地址+端口组合绑套接字）、转发链全程在回环内不经过网络接口。改造对比表：改前本机可用+内网可用+公网 IPv6 可达；改后本机可用+内网可用+公网不可达。适用场景泛化：任何只有「全网/本机」二选一的服务（数据库 bind-address 失效、开发服务器 --host 0.0.0.0 等）。附通配监听审计命令 ss -tlnH | awk '{print $4}' | grep -E '(通配监听)'。核心教训：0.0.0.0 和 * 不是「内网」而是「所有接口」，在有公网 IPv6 的机器上等于公网开放。"
