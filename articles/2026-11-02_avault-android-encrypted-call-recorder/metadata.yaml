description: "AVault 是一个 2026-10-31 才创建、已经拿到 498 star 的开源 Android 项目：用 Shizuku 的 rootless ADB shell 桥接拿到 CAPTURE_AUDIO_OUTPUT 与 MANAGE_ONGOING_CALLS 特权，绕过 Android 14+ 对原生通话录音的限制，录到的音频用硬件 KeyStore 里的 AES-256-GCM 主密钥加密成 .vault 容器。本文逐行核对了它的加密实现（KeyStore AES/GCM/NoPadding、12 字节 SecureRandom IV、128 位 GCM Tag、UID 绑定主密钥、编码经 MediaMuxer 直写 .vault 的 FD因而中途不落明文），并核对出三处「文档与代码不一致」：① README 的容器格式图写的是 4 字节 \"AVLT\" + 1 字节版本号，代码实际是 8 字节 \"AVAULT01\"（SECURITY.md 与代码一致，只有 README 过时），且这意味着 README 宣称的「为密码学迁移预留版本位」实际上不存在；② README 说 PBKDF2 迭代 100,000 次，代码是 150,000 次（更强，文档没跟上）；③ README 宣称的「零明文播放」——「volatile memory 内的 POSIX FD、播放停止瞬间密码学擦除」—— 实际实现是解密到 cacheDir 下的临时 .ogg 文件后普通 delete，全仓库搜不到任何 zero-fill / shred / RandomAccessFile 覆写代码，因此「冷启动/内存转储」这一栏的威胁模型并不成立。本文还指出两处 README 威胁模型未覆盖的风险：通话另一端无法同意、以及 Shizuku 守护进程（UID 2000 shell 身份）本身就是这个方案的信任根。结论是：加密保存那一步扎实可信，「零明文」那一步宣传过头了；而更根本的观察是 —— 当 OS 把通话录音列为受限能力后，所有合规需求只能靠「非官方特权通道」满足，而这条通道的安全等级恰好等于它所替代的方案。"
published: true
