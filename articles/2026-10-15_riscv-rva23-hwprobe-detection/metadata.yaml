description: "RISC-V 的 RVA23 配置文件（profile）是减少生态碎片、让现代 RISC-V 二进制可分发的前提，Ubuntu 等发行版已经强制要求它。但直到 2026 年 10 月，用户和程序都没有一个「一次问清」的办法来判断自己的机器是否符合 RVA23。Qualcomm 工程师 Guodong Xu 的补丁把 RVA23U64 位通过 hwprobe 暴露出来，一行调用就能回答这个问题。本文解释为什么这个「小改动」实际上解决的是 RISC-V 生态里一个结构性难题：x86 和 Arm 各自的基线由谁来计算、怎么计算。"
