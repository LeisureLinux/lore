title: "批驳「别再建 swap 分区了」：swap 文件和 swap 分区到底差在哪"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "内核", "swap", "内存管理", "mTHP", "系统调优"]
source: "https://gist.github.com/joshenders/c4960cec9c63a7b7d68ffa9543356c43"
author: "LeisureLinux"
summary: "swap 文件与 swap 分区在 4K 页直接 IO 路径上确实几乎等价，但内核里有 5 处分叉：大页 swap slot 只对块设备开放（2024 年新能力）、物理布局不保证连续、CoW FS 约束、可用时机与 TRIM、运维可见性。桌面用 swapfile 没毛病，靠的是负载模型而非等价。"
