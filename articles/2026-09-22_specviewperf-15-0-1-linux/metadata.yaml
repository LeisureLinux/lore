summary: "译介 Phoronix 报道（Michael Larabel，2026-09-22）：SPEC 在 2025 年 5 月推出 SPECViewPerf 15 作为业界标准工作站显卡基准最新大版本，首发仅 Windows；今日发布 SPECViewPerf 15.0.1 的 Linux 原生构建，相比上一个 Linux 版本（SPECViewPerf 2020）是大更新，同时提供 x86_64 与 AArch64。但 Windows 版 15 已支持 DirectX 12 与 Vulkan，Linux 版 15.0.1 仅支持 OpenGL 4.5。Larabel 将用其做后续工作站 GPU/驱动评测。解读：Linux 短板被补上但仍是二等公民（跨平台数字不可直接比，须标注 API 口径）；AArch64 官方构建让 Arm 工作站/Apple Silicon 有可复现标准图形基准；滞后根因是视图集回放 ISV 应用（Maya/SolidWorks/CATIA）真实渲染流、重心在 Windows，反映专业图形生态重心仍在 Windows；对普通用户无感，但对 NVIDIA/AMD/Intel 的 Linux 工作站驱动验证与回归测试是权威必要工具。"
description: "译介 Phoronix《SPEC Releases SPECviewperf 15.0.1 For Linux》(Michael Larabel, 2026-09-22) 并加工程解读。事实：SPECViewPerf 15 于 2025-05 作为业界标准工作站显卡基准最新大版本推出，首发仅 Windows；SPECViewPerf 15.0.1 Linux 原生构建今日发布，相比上一 Linux 版(2020)为大更新，提供 x86_64 与 AArch64；Windows 版 15 已加 DX12+Vulkan，Linux 版 15.0.1 仅 OpenGL 4.5；Larabel 将跑 15.0.1 做后续工作站 GPU/驱动评测。解读：①Linux 短板补上但仍二等公民——同一卡两 OS 渲染路径不同(OpenGL vs DX12/Vulkan)，跨平台数字不可直接比，须显式标注 API 口径否则误导；②AArch64 官方构建让 Ampere/富士通 MONAKA/Apple Silicon(Aahi/Linux 或虚拟机)有可复现专业图形基准；③滞后根因：视图集回放 ISV 应用(Maya/SolidWorks/CATIA/SNX/Creo/medical/energy)真实渲染流，这些专业应用重心在 Windows，Linux 版需重适配；④对游戏玩家无感(有 3DMark/游戏内 benchmark)，但对 GPU 厂商 Linux 驱动的工作站性能验证与回归测试是必要权威工具。关联：与长鑫3D NAND/华为122TB SSD 同属「中国/专业图形生态重心仍在 Windows 或美国厂商」的结构性现实。"
