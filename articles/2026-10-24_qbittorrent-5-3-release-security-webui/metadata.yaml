description: "qBittorrent 5.3.0 于 2026-10-20 发布，距 5.2 五个多月。功能清单很长（匹配所有分享限速、IP 段封禁、magnet so 参数、I2P PeX、WebTorrent STUN、WebUI 虚拟列表与 RSS 导入导出），但真正值得升级的理由是安全修复：WebUI 反向代理模式下 X-Forwarded-For 客户端地址解析导致子网白名单与登录失败封禁可被绕过；邮件通知存在 SMTP 注入；tracker announce 可无认证无限增长内存；动态 DNS 走明文 HTTP。本文逐条拆解这些 PR 的成因与修复方式。"
published: true
