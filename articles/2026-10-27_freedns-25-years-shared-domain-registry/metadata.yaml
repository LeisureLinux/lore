description: "FreeDNS（freedns.afraid.org）2001 年起源于创始人 Joshua Anderson 的域名爱好，如今是 716 万会员、1383 万条记录、127 万个 zone 的公共 DNS 服务，每月处理超过 70 亿次查询。本文梳理它的商业模式（不投广告，用付费会员的钱养服务器）、共享域名注册表这一独特机制、二十五年新闻档案里的 DDoS 史与 mooo.com 三次被注册商暂停的记录，以及它的隐私承诺与今天被同类服务衬托出的价值。"
