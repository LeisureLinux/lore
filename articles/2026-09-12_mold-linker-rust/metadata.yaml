title: "Mold 高速链接器正在用 Rust 重写，目标成为 Linux 默认链接器"
date: "2026-09-12"
category: "Linux"
tags: ["Linux", "Rust", "Mold", "链接器", "编译工具链", "译文"]
source: "https://www.phoronix.com/news/Mold-Linker-In-Rust-Coming"
author: "LeisureLinux"
summary: "Mold 2.42.1 发布，作者 Rui Ueyama 透露 Mold 3.0 将从 C++ 整体重写为 Rust，并立下成为 Linux 默认链接器 /usr/bin/ld 的野心。过去二十年快链接器层出不穷，系统链接器却仍是 GNU ld；Rui 自认对此有责任，3.x 系列最高优先级是补齐 linker script、支持内核/固件链接、做跨发行版兼容性，并探索增量链接。"
