description: "Omarchy 4.0.5 里有一个很小的改动：他们把「查找并启动默认浏览器」从 72 毫秒降到约 10 毫秒。原因是 xdg-settings get default-web-browser 每次调用要花 72ms，因为那背后是一串纠缠的 POSIX shell 脚本。DHH 用 Claude Code 写了一个替代助手，直接读 mimeapps.list。本文解释这 62 毫秒省在哪、为什么一个 shell 脚本会这么慢，以及这种「用 AI 重写一个慢路径」的模式在什么情况下值得做。"
