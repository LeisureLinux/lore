description: "Linux 7.3 的合并窗口里，ext4 正式弃用了 data=journal 挂载模式，并计划在 2028 年（2027 年 LTS 版本之后）移除。这个模式把全部数据和元数据先写进日志再落到主文件系统，崩溃或掉电后可以重放日志恢复数据，是 ext4 三种数据模式里最安全也最慢的一种，代价是禁用延迟分配和 Direct I/O。本文梳理三种模式的真实差别、这个弃用对现有部署意味着什么，以及运维需要在那之前做什么。"
