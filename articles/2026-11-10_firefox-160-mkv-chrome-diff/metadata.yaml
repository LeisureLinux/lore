title: "Firefox 160 补上 MKV 的三种音轨：这是追平 Chrome，不是超越"
date: 2026-11-10
slug: firefox-160-mkv-chrome-diff
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Mozilla Firefox 160.0 官方 Release Notes + MDN Firefox 160 for developers + Bugzilla meta bug 1422891（含完整时间线与 FLAC/MP3 曾「不在计划」的原话）+ Bug 1991752（Firefox 145 默认启用 matroska）+ Bug 1991746 / 1991747 + Mozilla dev-platform「Intent to prototype: Matroska playback support」（含 Other browsers 栏）+ Chromium 官方 Audio/Video 支持页 + Chromium commit d081300（Matroska MIME 映射）+ Apple《Delivering Video Content for Safari》/《HLS authoring specification》/《Safari Web Content Guide – Creating Video》（容器与 MIME 清单）+ WebKit bug 260491 + caniuse FLAC 表与 MKV issue #7347 + Phoronix 报道（Michael Larabel，2026-11-09）"
original_date: 2026-11-09
original_url: "https://www.phoronix.com/news/Firefox-160-Released"
description: "本文解读 Firefox 160 的 MKV 支持，纠正一个容易被标题带偏的理解：Mozilla 这次加的不是「MKV 容器支持」，而是「MKV 容器里 FLAC / MP3 / PCM 三种音轨的解码」。容器本身早在 Firefox 145 就通过 media.mkv.enabled 默认启用；145 前后陆续补齐 AVC/AAC、Opus/Vorbis/VP8/VP9/AV1/HEVC。Bugzilla 里 Mozilla 工程师一年前明确写过 FLAC 和 MP3 还没实现、因为需要额外管线改造且用量有限，160 把这最后三种补上了。全文先拆清「容器是盒子、codec 是盒子里装的东西」两层，再与 Chrome 逐项对照五层差异：容器支持时间（Chrome 多年 vs Firefox 145）、音轨 codec 覆盖（Chrome 官方清单早有 FLAC/MP3/三种 PCM，Firefox 160 刚补）、MIME/扩展名识别（Chromium commit d081300 才补 matroska MIME 映射，此前访问 .mkv 会触发下载）、专有 codec（Chrome 品牌构建才含 AAC/H.264/H.265，纯 Chromium 与 Linux 发行版打包默认不含）、MSE 与 MediaRecorder（Firefox 的 Matroska in MSE 仍是 NEW）。专项回答 Safari / iOS：结论是 iOS Safari 不能原生播放 MKV 容器，Mozilla intent 邮件明写 WebKit (Safari): Not supported，Apple 官方容器清单只有 .mov/.mp4/.m4v/.3gp；但 AAC 恰恰是 Safari 强项（AAC-LC 是 iOS 基线，另有 ALAC、FLAC iOS 11+/Safari 13+、MP3、PCM via WAV/AIFF），视频侧 H.264/HEVC 硬件解码最全 —— 卡在容器解析不卡在 codec；同一段 H.264+AAC 放 MP4 播得飞起、remux 成 MKV 立刻放不了。iOS 上换浏览器也没用（全是 WebKit，编解码由 Core Media/AVFoundation 提供），真要放只能第三方播放器 App 或转 MP4/HLS；GNOME Web (WebKitGTK/GStreamer) 支持 MKV 不能外推到 Safari (Core Media)。附三方对照表、Firefox 160 其它变化（Web Speech 识别侧 40 语言端侧实时、PiP 0.25x–2.0x、macOS WebGL 走 Metal 等）、以及逐条事实边界（Apple 没发过「不支持 MKV」公告，是从官方清单反推；未实机逐个 canPlayType 验证）。"
published: true
