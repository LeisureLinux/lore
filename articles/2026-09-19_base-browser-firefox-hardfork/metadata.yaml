summary: "译介 Sarah Jamie Lewis 博客（2026-09-19）：她发起 Base Browser 项目（Codeberg），基于 Firefox 153 ESR 提供一套从代码库彻底删除（而非软禁用）所有 AI 集成/用户敌对功能的补丁；最初一个删除 patch 改 1605 文件、删 852,297 行、37MB，后用 git 不可逆删除标志+自定义 Python 压到 ~1MB。她认为删才对，因这些功能大且与核心紧耦合；坦言无足够资金/人力长期维护，但先做点什么。另探索离线(OpenZIM/Kiwix)、独立应用、feed 阅读器三条退路，并回望 Amaya/Flock「浏览器应可创造」的愿景。解读聚焦「删而非关」的工程诚实、git 大删除补丁可维护技巧、独立 web 生存策略。"
description: "译介 Sarah Jamie Lewis《Thoughts on the Future of Web Browsers》(2026-09-19) 并加工程解读。事实：作者因 Firefox 又一处 AI 集成在 Mastodon 呼吁各 fork 联手维护脱离 Mozilla 的硬分叉；催生 Base Browser 项目(Codeberg 组织)；她写 patch 删除 Firefox 全部 AI 集成代码——1605 文件变更、852,297 行删除、37MB，后与志愿者(cliffmccarthy/gellge 等)用 git 不可逆删除标志+自定义 Python 压到 <1MB 以便重打补丁；当前 Base Browser 基于 Firefox 153 ESR，物理删除用户敌对功能而非软禁用(禁用是常见软 fork 做法)。作者观点：删才正确，因功能大且与核心紧耦合、占代码比重升；准备好输(无资金/人力长期维护)，除非众人 pooling 努力；Firefox 已在想象整个浏览器上下文是 smartwindow、既为第三方 AI agent 也为人；自承非对的人但需先做点什么；临时退路：离线(OpenZIM reader/kiwix 图书馆)、独立应用替代 web app、feed 阅读器；回望 2000s Firefox 复兴、Amaya/Flock「浏览器应可创造」愿景，试建支持 gemini 协议与 RSS 的小浏览器，引口号 we need new noise。解读：①删而非关更诚实——软禁用代码仍在、升级易重新打开，物理删除砍攻击面/审计面，耦合越紧越不该在核心；②独立 web 生存策略(与 Tor/Waterfox 一脉但更激进)，git 不可逆删除压大 patch 的可维护技巧实用；③作者自承会输恰说明值得被看见，Codeberg 选型有意。"
