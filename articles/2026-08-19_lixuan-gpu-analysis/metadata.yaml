title: "砺算 LX 7G100 GPU 深度评测：国产显卡性能对标与生态建设现状"
summary: "CPU-Z 2.21 正式支持国产显卡砺算 LX 7G100，该卡基于自研 TrueGPU 天图架构，12GB GDDR6 显存，1920 分 3DMark Steel Nomad 成绩。本文从官方技术规格、性能指标、游戏兼容性、与 AMD/Intel/景嘉微等产品的横向对比，分析国产 GPU 的现状与未来。"
