description: "解读微软对 2026-11-12 Exchange Online / Microsoft 365 全球故障的 Post-Incident Review。官方根因是三因素叠加：① 7 月起灰度部署的一个专门针对 M365 网络网关服务器的 Windows 修复引入潜在缺陷，内部进程锁竞争耗尽 CPU/内存，实验室因流量组合与 SKU 不同（测的是核心少、性能弱的硬件）未能发现，而核心更多、更新的机器会加剧竞争；② 故障前约 15 小时，Teams 从备用网关故障转移到同时承载 Exchange Online 的主网关，负载与流量模式都变了 —— 这是正常容灾动作；③ 前一天另一起无关故障让约 14% 服务器容量离线，但冗余充足、单独看无影响。负载上升 + 容量下降触发潜伏缺陷，请求积压、服务器无响应，流量管理系统把用户导向健康端点，反而让同样负载压到更少机器上，形成雪崩式级联故障；不到两小时超过 80% 服务器无响应。数千个 capacity unit 本应按区域做舱壁隔离，但「另一个独立问题」使 bulkhead 失效，故障扩至全球。能切走的 Teams / OneDrive / SharePoint / Office 较早恢复，Exchange Online 因规模无法切离；恢复时节点一上线就被积压流量再冲垮，常规自动化恢复不覆盖「全集群无响应后重建」，且缺陷已潜伏数月，rollback / flighting / feature flag 都来不及撤销。修复方式是分批下线、回退 Windows 代码路径、重启再上线。文章后半忠实整理 r/sysadmin 的五类反应：更强硬件反而更易触发、实验室与生产脱节、没有「从零恢复」预案、bulkhead 失效被一句话带过、以及「用芳香的棕色墨水写成的 RCA」的戏谑；并补运维视角要点与边界（未验证 PIR 原文页面、社区评论为抓取时点状态、不替微软判定根因）。"
