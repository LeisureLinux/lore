original_source: "一手核对：微软官方 Post-Incident Review（用户提供的完整中文译文，内容对应 r/sysadmin 帖 u/Darking78 于 2026-11-15 前后转贴的官方 Root Cause 原文；web_fetch 取得 Reddit 帖子正文，经本机登录态 Chrome 取得 111 条评论，session 已关闭）＋ Reddit r/sysadmin 帖 https://www.reddit.com/r/sysadmin/comments/1xxiasy/microsoft_postincident_report_is_up_for_the/ 及顶层评论原文（含芳香的棕色墨水、更多 CPU 核心、从零恢复、另一个独立问题、PIR 不像 AI 生成等槽点）＋ The Register / TechCentral / StatusStack 等对本事故的报道（Teams 约 15:07 UTC 从备用网关故障转移到承载 Exchange 的主网关、前一天约 14% 容量离线、不到两小时超过 80% 服务器无响应）＋ 本工作区旧文《Microsoft 365 丢掉几个 9：SLA 的合同算术与架构师的账本》作口径对照。官方 PIR 原文要点按用户译文转写为通顺中文，未增删数字与技术结论；社区槽点按评论原文翻译。"
