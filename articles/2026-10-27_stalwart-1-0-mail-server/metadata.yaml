description: "Stalwart 1.0 于 2026-10-26 发布。作者 Mauro D. 从 2021 年 10 月的一个 Rust 邮件解析库（mail-parser）起步，五年后交付了一个支持 JMAP/IMAP/POP3/SMTP/CalDAV/CardDAV/WebDAV 的全栈邮件与协作服务器。官方宣布在 38 项对比 Postfix 3.11 + Dovecot 2.4 的基准中赢了 35 项。本文拆解它的技术内核：SIMD/SWAR 重写解析器、逐后端调优的存储层、重写的全文搜索引擎（带词位置、支持短语搜索）、覆盖 30+ Azure 区域的压测实验室（首轮抓出 64 个问题、第二轮 33 个），以及两个必须提醒的迁移断点：集群现在强制要 Redis、OAuth 转向 open public client profile（Apple Mail 正在采用）。"
published: true
