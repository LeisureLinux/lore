description: "解读 Computerworld 2026-11-09 报道：自 11 月 5 日起发往 Outlook / Hotmail / Live / MSN 的正常商务邮件被间歇性退回，NDR 报 550 5.7.1 或 550 5.7.23，提示缺少 SPF/DKIM/DMARC 认证（AS9031519）。微软无政策变更公告、无 postmaster 通知、无服务健康条目或博客，仅社区版主称「service degradation」正在调查，管理员提到事件号 EX1540236。关键落差：微软自 2025-05 起的官方规则（错误码 550 5.7.515）只要求每天向消费者邮箱发送 5000 封以上且同一 5322.From 域的高容量发件人补齐 SPF+DKIM+DMARC 并对齐；这次被拒的多是小型普通发件人（SMB/非营利/学校/律所/诊所），甚至有域名三项记录齐全仍被退回，且同批邮件时通时不通 —— 政策变更与 bug 可能同时在场。按五层拆解：现象与错误码、官方规则与落差、SPF/DKIM/DMARC 三层各管什么（对齐是关键）、quietly failing 的危害（发件人以为偶发翻篇、收件人根本不知道有信，发票/密码重置/预约确认/录用通知丢失）、防守方清单（dig +short TXT _dmarc 自查、补 v=DMARC1; p=none、M365 自定义域开 DKIM、别因退信甩锅 SPF 就重写、搜 11/5 起日志先重发时效事务邮件、记录完整 NDR 交给微软、最终目标 p=reject 并盘点 CRM/账单/HR/营销平台）。如实标注：微软未公布根因，dmarkoff 11/7 16/16 被拒、11/9 同域 16/16 被接受说明事件在波动可能部分恢复；DMARC 终会成为所有发件人的地板，但没人应该从一封退信里得知一条新规则。"
