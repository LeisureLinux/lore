original_source: "一手核对：Computerworld《Microsoft's email security is unexpectedly blocking legitimate business mail》（Taryn Plumb，2026-11-09）＋ Microsoft Support《Fix NDR error 550 5.7.515 in Outlook.com》（2025-05-02 官方高容量发件人规则）＋ Microsoft Learn 5.7.23 / 邮件认证排错文档 ＋ Microsoft Q&A「SPF VAlidation issue」（EX1540236 / AS9031519）＋ Microsoft 365 服务健康事件镜像 ＋ MailRoute / EasyDMARC / dmarkoff / Windows Report / Windows Latest 复核"
