description: "Ubuntu 26.10「Stonking Stingray」的安全改动清单：签名版 GRUB 移除 Btrfs/XFS/ZFS/HFS+ 等文件系统驱动与图片解析器以缩小攻击面、TPM 全盘加密覆盖无硬件信任根的机器、coreutils 全部迁移到 Rust、OpenSSL 4.0（含 ECH 与向量子混合）、upki 用本地缓存实现证书吊销检查、dbus-broker 替换 dbus-daemon、ntpd-rs 可测试。本文逐项梳理保护内容与升级前需要检查的地方。"
