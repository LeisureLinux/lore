original_source: "The Hacker News 报道（Ravie Lakshmanan，2026-11-27）＋ ek0ms savi0r 的 4HTTP2SHELL PoC 仓库 README（四个请求全文与四个信任失败）与 watchTowr 的 4HTTP2ROOT FAQ（2026-11-26）一手核对。"
description: "解读 Cacti 零日 4HTTP2SHELL/4HTTP2ROOT：最新版 Cacti Core 1.2.31 开启 guest 时，四个 HTTP 请求从匿名访客拿到服务器命令执行。链路：guest 经 auth_profile.php 把非数字字符串写进 preview_graphs_per_page → graph_view.php 读取 stored default 拼进 SQL LIMIT，PDO 接受堆叠语句形成二阶注入 → UPDATE poller_item.arg1 为 shell 命令 → graph_realtime.php 触发 realtime poller，arg1 未经白名单传给 popen()。四个失败：guest 可写数字设置为任意字符串、stored default 绕过请求校验、LIMIT 拼进 SQL、poller 执行数据库存储命令。无内存破坏无反序列化，日志唯一响动是非数字值 PHP warning。watchTowr：截至 11-27 无在野利用、无 CVE、无补丁；缓解为禁用 guest、限制 Web 界面、检查 poller 配置与日志。Cacti 常存全网凭证，是天然跳板。"
published: true
