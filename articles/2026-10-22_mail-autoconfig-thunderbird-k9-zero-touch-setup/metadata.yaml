description: "自建邮件服务器最烦的不是搭，是每换一台设备都要手填四个服务器字段，还经常被客户端自动探测猜错。本文用 SRV 记录 + autoconfig XML + Let's Encrypt 扩域三件套，让手机客户端只输邮箱和密码就能配好。文末附一个真实的踩坑：fail2ban 把运维者自己的 IP 封了，而排查过程中给出的三个错误结论，全都是因为测试方法不可靠。"
