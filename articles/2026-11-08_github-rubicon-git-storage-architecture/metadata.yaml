original_source: "一手核对：GitHub Engineering 博客《Inside GitHub's new Git storage architecture》（Karthik Raman & Brian Celenza，2026-11-05）全文与三张官方架构图"
original_date: 2026-11-05
original_url: "https://github.blog/engineering/architecture-optimization/inside-githubs-new-git-storage-architecture/"
description: "本文解读 GitHub 于 2026 年 11 月 5 日发布的《Inside GitHub's new Git storage architecture》。这套名为「Project Rubicon」的新架构，要解决的是一个很具体的问题：当 agent 开始并行往同一个仓库写代码，Git 原本「一次 push 一次协商」的模型就撑不住了。GitHub 给出的答案是两条原则 —— 最小化协调（minimize coordination）与存储计算解耦（decouple storage from compute）—— 并把它们落成三个组件：Spokes（路由与负载均衡不变）、虚拟副本（可抛弃的计算 fleet，本地盘只是缓存）、Ref-CAS（一个专门做引用状态 compare-and-swap 的复制日志服务）。架构上最值得记的一个判断是：Git 对象是不可变且以内容命名的，所以「一次 push 中真正需要达成一致的，只有引用更新」—— 而引用更新相比整个 pack 小得多。这就把「什么需要共识」这个问题缩小到了一个极小的范围。Ref-CAS 的设计有两个细节很值得学：一是它只存指针，不持有也不校验对象数据，虚拟副本在提交引用事务之前已经把 pack 上传到 Blob Storage，所以「引用永远只指向已经持久化的对象」；二是每次提交拿到一个 LSN，仓库版本就是最新提交的 LSN，读路径先做版本比对 —— 没变的话一次比较就够了。原文还诚实地交代了两个被放弃的方案及其失败原因：单一 blob 的 WAL 方案写吞吐卡在「每个 RTT 一次写」（实际是每秒几百）；分段 blob 方案抬高了写上限，但读必须检查所有分段，而读比写多几个数量级 —— 「我们拿写延迟换了读延迟，而读比写多几个数量级」。压测数据：内部测试展示支持 5000 个并发 agent 在一个仓库上工作、每秒 7200 次 push，同时读延迟保持一致低位。当前状态是有限私有预览，明年初更广泛铺开。"
