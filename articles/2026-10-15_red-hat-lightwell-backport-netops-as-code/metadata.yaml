description: "红帽在同一天发了两篇博客：一篇讲 Lightwell（与 IBM 联合推出的回移补丁服务），一篇讲 NetOps-as-Code 的季度进展。两篇都是产品营销稿，但里面有两组可以核实的数据和一个结构性判断值得记录：其一，修一个 CVE 之所以慢，主要不是因为找不到它，而是因为升级会破坏生产，所以解法是把安全修复回移到你正在跑的精确版本上；其二，代理驱动的网络自动化里，AI 只被用在做风险的优先级判断，而审批步骤是刻意保留的人工环节。"
