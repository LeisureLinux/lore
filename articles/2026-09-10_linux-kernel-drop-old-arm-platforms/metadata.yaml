summary: "Linux 7.3 已把大批老旧 32 位 ARM 平台标为 deprecated，Arnd Bergmann 随即发出 13 个补丁，一次清退 SA1100、Footbridge、RISCPC、OMAP24xx、i.MX31、STM32 MCU 线等十余个平台，释放超过 5.5 万行代码和设备树文件。补丁原可赶 Linux 7.4 合入，但他倾向放到 7.5：保持依赖简单、越过今年的 LTS 内核，并给残留用户留出申诉窗口。本文为 Phoronix 报道译文，附被移除平台清单、退役三段式机制解读，以及对嵌入式/工控生态的现实提醒。"
description: "Phoronix 2026-09-08 报道译文与解读：Linux 内核通过 Arnd Bergmann 的 13 个补丁计划移除约 5.5 万行老旧 32 位 ARM 平台代码（SA1100、Footbridge、RISCPC、Orion/Dove/MV78xx0、OMAP24xx、i.MX31、无 MMU i.MX、LPC18xx、STM32F4/F7/H7、Versatile MPS2、AT91 SAMV7、Axxia、PXA 板级文件），孤儿化驱动的连带清理将随之展开，目标 Linux 7.5。覆盖 deprecated→orphaned→removed 退役机制、MCU 平台上游化教训与国产嵌入式生态影响。"
