description: "一篇把「改 APK」从玄学变成可复现流程的深度教程。从 APK 到底是什么（ZIP + 编译后的二进制 AXML manifest + resources.arsc + DEX），到 DEX 的六张索引表与 0x70 字节头部每个偏移的含义（checksum 是 0x0C 起的 Adler-32、signature 是 0x20 起的 SHA-1，而 checksum 字段本身在签名区内 —— 所以修头部必须先算签名再算校验和），再到 smali 作为「DEX 的文本视图」为什么存在（因为反编译的 Java 是有损的、而二进制 DEX 人读不了，jadx 解不出来时它就打印 smali，天然是二者的桥）、64K 方法/字符串/字段引用上限如何逼出 multidex（每个 classesN.dex 有独立的 64K 预算）、以及三条工作流的取舍（apktool 全量重建 / --no-res 只动代码 / 直接改 DEX 二进制仅限等长改动且必须重算校验和与签名）。本文还完整梳理了签名机制：v1 逐条目校验（API<24 必需）、v2 覆盖整个 APK（Android 11+ 实际必需）、v3 支持换钥匙、v4 是独立的 .idsig；以及整条链路上唯一不能违反的顺序铁律 —— build → zipalign → apksigner，因为签名哈希字节而对齐移动字节，倒序 v2/v3 立刻失效。最后是「现实检查」：服务端证明改不了、混淆要用行为而非名字定位、Split APK 要先转 universal、以及改过的应用从此拿不到官方更新。"
