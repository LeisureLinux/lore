description: "F5 Labs 测出全球前 100 万网站有 54% 支持抗量子密钥交换，看起来接近半程。但 F5 Labs 自己的主管点破：去掉 Cloudflare 托管的站点，这个数字掉到 22%。本文梳理这 54% 到底测的是什么、CDN 之外那些「从外部看不见」的层（到源站的一跳、服务网格、VPN、SSH、代码签名）为什么才是真正的风险面，以及几个常被忽略的硬约束：PQC 证书还无法用于公共互联网、证书体积本身就是问题、47 天有效期与手工签发之间的冲突，以及 IETF 标准比 NIST 晚了近两年的节奏差。"
