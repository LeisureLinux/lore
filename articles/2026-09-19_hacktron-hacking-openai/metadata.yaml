summary: "Hacktron AI（2026-09-13）披露：串起 libheif 堆缓冲区溢出（Debian 缺失安全 backport，Discourse 经 ImageMagick 暴露）与 OpenAI SSO 身份缺陷，从 community.openai.com 论坛 72 小时内接管员工 ChatGPT/Codex 账号、触达内部仓库。利用由 Claude Opus 5（及 GPT-5.6 Sol）辅助编写，HEIF Heist 调查波及 Slack/Meta/GitHub Enterprise 等；OpenAI 赏金 $6,500。解读聚焦依赖 CVE 空白、SSO 身份桥辐射、利用成本崩塌与图像解码沙箱。"
description: "译介 Hacktron AI《Hacking OpenAI》红队复盘（Harsh Jaiswal/Mohan Pedhapati/Rahul Maini，2026-09-13）并加工程解读：9 步利用链（libheif→Debian backport→ImageMagick→Discourse→OpenAI 论坛→OpenAI SSO→ChatGPT/Codex→GitHub→内部仓库）；7-23 审 Discourse 图片管线发现 HEIC/HEIF 走 FastImage 不支持后交由 ImageMagick，暴露 libheif 解析器；有漏洞修复上游未标 CVE 致 Debian 12/13 带 1.19.7/1.19.8；Opus 4.8 写不出开 ASLR 利用，Opus 5 几小时内成功并自主 /goal 打到 Discourse Cloud 与 OpenAI 实例；以员工 Codex 开无害 PR 证明影响后停手。披露时间线：7-25 报 Bugcrowd、约 14 小时 OpenAI 修复、$6,500 赏金（仅认 OpenAI 侧发现，论坛侧 Discourse 经 HackerOne 另计）。HEIF Heist 跨月追 Slack/Meta/GitHub Enterprise/Node 框架，token 花费 <$3,000、三人。解读四条：依赖 CVE 空白的真实生产风险、SSO 身份桥的辐射半径、利用成本被 AI 压到几天改写漏洞处置节奏、图像解码应关进 hardened ephemeral 沙箱。"
