summary: "译介 Phoronix 报道（Michael Larabel，2026-09-19）：GNOME OS 新增文档站，并默认启用 zswap 以缓解小内存设备 OOM，靠 Rust 写的 zswap-generator systemd generator 落配置、内核命令行 zswap.enabled=0 可关；第三方应用 Convey（Geary 邮件客户端 fork）登陆 Flathub，加 Microsoft 365 支持、移植 GTK4 并带修复/UX 改进。解读聚焦 zswap 是内存压缩写回缓存而非 swap、治「假 OOM」，及 Geary→Convey 折射 GTK4 迁移长尾中 fork 替社区补位。"
description: "译介 Phoronix《GNOME OS Turns To Zswap To Deal With OOM Issues, Progress On Geary Email Client Fork》(Michael Larabel, 2026-09-19) 并加工程解读。事实：本周 GNOME 51 之外，① GNOME OS 新增文档站(gnome-build-meta docs)并提供上手指引；② GNOME OS 默认启用 zswap 以保持小内存机器快而跟手、缓解 OOM，实现靠 Rust 写的 zswap-generator systemd generator 生成配置，尊重内核命令行 zswap.enabled=0 关闭；③ 第三方应用 Convey 作为 Geary 邮件客户端 fork 首登 Flathub，加 Microsoft 365 支持、移植 GTK4、附修复与 UI/UX 改进；更多见 This Week in GNOME #266。解读：zswap 是内存内压缩写回缓存（页换出先压缩暂存内存池，池满才落 backing swap），治「假 OOM」、用少量 CPU 压缩换不触发 OOM/换页风暴，对小内存/试玩/笔记本设备贴场景；用 Rust systemd generator 落配置且可 zswap.enabled=0 关，延续 shell/unit→内存安全 Rust 小工具趋势（同 ubuntu rust-coreutils、mold Rust 重写）。Convey 折射 GTK4 迁移长尾里社区维护跟不上、外部贡献者 fork 补位（抬到 GTK4 事实基线 + 补 MS365 企业需求），也是开源自我修复的姿势。"
