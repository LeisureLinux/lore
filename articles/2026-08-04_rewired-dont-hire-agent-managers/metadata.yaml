summary: "麦肯锡说 AI 时代会诞生「Agent Manager」新岗位。管过银行六万台终端、带过跨国运维团队的我却有不同的意见：管理智能体这活儿我早干过，真正的「Agent Manager」不该是一个人，而是一层编排（orchestration）。"
description: "针对麦肯锡《Rewired》及 Julie Goran《The rise of agent managers》的深度读后思考。作者用三十年 IT 运维、六万台银行终端的真实经历，论证有限理性（bounded rationality）决定的管理幅度约束如何被 AI 智能体打破，进而提出真正的「Agent Manager」不是一个人，而是一层编排。"
