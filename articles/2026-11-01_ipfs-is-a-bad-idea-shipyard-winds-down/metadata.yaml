description: "一个 Reddit 帖子的核心论断是：「IPFS 什么都没解决，我猜某人只是想把他 2021 年 100 欧元的 Filecoin 砸盘套现。」而它出现的时机，恰好在 IPFS 生态一次结构性退场之后 —— 2026 年 8 月 24 日，核心维护方 Shipyard 宣布因 Protocol Labs 不续约经费而将于 9 月 30 日全面停止 IPFS 相关工作，Kubo、Helia、Boxo、Rainbow、IPFS Desktop 等一夜之间失去专职维护者，ipfs.io / dweb.link / check.ipfs.network / 引导节点 / Wikipedia-on-IPFS 等公共基础设施同时停运。CryptoBriefing 把其中的讽刺说透了：「Protocol Labs 创建 Shipyard 正是为了避免 IPFS 维护依赖单一组织的预算决定，两年后，正是单一组织的预算决定杀死了这个安排。」本文逐条核对了那个帖子的四个论断（匿名性、比 HTTP/BitTorrent 更快、比云存储便宜、消除单点故障），指出三个是错的、一个是半对的 —— 关键在于它把「协议层的去中心化」与「基础设施层的去中心化」混成了一层来评判；并梳理了三个层次的框架：协议（完好）、基础设施（这次退场正是它的剧烈变化，连带 Netcraft 分析出的 Bad Bits Denylist 政策风险与钓鱼面变化）、经济（已由 Filecoin Onchain Cloud 于 2026-08-12 主网上线、靠「数据持有证明」正式接管，CID 不变所以应用无需改引用）。而对做技术选型的人，真正的结论是：IPFS 的核心价值从来不是「更便宜的 CDN」或「更快的 BitTorrent」，而是「内容寻址 + 可独立验证」—— 而这次退场唯一没有伤到它。"
