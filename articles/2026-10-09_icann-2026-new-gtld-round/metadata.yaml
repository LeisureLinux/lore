description: "ICANN 2026 轮新顶级域 Reveal Day 公布 1,615 份申请、481 个申请方，单份评估费 22.7 万美元。本文用 ICANN 公开的争用集数据算出：263 个争用集、891 份申请处于争用状态，占全部申请的 55.2%。而 2026 轮禁止一切私下和解（含私下拍卖），意味着更多争用只能进入 ICANN 拍卖。再对照 2012 那轮 1,930 份申请、653 份撤回的历史，以及 .ai 靠一个巧合拿到 8,500 万美元年收入的不可复制性，把这轮圈地的账算清楚。"
