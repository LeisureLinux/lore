original_source: "⭐ 一手核对：eMudhra 官方事件页与 impacted-intermediates.json / roots.json（原始 PEM 与吊销数据）+ eMudhra 公司声明（2026-10-20 / 10-21）+ Ubuntu 官方博客与 USN-8944-1 / USN-8944-2 / USN-8947-1 + Launchpad Bug #2061817 与 #2171922 / #2171995 + Kudelski Security 技术分析 + Cloudflare + Unit 42 + Microsoft MSRC + Apple 官方指引 + Mozilla Bugzilla 2083449"
