description: "本文解读 2026 年 10 月的 eMudhra CA 事件与 Ubuntu 的处置。文章的重点不是「证书被吊销了」，而是一个更反直觉的技术事实：⭐ 八个中间 CA 的私钥不是「泄露」了，而是「本可以由任何人从公开证书里算出来」 —— eMudhra 在 2025-04-30 的密钥生成仪式上写错了脚本，产生的私钥有效值是 4、56、66、115、155、156、230、237，而证书里声明的是 NIST P-384 公钥（384 位）。⭐ 这意味着这把「私钥」从 2025 年 4 月 30 日起就不是秘密 —— 任何拿到公开证书的人都能自己签出任意域名的证书。本文梳理了完整时间线（2025-04-30 密钥仪式 → 2026-10-17 研究者向 Mozilla 报告并用私钥签名「We have a problem here - Wayne」→ 10-18 eMudhra 吊销 → 10-19 Sectigo 吊销交叉签名 → 10-20 Mozilla 紧急吊销 emSign ECC Root CA - G3 → 10-21 Oracle 发 CVE-2026-91403）、八个中间 CA 与十六张证书的完整清单、四个根证书在四大根程序中的实际收录状态、以及为什么 Ubuntu 采取的是「移除两个根」而不是「移除八个中间」。⭐ 文章还详细写出了 Ubuntu 处置里最容易被忽略、也最危险的一环：ca-certificates 更新不会同步 Java 的 keystore —— 这是 2011 年就存在的 ca-certificates-java bug（Launchpad #2061817 / Debian #1069251），导致已从系统信任库移除的根证书在 Java 里仍然是可信的，因此必须手动 rm -f /etc/ssl/certs/java/cacerts && update-ca-certificates --fresh。最后讨论了 Chrome/Firefox 靠 CT 与吊销机制免疫、而 curl / 容器 / 嵌入式设备 / IoT 不免疫的根因，以及 Go、Electron 应用、JetBrains IDE 这类自带信任库的客户端为何「升级操作系统也没用」。"
