description: "Google 的 Sergey Senozhatsky 提交了 zram 的大幅重构补丁：把压缩流拆成独立的 per-CPU 读流与写流，消除抢占式 zram 下的优先级反转（读被写阻塞）；并让重压缩只用单例流，省下每个上下文/每 CPU「几十到几百 KB」。本文拆解这次重构解决了什么、省了多少、以及普通用户该不该关心。"
