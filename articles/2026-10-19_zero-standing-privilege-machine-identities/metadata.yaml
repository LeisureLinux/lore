description: "CSO Online 这篇评论文章的论点是：机器凭据的「保管+轮换」只是买时间，因为轮换改的是密码，不改的是权限。真正的问题是没人负责关掉它。本文核对它引用的三组数据（109:1、61%、7.5%），追溯 Salesloft Drift 事件里 700 家组织被洗的机制，并补上作者没展开的一点：Okta 靠 IP 白名单加 DPoP 挡住了同一次攻击，这证明「令牌约束」比「令牌轮换」更接近答案。"
published: true
