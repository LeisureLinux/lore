description: "Ghostty 1.4.0 于 2026-10-27 发布，是七个月、172 位贡献者、2889 个 commit 的大版本。本文梳理其中最有信息量的几块：Kitty 图形协议做到 100% 完整（成为 Kitty 之外第一个做到这一点的终端，含动画与相对定位，图形解析用 SIMD 后快 16 倍）；scrollback 透明压缩让物理内存降 70–90%，默认上限从 10 MB 提到 50 MB，空终端从 128 KiB 降到 16 KiB，隐藏标签页 GPU 内存从 385 MiB 降到 18 MiB；一个关于 macOS 内核把 pty 读取截断到约 1 KiB 的意外发现带来 25–55% 的 I/O 吞吐提升与 5.7 倍的 VT 解析加速；GTK 端改用 EGL + DMABUF 三重缓冲解决分数缩放模糊；以及 10 个安全公告 —— 其中「粘贴保护未把回车当作行结束符」这一条值得所有用终端的人注意。"
published: true
