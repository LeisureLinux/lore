title: "ForgeRock 默认口令 admin:admin：车门和引擎就这样被远程打开"
date: 2026-11-09
slug: forgerock-adminadmin-connected-car-takeover
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Sam Curry 与 Shubham Shah 的原始技术文章《Hacking Two Automakers via ForgeRock Path Confusion, RCE, and Remote Vehicle Access》（2026-11-07）＋ Shubham Shah 的澳大利亚链路文章《unlocking any car from X brand in most of the world》（2026-11-07）＋ The Hacker News 报道（Swati Khandelwal，2026-11-09）＋ Ping Identity 的 OpenIDM / IDM 生产加固指南"
original_date: 2026-11-07
original_url: "https://samcurry.net/forgerock"
description: "本文解读 Sam Curry 与 Shubham Shah 于 2026 年 11 月 7 日公布的研究：两家车企的手机 App 登录体系可被完全接管，进而对联网车辆执行解锁车门、启动引擎等远程指令。而整条链的起点是一个荒诞到近乎滑稽的东西：ForgeRock OpenIDM 内置的 Apache Felix 管理控制台仍在用文档里的默认口令 admin:admin。这不是产品漏洞——没有 CVE、没有厂商公告——而是部署配置的失误，且 Ping Identity 自己的生产加固指南多年来一直明确要求「上线前移除该控制台或改掉口令」。全文最值得学的是那条 WAF 绕过：边界与 Java 后端对同一个 URL 的解析不一致——研究者用编码斜杠、点段与分号路径参数，让边界把请求判成无害的静态文件，而 servlet 容器把它归一化成 /system/console。进控制台后用内置的调度器运行 Groovy 脚本，在存放客户记录的身份服务器上拿到命令执行，改掉目标账号的邮箱和密码，再通过正常 App 登录拿到与真实用户相同的 token。但比技术链更值得写的是研究者的边界感：完整链路只在美国账户/车辆上测过、车辆指令只在自己拥有或获得同意的车上执行、测试后把真实邮箱改回去；两篇 write-up 都没有说是否有人在修复前发现或使用过这条路径。第二条链路（澳大利亚）更说明问题：那个环境的入口不是默认口令，而是嵌在 App JavaScript bundle 里的测试用 admin 凭据，且 MFA 可通过 ROPC 流程整体跳过；研究者还让 GPT-5.6 Sol Ultra 花了约六小时找到了 /static%2f..%2fopenidm/ 这个未被 WAF 覆盖的路径。两家车企在报告后约两小时内修复并轮换了凭据。本文给出防守方该做的两项检查（查 /system/console、不要依赖边界/WAF 的路径规则来藏管理页），并说清一个常被误读的点：品牌名字被隐去、且研究者明确说明不具名是应对方要求。"
published: true
