title: "CachyOS 与 Omarchy 4.5 跑分：图形谁吃亏、编译谁占便宜"
date: 2026-11-07
slug: cachyos-omarchy-arch-benchmarks
category: 技术/解读
author: FreeLAMP.com
original_source: "一手核对：Phoronix《Arch Linux vs. CachyOS vs. Omarchy 4.5 Performance Benchmarks》（Michael Larabel，2026-11-06）全 7 页的逐页结论与测试环境说明"
original_date: 2026-11-06
original_url: "https://www.phoronix.com/review/cachyos-omarchy-arch-benchmarks"
description: "本文解读 Phoronix 于 2026 年 11 月 6 日发布的《Arch Linux vs. CachyOS vs. Omarchy 4.5 Performance Benchmarks》全 7 页结果，并把它从跑分流水账整理成「谁在什么地方吃亏、为什么」。测试环境是同一台 Framework Desktop 机器（AMD Ryzen AI Max+ 395「Strix Halo」、64GB 内存、集显 Radeon 8060S、2TB WD_BLACK SN7100 NVMe），三个系统分别是 Arch Linux（通用 archinstall + KDE Plasma）、CachyOS（默认安装并更新）、Omarchy 4.5（原生安装）。关键前提：CachyOS 跑的是 Linux 7.3，而 Omarchy 和 Arch 上游当时都还在 7.2；三个系统都是 GCC 16.2；而 Omarchy 默认用 performance 性能配置、Arch 和 CachyOS 在这台笔记本上默认是 balanced —— 这个差异是解读很多结果的关键。逐项结果：图形测试里 CachyOS 与 Arch 用 Mesa 26.2 表现相当，Omarchy 明显落后，归因指向 Hyprland 而非另外两者使用的 KDE Plasma Wayland（Xonotic 这类第一人称射击也最慢）；压缩与编解码里 Omarchy 因 performance 配置而在多数 Zstd 测试和 OpenAPV 编码上小幅领先，SVT-AV1 被 CachyOS 拿下，x265 编码 CachyOS 最快；编译与科学计算是 CachyOS 的强项 —— 7-Zip、各类开源项目构建时间、GNU Octave 都最快，PyTorch 也是它但优势很薄；数据库方面 Omarchy 在 ClickHouse 上小幅领先、PostgreSQL 结果混杂、Blender 5.2 CPU 渲染三者无明显差异；脚本侧 CachyOS 的 Python 拿下多场胜利，其 PHP 包的优化程度明显比另两者激进；浏览器里 CachyOS 与 Omarchy 咬得很紧，Llama.cpp 三者无显著差异。120 多项测试的几何平均结果是 CachyOS 第一，但只是略微领先。本文的落点：CachyOS 的领先几乎全部来自「预编译优化过的包」，而 Llama.cpp 三家打平正是「发行版预编译优化这条路只对发行版愿意替你编译的软件有效」的现成证据；真正值得拿去做决策的，是那些明确打平的项目 —— PostgreSQL、Blender CPU 渲染、Llama.cpp，换发行版在这些地方一分钱收益都没有。"
published: true
