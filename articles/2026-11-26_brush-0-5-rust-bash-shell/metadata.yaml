title: "Brush 0.5：Rust 写的 Bash 兼容 shell，跑通 96% 上游测试"
date: 2026-11-26
slug: brush-0-5-rust-bash-shell
category: 技术/解读
author: FreeLAMP.com
original_source: "Phoronix 报道（Michael Larabel，2026-11-26）＋ Brush GitHub 仓库与 crates.io 的 brush-shell/brush-parser 0.5.0 页面、官方 brush.sh 发布说明与安装文档一手核对。"
description: "解读 Rust 编写的 Bash/POSIX 兼容 shell Brush 0.5：通过超过 96% 上游 bash-completion 测试套件，兼容性测试从上一版 2100 增到 3600+；多数 Bash 脚本不改就能跑。本轮改进含更可靠的管道与作业控制、组合 shell 特性处理、对现有工具（fzf/atuin/starship/zoxide/mise）支持、交互式 shell 增强、预编译 Windows 二进制和性能提升。介绍模块化 crate（brush-core/parser/builtins/interactive/shell）、读取 .bashrc 与可编程补全、测试体系（矩阵覆盖 Linux x86_64/aarch64/macOS 及多发行版容器）、可验证发布（签名 provenance + SHA-256），以及它和 uutils/coreutils 等 Rust 重写系统工具潮流的意义。"
published: true
