original_source: "GitHub emirmrkaljevic/behave README 与 upstream-findings（MIT，2026-10-13 建库）＋ Emir Mrkaljević 的 Rust 用户论坛帖（2026-11-13：40 报告/47 PR/33 合并）＋ DEV 系列文章（10-14 / 11-06 / 11-09 / 11-10）＋ uutils/coreutils README 与 0.12/0.13 发布说明＋ Ubuntu Discourse 状态更新＋ 本号 2026-09-14 Ubuntu 26.10 文章交叉核对。"
description: "解读 Behave 对 uutils 的黑盒差分测试。澄清误传：Behave 是 Go 写的、核心比对 stdout/stderr/退出码（非完整文件系统 diff）、40 是累计报告数（11-13 口径 40 报告/47 PR/33 合并）。梳理 probe→run→diff 流程、flaky 标记与 normalizer、真实缺陷（cp f/、mv -n z z、sort --check --merge、seq -inf、tail 007）、锁定 GNU 9.12 基准等方法论，以及对 AI/现代语言重写基础设施的启示。"
