summary: "X.Org Server 26.1 第二个候选版本发布，这是自 2021 年 21.1 以来首个新功能版本。RC2 修 XKB/X Input、更新 Meson，并抬高扩展与视频驱动 ABI（利好 NVIDIA 闭源驱动）。XWayland 26.1 RC2 同步释出。"
description: "译自 Phoronix 2026-09-10：X.Org Server 26.1 RC2 发布，五年磨一剑，含 XKB/X Input 修复、Meson 更新与 ABI 抬升；附 XWayland 26.1 RC2。含维护模式定位、NVIDIA ABI、XWayland 兼容层等解读。"
