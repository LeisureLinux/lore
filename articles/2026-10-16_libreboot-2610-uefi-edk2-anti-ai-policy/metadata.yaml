description: "Libreboot 26.10（代号 Ominous Olive）于 2026 年 10 月 15 日发布。这份 changelog 自己把「在 lbmk 里新增 AGENTS.md 反 AI 政策」列为本次发布最重要的变更，排在了「完整 UEFI 支持」之前。而这个 UEFI 支持本身是另一个重大变化：Libreboot 从「不提供 UEFI」（除少数板子上的 U-Boot）变成「几乎所有板子默认使用开源 UEFI 实现」，靠的是 MrChromebox 的 EDK2 payload，并因此导入了 233 台 Chromebook。本文按它自己的排序讲这两件事，并说明为什么「反 AI 政策」这个标题选择本身就是一份声明。"
