summary: "QEMU 11.1.0 累计 3200+ commit、285 位作者，没有爆点但到处都是小升级。本文按架构（ARM / RISC-V / PowerPC / HPPA / s390x）、子系统（UFS 4.1 仿真 / virtio-gpu / GUI / 迁移 / 监控器）和安全补丁三块完整拆解。"
description: "QEMU 11.1 是 11.x 系列的第一个维护性更新，于 2026 年 8 月 11 日发布，包含 3200+ commit、285 位作者贡献。本文详解 ARM 端（hvf 嵌套虚拟化、virt board vGIC、GICv5 实验性支持、Tegra241 CMDQV、i.MX 8MM EVK 与 32 位 guest 引导、FP8/SME/SSVE/MTE 等大量新特性、WFE/WFET 真语义）、RISC-V 端（首次大端目标支持、Zbr/Zvfbfa/Zicbop/BFloat16、K230 board、OpenSBI v1.8.1）、PowerPC（Power11/PowerNV11 成默认、MPIPL 支持、nest MMU）、HPPA（SeaBIOS-hppa v25、HP-UX 9 TLB 修复）、s390x（ASTFLE facility 2）、存储与设备（UFS 4.1 Write Booster 与 HID、virtio-rtc + vhost-host-user）、GUI（vc chardev 字符编码、qemu-vnc 独立 server）、迁移（RDMA chunk 控制、enhanced query-migrate 含 VFIO 状态）、监控器（QMP/HMP 热插拔、close-action）、用户态仿真（preadv2/pwritev2、fsmount、coredump）以及安全修复（CVE-2026-63318、CVE-2026-8348、CVE-2026-6502 等）。"
published: true
