summary: 'Computerworld 资深安全分析师 JR Raphael 深度解读谷歌新推出的自拍照登录安全功能：这项可在紧急情况下使用自拍照验证身份的功能，为谷歌账号提供了最后一道安全防线。本文原文翻译 + 深度补充，详细解析 6 个核心事实 (设置简单、仅用于账号登录、最后防线、隐私加密、自主控制训练、仅支持个人账号),并提供完整设置指南、常见问题解答、与其他恢复方案对比、实操建议，帮助用户在不影响隐私前提下提升账号安全性。'
description: '谷歌 2024 年推出的自拍照登录功能是一项可在常规验证方法失效时通过自拍视频验证身份的备用方案。Computerworld 原文 (JR Raphael) 详细介绍了该功能的 6 个核心事实:1) 设置极其简单;2) 仅用于谷歌账号登录，与设备解锁无关;3) 作为最后防线仅在紧急情况下使用;4) 数据全程加密且用户可删除;5) 可自主选择是否用于机器学习训练;6) 目前仅适用于个人账号 (不支持 Workspace 和高级防护账户)。本文在翻译基础上增加了完整设置教程、FAQ、安全对比分析、实操建议，帮助用户理解如何在保护隐私前提下启用这一救命稻草功能。原文链接：https://www.computerworld.com/article/4204562/google-selfie-security.html'
