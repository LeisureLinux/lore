summary: "新闻+背景梳理（非演讲全文翻译，详细内容仅 YouTube 视频）。新闻事实：LWN《The Kernel Report 2026 edition》(2026-09-24)——停办两年后 Corbet 在 Kernel Recipes 2026 讲了更新版 Kernel Report，审视内核社区正发生什么、如何应对一段加速变化期、未来走向，视频在 YouTube。Kernel Recipes 2026(第13届,巴黎,9/21-23,推 corbet 任 patron/教父)；主办方称距 Corbet 上次在 KR 讲 Kernel Report 已十年、距该演讲上次出现在议程已两年。Corbet 是内核文档 maintainer、LWN.net 联合创始人兼执行主编、《Linux Device Drivers 3e》第一作者。演讲摘要原文仅三句：『停办两年后 Kernel Report 回来了。内核开发正经历一段加速变化(a period of accelerated change)的时期。本演讲将审视内核社区正在发生什么、可能走向何方，并着眼于将于 10 月举行的 Maintainers Summit。』背景(均标注公开来源、不归于演讲)：①AI 生成补丁压倒 maintainer——网络子系统 Jakub Kicinski 在 Linux 7.3 pull request 称『我们完全被淹没了』，net/net-next 各合并 632/648 补丁，net-next 三分之一到一半似 AI 驱动的低优先级修复/清理/澄清(Dataconomy/Hardware Busters 2026-08)；②Torvalds 称『新常态』——7.2-rc7 是多年最大 rc6、『我不太高兴这个规模』但『这就是现实：新常态，大量修复，很多是各种 AI 工具审查出来的』，AI 用于审查而非写码、补丁仍由人撰写(The Register/TechRadar 2026-08)；③社区把 AI 规则写进文档——2026-04 落地 coding-assistants.rst，AI 参与需 Assisted-by 标签，AI 不能用 Signed-off-by，提交者承担全部责任(byteiota 2026-08)；④Sashiko AI 审查系统——Google Roman Gushchin 打造、2026-03 发布、用 Gemini 3.1 Pro 审 LKML 补丁，Greg KH 背书，亦在本届 KR 议程(Gushchin 主讲)；⑤Maintainers Summit(10月)是摘要点名落点，呼应内核文档《Linux kernel project continuity》(极端情况如何召集最近一届 Summit 受邀者与 LF TAB 讨论顶层仓库持续管理)；⑥同场议程(《Futex》Rostedt、《DAMOS》Park、《Security in the LLM age》Greg KH、《Rust for Linux》Ojeda、《Swap and Memory Reclaim》Song、《Large scale kernel build testing》Bergmann)本身就是加速变化清单。解读：①该报告价值在 maintainer 视角的年度纵览而非新消息，回归说明社区到了需重新纵览的节点；②2026 最尖锐矛盾是『AI 让产出变快』与『维护带宽固定』的错配——生成补丁成本趋零、审查成本未降；③治理被拉回视野：coding-assistants.rst(责任归属)、Assisted-by/Signed-off-by 区分(法律边界)、项目连续性文档(延续机制)，为『人的责任』建制度；④对工程实践者，上游节奏与规则正在变(AI 署名/审查流程/维护者过载)会向下游传导，跟随 maintainer 关切比追单个 CVE 更能预判摩擦点。"
description: "新闻+背景梳理稿（非演讲全文翻译；演讲详细内容目前只有 YouTube 视频、无文字稿，不替演讲者转述未公开论点）。新闻事实来源：LWN《The Kernel Report 2026 edition》（2026-09-24，jzb）——停办两年后，LWN 的 Jonathan Corbet 在 Kernel Recipes 大会呈现更新版 Kernel Report，审视内核社区正发生什么、如何应对一段加速变化期、未来走向，演讲视频在 YouTube。Kernel Recipes 2026 为第 13 届、巴黎、2026-09-21~23；Corbet 任本届 patron(荣誉教父)并参与编排议程；主办方口径：距 Corbet 上次在 Kernel Recipes 讲 Kernel Report 已十年，距该演讲上次出现在议程已两年。Corbet 身份：内核文档 maintainer、LWN.net 联合创始人兼执行主编、《Linux Device Drivers, Third Edition》第一作者。演讲摘要原文（主办方页面）仅三句：『停办两年之后，《Kernel Report》回来了。内核开发正经历一段加速变化(a period of accelerated change)的时期。本演讲将审视内核社区正在发生什么、以及它可能走向何方，并着眼于将于 10 月举行的 Maintainers Summit（维护者峰会）。』背景部分（均标注公开来源、明确不归于本次演讲）：(1) AI 生成补丁把 maintainer 压到过载——网络子系统 maintainer Jakub Kicinski 在 Linux 7.3 pull request 直言『我们完全被淹没了(completely overwhelmed)』，net 与 net-next 各合并 632/648 补丁，net-next 三分之一到一半看起来是 AI 驱动的低优先级修复、清理和澄清（Dataconomy、Hardware Busters，2026-08）；(2) Torvalds 定为『新常态』——2026-08 在 7.2-rc7 公告称该 rc 很大、是多年来最大 rc6（按提交数），『我不太高兴这个规模』但『这就是现实：新常态，大量修复，其中很多是各种 AI 工具审查出来的』，区分 AI 用于审查而非写代码、补丁仍由人撰写并经子系统 maintainer 流程提交（The Register、TechRadar，2026-08）；(3) 社区把 AI 规则写进文档——2026-04 落地 coding-assistants.rst：AI 参与撰写或审查需 Assisted-by 标签，AI 系统不能用带法律效力的 Signed-off-by，提交者承担全部责任（bug/安全/许可）（byteiota 等，2026-08）；(4) Sashiko AI 审查系统——Google 的 Roman Gushchin 打造、2026-03 发布、用 Gemini 3.1 Pro 审阅提交到 LKML 等的每个补丁、Greg Kroah-Hartman 公开背书，且亦出现在本届 Kernel Recipes 议程（Gushchin 主讲 The Sashiko review system）；(5) Maintainers Summit（10 月）是摘要点名落点，呼应内核文档《Linux kernel project continuity》：规定极端情况下如何召集最近一届 Maintainers Summit 受邀者与 LF TAB 讨论顶层内核仓库的持续管理——为『分布式项目+中心化终审』结构准备延续性方案；(6) 同场议程本身是加速变化清单：《Futex: The good, the bad and the ugly》(Steven Rostedt)、《DAMOS: The Smart Cruise Control for RAM》(SeongJae Park)、《Security in the LLM age》(Greg KH)、《Rust for Linux》(Miguel Ojeda)、《Swap and Memory Reclaim: Squeezing Out More RAM》(Kairui Song)、《Large scale kernel build testing on a desktop》(Arnd Bergmann)、MPTCP、FPE、RK3588 视频解码等。解读：①该报告价值在于 maintainer 视角的年度体检而非新消息，停办两年后回归本身说明社区到了需重新纵览的节点；②2026 最尖锐矛盾不是技术争论，而是『AI 让产出变快』与『维护带宽固定』的错配——生成补丁成本趋零、审查成本未同步下降，Kicinski『完全被淹没』/Torvalds『新常态』/Sashiko/`coding-assistants.rst` 是同一问题不同侧面；③治理被重新拉回视野：coding-assistants.rst(责任归属)、Assisted-by/Signed-off-by 区分(法律边界)、项目连续性文档(延续机制)是为『人的责任』建制度；④对内核/发行版工程实践者，上游节奏与规则正在变（AI 署名、审查流程、维护者过载），会向下游传导，跟随 Kernel Report 里 maintainer 的关切比追单个 CVE 更能预判未来摩擦点；10 月的 Maintainers Summit 是下一个观察点。"
