description: "GhostBSD 26.2-R15.1p6 于 2026-10-27 发布，基座升级到 FreeBSD 15.1-RELEASE。本文在转述官方发布说明之外，实际拉取了 ghostbsd/install-station、networkmgr、update-station 三个仓库的 README 与源码目录做交叉核对，重点解释三件事：一、新安装器把「装系统」和「首次启动配置」拆成 Install Station 与 Setup Station 两段，这个拆分本身就是这两年桌面安装器设计变化的一个缩影；二、Update Station 的四类升级（Packages / Release / Minor / Major）与 ZFS boot environment 的关系 —— 「升级不碰运行中的系统」这个模型是 FreeBSD 相对 Linux 发行版最实在的优势之一，而 GhostBSD 把它做成了图形界面的日常操作；三、38 种语言的安装器本地化覆盖与「ISO 瘦身 46 个包」这类不显眼但决定项目存活的工程取舍。附「隐藏引导菜单」「USB HID 默认启用」「NetworkMgr 改用 wpa_cli」等实用变化。"
published: true
