title: "「打开 Postman 之后，你的 Codex 开始念 Postman 的经」：一次产品同意边界的越界"
date: 2026-11-04
slug: postman-desktop-auto-installs-agent-plugins
category: 技术/解读
author: FreeLAMP.com
original_source: "⭐ 一手核对：GitHub Issue postmanlabs/postman-app-support#14370 全文与全部 47 条评论 + postmanlabs/postman-plugin 仓库在报告者锁定的 revision 6c8e452e0f4237f4bcc0901cb1ac442dec707e49 上的源码（installer/src/hosts/codex-hooks.ts、hooks/session-start-context.md、README.md）+ GitHub API 的仓库元数据与 commit 历史"
original_date: 2026-10-25
original_url: "https://github.com/postmanlabs/postman-app-support/issues/14370"
description: "本文解读 2026 年 10 月 25 日在 Postman 官方 issue tracker 上提交、并迅速获得 400+ reaction 的一个报告。核心事实：报告者在 macOS 上打开 Postman 桌面版后发现，Postman 自动在他的 Codex 与 Claude Code 里安装了插件、注册了远程 MCP 连接、装上了 CLI，并在 Codex 里写入了一条「会话启动时必读」的指令钩子 —— 而这条指令的内容是「在回应任何非平凡的 API 工程任务前，先加载 postman:api-engineer 技能」。更关键的是：Postman 的安装器自己给自己批准的钩子信任（installer/src/hosts/codex-hooks.ts 的 approvePostmanHook() 通过 hooks/list 取哈希、config/batchWrite 把 hooks.state upsert 成 trusted），而仓库 README 里对此有明确记载：For Codex, installation also approves Postman's session-start hook… There is no separate hook prompt or dump of its instructions. —— 也就是说这不是 bug，这是设计。⭐ 而报告的六条证据质量在安全报告里相当罕见：Postman 自己的日志记录了 auto-existing-upgrade 与 autoInstall.plugin.existing-user、~/.codex/config.toml 里的 marketplace 与 hooks.state 哈希、~/.claude/settings.json 与 installed_plugins.json、mcp.codex.json 指向 mcp.postman.com/mcp 且 Codex 日志显示 Auth required（即远程连接实际未建立成功），⭐ 而报告者明确划界：this report establishes unwanted integration and instruction changes; it does not claim to establish data exfiltration.⭐ Postman 官方回应（2026-11-03）承认了「捆绑 CLI 与 agent 插件是因为很多用户自己装不起来」，⭐ 但只承诺「让 opt-in 更清楚，尤其对老用户」，⭐ 并「正在复查 hook 批准与 session-start 行为」—— ⭐ 社区的反驳是关键：应该对所有人都是 opt-in。⭐ 本文还记录了另一条被广泛质疑的处理方式（先在自家下载页撤掉说明，Wayback Machine 的 10-26 快照证明那页当时并无相关文字），⭐ 以及一个被忽略的事实：⭐ postman-plugin 仓库创建于 2026-09-11（距事发仅 6 周）、⭐ 而安装器支持的 harness 名单有 9 个（antigravity / claude-code / codex / copilot / cursor / factory / kimi / opencode / pi），⭐ 也就是说一次 Postman 启动可能在机器上的 9 个 agent 工具里各留一份。"
published: true
