summary: "Fedora 47 变更提案拟将链接时优化从 Fat LTO 切换到 Thin LTO：更快、更省内存、扩展性更好，用 -flto=thin 即可启用。提案引入新的 RPM macro 降低采用门槛，不强制任何包使用，但为未来系统级强制变更留了伏笔，仍需 FESCo 投票。本文为 Phoronix 报道译文，附解读：Thin vs Fat LTO 的工程账本、Fedora 式渐进主义路径，以及与 RHEL 10 x86_64-v3 基线抬升的联动。"
description: "Phoronix 2026-09-04 报道译文与解读：Fedora 47 Thin LTO 变更提案（Changes/Thin-LTO-Build-Flag），覆盖 ThinLTO 机制（索引+并行后端 vs Fat LTO 全量 IR）、RPM macro 落地方式、打包者决策路径、FESCo 投票流程，以及 Arch/Gentoo 对比、RHEL 构建基线抬升与 Ubuntu amd64v3 的联动分析。"
