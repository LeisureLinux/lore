description: "「邮件加密」听起来只有一件事，实际上是四件：连接到你邮箱服务器的 TLS、服务器之间的传输加密、静态存储加密、以及端到端加密 —— 而它们各自防的是完全不同的威胁，也各有各的代价。本文以 Fastmail 的这篇科普为骨架，但补了三处它没说的东西：① DNSSEC 的可用性风险在 2026 年又验证了一次 —— 5 月 5 日 DENIC 在一次例行密钥轮换中给 .de 域发了错误的 DNSSEC 签名，导致数百万域名返回 SERVFAIL，Cloudflare 用 RFC 7646 负信任锚（干脆放弃验证）+ RFC 8767 serve stale 才缓解，这比 Fastmail 引用的 2023 年 Cloudflare 1.1.1.1 事故更严重，且真出事时运营者的第一反应是绕过验证而非修复；② 核对了 1999 年《Why Johnny Can't Encrypt》原文，Fastmail 说的「12 人中只有 4 人」准确 —— 原文结论是「only one-third」，而失败的根因不是密码学，是「公钥模型」没传达给用户：11 个搞懂怎么加密的人里 7 个只用自己的公钥，三人把秘密明文发了出去，其中一人还以为加密是透明的；③ 零访问加密的四条边界（新入邮件仍可被服务商截获、收件人/时间戳/主题等元数据不加密、浏览器场景下解密代码在服务商服务器上因而只防只读入侵、发件人处始终有明文副本）。而全篇最核心的判断来自作者自己的诚实承认：这四层保护没有一个能同时满足保密性、可用性与防滥用，而密碼学家 Schneier 的总结是「我们想要的邮件系统和加密并不容易兼容」。"
