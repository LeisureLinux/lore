description: "Meta 工程师 Gregory Price 在 Linux Plumbers Conference 2026 上展示了 CRAM（Compressed RAM）：让硬件直接对压缩内存做缓存行级访问，压缩页保留在页表里，读不再走「缺页 + 解压 + 搬回普通内存」那条软件路径。幻灯片数据显示只读场景下吞吐是 DRAM 的 98% 以上，而 zram 约 1.1 M ops/s，据此得出的 452 倍差距。但这个数字有三重限定：纯读、演讲明确标注所有测量都在 DRAM 上完成以隔离缺页开销、以及写比率一上来差距就从 37 倍掉到 5.4 倍。本文梳理 CRAM 的三个容量控制机制、它需要的那类硬件目前基本不存在这件事，以及与 zram/zswap 的路径差异。"
