description: "TP-Link 开放首款 Wi-Fi 8 路由器 Archer 8 Ultra 的全球预售，覆盖英国、德国、澳大利亚等市场，但美国不在名单上——因未获 FCC 有条件批准，新款无线硬件实质上被禁止在美销售。本文梳理产品规格、Wi-Fi 8 的真实能力边界（单设备提速 33%，但需要全链路换代），以及这场监管冻结对网络设备供应链的含义。"
