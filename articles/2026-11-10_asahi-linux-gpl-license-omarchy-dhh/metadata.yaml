description: "本文查实一件被标题党简化成「Asahi Linux 因 Omarchy 把 MIT 改成 GNU」的事。核对官方《Progress Report: Linux 7.3》（James Calligeros，2026-11-07）原文后可以确定：改动是真的（所有仓库开始迁移到 GPL v2 or later，今后只用强 copyleft）；理由也是真的（有人从开发者个人 fork 里搬走尚在开发的功能代码、不署名发布、或用 LLM 懒改写以掩盖来源，而 MIT 明确允许、没有针对恶意行为者的例外）；但官方全文没有出现 Omarchy、DHH 或任何项目名，且把理由放进了一个历史类比：WINE 原本也是 MIT，2002 年因商业化专有 fork 改用 LGPL。本文也核对了 Asahi 的生成式 AI 政策（因净室逆向工程的法律风险而广泛禁止生成式 AI 用于实质贡献）与 DHH 的四组发言，并如实记录第三方指出的问题：It's FOSS 说报告没有点名任何人、也没说明历史贡献者是否同意重新许可；OpenBSD 开发者 Bryan Steele 批评此举看似未经所有既往贡献者同意；GPL 拦不住已经无视 MIT 的人，它改变的是商业化收益。落点：把没点名写成点名是媒体推断；真正值得讨论的是宽松许可在 AI 改写时代的处境，以及贡献者同意这个开源治理难题。"
