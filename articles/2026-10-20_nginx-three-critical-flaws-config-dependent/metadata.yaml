description: "F5 为 nginx 发了三个 CVSS 4.0 9.2 的应急补丁（CVE-2026-15176 / 97205 / 93479），影响 NGINX Plus、开源版、Ingress Controller、Gateway Fabric 和 Instance Manager。而我认为这三个洞最值得注意的地方是它们的「触发条件」：全部需要特定配置组合才成立，所以真正该做的不是查版本号，是查配置文件。本文还纠正了两处常见误读：97205 其实是 use-after-free 而不是堆溢出；三个洞在 NVD 里都是 AC:H（攻击复杂度高），这与「应急补丁」的印象有张力。"
