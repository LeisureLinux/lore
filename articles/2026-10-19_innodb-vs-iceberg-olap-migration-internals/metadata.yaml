description: "一个人把自己的股票分析系统从 MySQL/InnoDB 迁到 Iceberg + Spark + Polaris，然后写了一篇逐项对照两个引擎内部机制的复盘。本文顺着他的思路解释 InnoDB 的三个保证、Iceberg 的俄罗斯套娃式三层剪枝、两种原子提交的相反解法，并特别保留他自己承认的那个错误：他把日期放在主表里，导致每张指标表都要 join 回主表；修这个错误时数据库已经超过 100GB。"
